document.addEventListener('change',async event=>{const t=event.target;try{
 if(t.id==='v7-role'){if(!ETV5.canNavigate()){t.value=V.role();return;}A.ui.productRole=t.value;A.ui.roleEventId=A.state.events[0]?.id;A.ui.selectedPeople=[];if(!V.eventAllowed(A.state.activeEventId))A.state.activeEventId=A.ui.roleEventId;if(!V.allowed(A.route))A.navigate(t.value==='AGENCY'?'agency-home':'overview');else A.render();return;}
 if(t.id==='f-v7-event-status'){A.ui.eventStatus=t.value;A.render();}
 if(t.id==='f-v7-poster-format'){A.ui.posterFormat=t.value;A.render();}
 if(t.dataset.photoSelect){let set=new Set(A.ui.photoSelected||[]);t.checked?set.add(t.dataset.photoSelect):set.delete(t.dataset.photoSelect);A.ui.photoSelected=[...set];A.render();}
 if(t.dataset.mediaId){await send('media.usage',{id:t.dataset.mediaId,usage:t.value});}
 if(t.id==='f-v7-template-choice'){const val=W().product.templates.find(x=>x.id===t.value);if(val){A.ui.v7Campaign={...A.ui.v7Campaign,title:document.querySelector('#v7-campaign [name=title]')?.value||val.name,content:val.content,templateId:val.id,channel:val.channel};A.render();}}
 if(A.route==='campaign-compose'&&['f-target','f-group'].includes(t.id)){Object.assign(A.ui.v7Campaign,data(document.getElementById('v7-campaign')));A.render();}
 }catch(err){A.toast(err.message,'error');}});
document.addEventListener('input',ev=>{if(ev.target.id==='v7-event-query'){A.ui.eventQuery=ev.target.value;A.render(true);}});
let lastEvent=A.state.activeEventId,wallTimer,outputAssetKey='';
function enhance(){
 if(lastEvent!==A.state.activeEventId){A.ui.photoSelected=[];A.ui.v7Campaign=null;A.ui.v7CampaignStep=1;A.ui.drawerTab='info';lastEvent=A.state.activeEventId;}
 if(A.route==='participants'){
  const s=document.getElementById('f-v5-group');if(s)W().product.groups.forEach(g=>{if(![...s.options].some(o=>o.value===g))s.add(new Option(g,g));});
  const bar=document.querySelector('.ux-selection-bar>div');if(bar&&V.editable('participants')&&!bar.querySelector('[data-action=v7-group-bulk]'))bar.insertAdjacentHTML('afterbegin',B('그룹 변경','v7-group-bulk','sm','people'));
 }
 if(A.route==='staff'&&V.q().booth){const chooser=document.getElementById('f-v5-staff-booth');if(chooser){chooser.disabled=true;chooser.setAttribute('aria-label','공유 링크에 지정된 담당 부스');}}
 const r=P.route(A.route);if(r?.scope==='event'&&!V.editable(r.group)){
  document.querySelectorAll('button[data-action]').forEach(b=>{if(!actionIsRead(b))b.disabled=true;});
  document.querySelectorAll('form:not([data-ux-no-dirty]) button[type=submit]').forEach(b=>b.disabled=true);
 }
 // All old footer notes are removed from task UI; boundaries remain in the documentation and chrome.
 document.querySelectorAll('.source-note,.v4-source,.phone-demo,.participant-brand-line').forEach(n=>n.remove());
 document.body.dataset.dsVersion='7.0.0';
 clearInterval(wallTimer);
 if(A.route==='screen-output'){
  const cfg=V.outputData().settings||{},figs=document.querySelectorAll('.et7-output-photos.layout-spotlight figure');let i=0;
  const tick=()=>figs.forEach((f,j)=>f.classList.toggle('is-current',j===i));if(figs.length){tick();wallTimer=setInterval(()=>{i=(i+1)%figs.length;tick();},Math.max(3,cfg.seconds||10)*1000);}
 }
}
window.addEventListener('et:rendered',enhance);
window.addEventListener('pagehide',()=>clearInterval(wallTimer));
// Route parameters are applied before a view is constructed (not after the scanner renders).
V.prepare=()=>{const q=V.q();const event=new URLSearchParams(location.search).get('event');if(!A.ui.v7InitialEventApplied&&event&&A.state.workspaces[event]){A.state.activeEventId=event;A.ui.v7InitialEventApplied=true;}
 if(q.unit){const u=W().units.find(u=>u.id===q.unit);if(u){A.ui.unitId=u.id;A.ui.unitName=u.name;A.ui.checkAction=u.action;}}
 if(q.booth&&W().booths.some(b=>b.id===q.booth))A.ui.staffBooth=q.booth;
 if(A.route==='campaign-compose'&&q.template&&A.ui.v7LoadedTemplate!==q.template){const t=W().product.templates.find(t=>t.id===q.template);if(t){A.ui.v7Campaign={title:t.name,content:t.content,channel:t.channel,templateId:t.id,target:'ALL',group:'ALL'};A.ui.v7CampaignStep=2;A.ui.v7LoadedTemplate=q.template;}}
};
// Basic media playback must not restart on unrelated count updates.
V.keepOutput=()=>{if(A.route!=='screen-output')return false;const d=V.outputData(),cfg=d.settings||{},video=document.querySelector('.et7-output-video');return !!video&&cfg.type==='media'&&video.getAttribute('src')===d.media.find(a=>a.id===cfg.assetId)?.data;};
A.render();
})();

</script>
</body>
</html>
