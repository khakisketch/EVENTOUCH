<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이벤터치 운영</title>
  <link rel="stylesheet" href="styles/tokens.css" />
</head>
<body>
  <header>
    <h1>이벤터치 운영</h1>
    <p role="note">샘플 데이터입니다</p>
    <nav aria-label="주요 화면">
      <button type="button" data-view="overview">개요</button>
      <button type="button" data-view="participants">참가자</button>
      <button type="button" data-view="checkin">체크인</button>
      <button type="button" data-view="booth">부스</button>
      <button type="button" data-view="participant">홈</button>
      <button type="button" data-view="stage">무대</button>
    </nav>
  </header>
  <main id="app" data-current-view="overview">
    <section id="overview-view" aria-label="행사 개요" hidden>
      <div id="overview-mount"></div>
      <div><button type="button" data-report-create>보고서 생성</button></div>
      <div id="results-mount" aria-label="결과"></div>
      <div id="settings-mount" aria-label="설정"></div>
    </section>
    <section id="participants-view" aria-label="참가자 목록" hidden>
      <div id="people-list" aria-live="polite"></div>
    </section>
    <section id="checkin-view" aria-label="체크인" hidden>
      <label for="ticket-code">티켓 코드</label>
      <input id="ticket-code" type="text" data-ticket autocomplete="off" />
      <button type="button" data-ticket-submit>조회</button>
      <button type="button" data-online-toggle>온라인/오프라인 전환</button>
      <div id="checkin-mount"></div>
    </section>
    <section id="booth-view" aria-label="부스" hidden>
      <div id="booth-mount"></div>
    </section>
    <section id="participant-view" aria-label="참가자 홈" hidden>
      <div id="home-mount"></div>
    </section>
    <section id="stage-view" aria-label="무대" hidden>
      <div id="stage-mount"></div>
    </section>
  </main>
  <script>
    window.ETKO = window.ETKO || {};
    fetch('data/sample.json')
      .then((res) => res.json())
      .then((data) => {
        window.ETKO.sample = data;
        if (window.ETKO.syncParticipantsView) window.ETKO.syncParticipantsView();
        if (window.ETKO.syncViews) window.ETKO.syncViews();
      });
  </script>
  <script src="app.js"></script>
  <script src="features/views.js"></script>
  <script src="features/agency.js"></script>
  <script src="features/participants.js"></script>
  <script src="features/checkin.js"></script>
  <script src="features/booth.js"></script>
  <script src="features/registration.js"></script>
  <script src="features/desks.js"></script>
  <script src="features/booths.js"></script>
  <script src="features/engagement.js"></script>
  <script src="features/media.js"></script>
  <script src="features/messaging.js"></script>
  <script src="features/content.js"></script>
  <script src="features/stage.js"></script>
  <script src="features/results.js"></script>
  <script>
    /* ETKO-VIEW-SYNC: gate all six views behind ETKO.navigate.
       Follows the syncParticipantsView pattern (Task 3 interface): show the
       section for ETKO.currentView, hide the other five, render the active
       mount when its renderer exists. Call-through preserves app.js semantics
       exactly (unknown views keep the current view); guarded so double-load
       never re-wraps. Section wrappers carry no aria-live of their own so the
       per-view live regions (people-list, check-in result panel) never nest. */
    (function () {
      var ETKO = window.ETKO || (window.ETKO = {});

      var SECTIONS = {
        overview: 'overview-view',
        participants: 'participants-view',
        checkin: 'checkin-view',
        booth: 'booth-view',
        participant: 'participant-view',
        stage: 'stage-view',
      };

      var MOUNTS = {
        overview: 'overview-mount',
        checkin: 'checkin-mount',
        booth: 'booth-mount',
        participant: 'home-mount',
        stage: 'stage-mount',
      };

      // Prefer the single view registry when loaded; fall back to the
      // local maps above so older shells keep working.
      try {
        if (typeof ETKO.viewRegistry === 'function') {
          var reg = ETKO.viewRegistry() || [];
          for (var ri = 0; ri < reg.length; ri += 1) {
            var rv = reg[ri];
            if (rv && rv.id && rv.section) SECTIONS[rv.id] = rv.section;
            if (rv && rv.id && rv.mount && MOUNTS[rv.id]) MOUNTS[rv.id] = rv.mount;
          }
        }
      } catch (err) {}

      function escapeHtml(value) {
        return String(value === undefined || value === null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function docOf(overrideDoc) {
        if (overrideDoc) return overrideDoc;
        if (typeof document !== 'undefined') return document;
        return null;
      }

      function setHidden(section, hidden) {
        if (
          section.setAttribute &&
          section.removeAttribute
        ) {
          if (hidden) section.setAttribute('hidden', '');
          else section.removeAttribute('hidden');
        } else {
          section.hidden = !!hidden;
        }
      }

      function renderActive(doc, view) {
        try {
          // The directory keeps its own gate + render; delegate to it.
          if (view === 'participants') {
            if (typeof ETKO.syncParticipantsView === 'function') ETKO.syncParticipantsView(doc);
            return;
          }
          var mountId = MOUNTS[view];
          if (!mountId || !doc || typeof doc.querySelector !== 'function') return;
          var section = doc.querySelector('#' + SECTIONS[view]);
          var mount =
            section && typeof section.querySelector === 'function'
              ? section.querySelector('#' + mountId)
              : null;
          if (!mount) return;
          if (view === 'checkin' && typeof ETKO.renderCheckin === 'function') {
            ETKO.renderCheckin(mount, ETKO.checkinState);
          } else if (view === 'booth' && typeof ETKO.renderBooth === 'function') {
            ETKO.renderBooth(mount);
          } else if (view === 'participant' && typeof ETKO.renderHome === 'function') {
            ETKO.renderHome(mount, ETKO.homeStatus);
          } else if (view === 'stage' && typeof ETKO.renderStage === 'function') {
            ETKO.renderStage(mount, ETKO.stageState);
          } else if (view === 'overview') {
            var name =
              ETKO.sample && ETKO.sample.event ? ETKO.sample.event : '이벤터치 운영';
            mount.innerHTML =
              '<p>' + escapeHtml(name) + '</p><p role="note">샘플 데이터입니다</p>';
            // Results + settings live behind the overview gate: they render
            // with the default view through ETKO.navigate, never as dead
            // mounts. Each renderer is guarded so older shells keep working.
            try {
              var resultsMount = section.querySelector
                ? section.querySelector('#results-mount')
                : null;
              if (resultsMount && typeof ETKO.renderResults === 'function') {
                ETKO.renderResults(resultsMount);
              }
              var settingsMount = section.querySelector
                ? section.querySelector('#settings-mount')
                : null;
              if (settingsMount && typeof ETKO.renderSettings === 'function') {
                ETKO.renderSettings(settingsMount);
              }
            } catch (err) {
              var msg = err && err.message ? err.message : '화면을 표시하지 못했습니다';
              if (section.querySelector) {
                var rm = section.querySelector('#results-mount');
                if (rm && !rm.innerHTML) rm.innerHTML = '<p>' + escapeHtml(msg) + '</p>';
              }
            }
          }
        } catch (err) {
          try {
            var activeSection = doc && doc.querySelector ? doc.querySelector('#' + SECTIONS[view]) : null;
            if (activeSection) {
              var fallback = activeSection.querySelector ? activeSection.querySelector('#' + mountId) : null;
              if (fallback && !fallback.innerHTML) fallback.innerHTML = '<p>화면을 표시하지 못했습니다</p>';
            }
          } catch (innerErr) {}
        }
      }

      // Show the current view's section, hide the other five. Returns true
      // when the current view's section was found and shown; false otherwise
      // (absent section, unknown view, or no document, e.g. Node).
      ETKO.syncViews = function (overrideDoc) {
        var doc = docOf(overrideDoc);
        if (!doc || typeof doc.querySelector !== 'function') return false;
        var current = ETKO.currentView;
        if (!SECTIONS[current]) return false;
        var found = false;
        Object.keys(SECTIONS).forEach(function (view) {
          var section = doc.querySelector('#' + SECTIONS[view]);
          if (!section) return;
          if (view === current) found = true;
          setHidden(section, view !== current);
        });
        if (!found) return false;
        renderActive(doc, current);
        return true;
      };

      // Consume ETKO.navigate: re-sync every section after each view switch.
      if (typeof ETKO.navigate === 'function' && !ETKO.viewsNavHooked) {
        ETKO.viewsNavHooked = true;
        var baseNavigate = ETKO.navigate;
        ETKO.navigate = function (view) {
          var result = baseNavigate(view);
          try {
            ETKO.syncViews(null);
          } catch (err) {}
          return result;
        };
      }

      // Field wiring: ticket submit -> workspace ETKO.scan, booth mode ->
      // event lock with Korean surfacing, home CTA -> next action.
      function submitTicket(doc) {
        var input = doc.querySelector ? doc.querySelector('#ticket-code') : null;
        var code = input && input.value ? input.value : '';
        if (typeof ETKO.scan !== 'function') return;
        var result = ETKO.scan({ code: code, direction: ETKO.checkinDirection || 'IN', online: ETKO.online !== false });
        ETKO.lastScanResult = result;
        try {
          var mount = doc.querySelector ? doc.querySelector('#checkin-mount') : null;
          if (mount && typeof ETKO.renderCheckin === 'function') ETKO.renderCheckin(mount, ETKO.checkinState);
        } catch (err) {}
        if (input) {
          input.value = '';
          try {
            input.focus();
          } catch (err) {}
        }
      }

      function wireFieldActions(doc) {
        if (!doc || typeof doc.addEventListener !== 'function') return;
        if (doc.__etkoFieldWired) return;
        doc.__etkoFieldWired = true;
        doc.addEventListener('click', function (ev) {
          var t = ev && ev.target && ev.target.closest ? ev.target.closest('[data-ticket-submit],[data-booth-mode],[data-home-cta],[data-online-toggle],[data-report-create]') : null;
          if (!t) return;
          if (t.hasAttribute && t.hasAttribute('data-report-create')) {
            try {
              var evName = '행사';
              try {
                var st = ETKO.store;
                var found = null;
                (st.events || []).forEach(function (e) {
                  if (e && e.id === st.activeEventId) found = e;
                });
                if (found && found.name) evName = found.name;
              } catch (err) {}
              if (typeof ETKO.createReport === 'function') ETKO.createReport({ title: evName + ' 결과 보고서' });
              ETKO.syncViews(doc);
            } catch (err) {
              try {
                var resultsMount = doc.querySelector ? doc.querySelector('#results-mount') : null;
                if (resultsMount) {
                  var alert = resultsMount.querySelector ? resultsMount.querySelector('[data-report-error]') : null;
                  if (!alert) {
                    alert = doc.createElement('p');
                    alert.setAttribute('data-report-error', 'true');
                    alert.setAttribute('role', 'alert');
                    resultsMount.appendChild(alert);
                  }
                  alert.textContent = (err && err.message) || '보고서를 생성하지 못했습니다';
                }
              } catch (innerErr) {}
            }
            return;
          }
          if (t.hasAttribute && t.hasAttribute('data-online-toggle')) {
            if (typeof ETKO.setOnline === 'function') ETKO.setOnline(!(ETKO.online !== false));
            try {
              var checkinMount = doc.querySelector ? doc.querySelector('#checkin-mount') : null;
              if (checkinMount && typeof ETKO.renderCheckin === 'function') ETKO.renderCheckin(checkinMount);
              else ETKO.syncViews(doc);
            } catch (err) {}
            return;
          }
          if (t.hasAttribute && t.hasAttribute('data-ticket-submit')) {
            submitTicket(doc);
            return;
          }
          if (t.hasAttribute && t.hasAttribute('data-booth-mode')) {
            var mode = t.getAttribute('data-booth-mode');
            try {
              if (typeof ETKO.setEventBoothMode === 'function') {
                ETKO.setEventBoothMode(mode, { acknowledge: true });
              } else if (typeof ETKO.setBoothMode === 'function') {
                ETKO.setBoothMode(mode);
              }
              ETKO.lastBoothError = null;
            } catch (err) {
              ETKO.lastBoothError = err && err.message ? err.message : '부스 방식을 변경할 수 없습니다';
              try {
                var boothMount = doc.querySelector ? doc.querySelector('#booth-mount') : null;
                if (boothMount) {
                  boothMount.setAttribute('data-error', ETKO.lastBoothError);
                  var alert = boothMount.querySelector ? boothMount.querySelector('[data-booth-error]') : null;
                  if (!alert) {
                    alert = doc.createElement('p');
                    alert.setAttribute('data-booth-error', 'true');
                    alert.setAttribute('role', 'alert');
                    boothMount.appendChild(alert);
                  }
                  alert.textContent = ETKO.lastBoothError;
                }
              } catch (innerErr) {}
            }
            try {
              ETKO.syncViews(doc);
            } catch (err) {}
            return;
          }
          if (t.hasAttribute && t.hasAttribute('data-home-cta')) {
            var status = ETKO.homeStatus || null;
            if (!status && ETKO.homeParticipantId && typeof ETKO.workspace === 'function') {
              try {
                var people = ETKO.workspace().participants || [];
                for (var i = 0; i < people.length; i += 1) {
                  if (people[i] && people[i].id === ETKO.homeParticipantId) {
                    status = people[i].status;
                    break;
                  }
                }
              } catch (err) {}
            }
            if (!status && typeof ETKO.workspace === 'function') {
              try {
                var first = (ETKO.workspace().participants || [])[0];
                if (first) status = first.status;
              } catch (err) {}
            }
            status = status || 'registered';
            if (typeof ETKO.renderHome === 'function') {
              try {
                ETKO.homeStatus = status;
              } catch (err) {}
            }
            var entered = String(status).trim().toLowerCase() === 'in';
            ETKO.navigate(entered ? 'stage' : 'checkin');
          }
        });
        doc.addEventListener('keydown', function (ev) {
          if (ev && ev.key === 'Enter' && ev.target && ev.target.id === 'ticket-code') {
            ev.preventDefault();
            submitTicket(doc);
          }
          if (ev && ev.key === 'Escape') {
            var openDialog = doc.querySelector ? doc.querySelector('[role="dialog"][data-open="true"], [role="dialog"].open') : null;
            if (openDialog) {
              if (openDialog.removeAttribute) {
                openDialog.removeAttribute('data-open');
                if (openDialog.classList) openDialog.classList.remove('open');
              }
              var returnTo = openDialog.getAttribute ? openDialog.getAttribute('data-return-focus') : null;
              if (returnTo && doc.getElementById) {
                var target = doc.getElementById(returnTo);
                if (target && target.focus) {
                  try {
                    target.focus();
                  } catch (err) {}
                }
              }
            }
          }
          if (ev && ev.key === 'Tab') {
            var trap = doc.querySelector ? doc.querySelector('[role="dialog"][data-open="true"], [role="dialog"].open') : null;
            if (trap && trap.querySelectorAll) {
              var focusables = trap.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
              var visible = [];
              for (var fi = 0; fi < focusables.length; fi += 1) {
                var el = focusables[fi];
                if (el && el.getClientRects && el.getClientRects().length) visible.push(el);
              }
              if (visible.length) {
                var firstEl = visible[0];
                var lastEl = visible[visible.length - 1];
                if (ev.shiftKey && doc.activeElement === firstEl) {
                  ev.preventDefault();
                  lastEl.focus();
                } else if (!ev.shiftKey && doc.activeElement === lastEl) {
                  ev.preventDefault();
                  firstEl.focus();
                }
              }
            }
          }
        });
      }

      // Browser only: apply the initial gate once the DOM is ready.
      if (
        typeof document !== 'undefined' &&
        document &&
        typeof document.addEventListener === 'function'
      ) {
        wireFieldActions(document);
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            ETKO.syncViews(document);
          });
        } else {
          try {
            ETKO.syncViews(document);
          } catch (err) {}
        }
      }
    })();
  </script>
</body>
</html>
