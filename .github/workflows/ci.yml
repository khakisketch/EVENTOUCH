name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The vanilla app is retired: apps/web (Next) is the sole UI and the Node
# server is API-only. Every browser audit drives the running Next build
# through the same-origin test gateway backed by a real API and an isolated
# PostgreSQL schema — never a mocked API, never the demo database.
#
# Each job owns a separate PostgreSQL service database, so jobs may run in
# parallel. Within a job everything runs serially: the backend suite shares
# one database and the login throttle is address-keyed, so parallel files
# report auth failures that do not exist serially.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventouch_test
          POSTGRES_USER: eventouch
          POSTGRES_PASSWORD: eventouch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventouch -d eventouch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install root and web dependencies
        run: npm run setup

      - name: Install Chromium for browser-backed regression tests
        run: npx playwright install --with-deps chromium

      - name: Verify migrations apply to a clean database
        # Proves the migration chain is valid on its own, independently of
        # whether the integration suites happen to touch every table.
        env:
          DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_test
        run: npm run db:migrate

      - name: Re-verify migrations are idempotent
        env:
          DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_test
        run: npm run db:migrate

      - name: Run the suite against PostgreSQL
        # scripts/run-tests.cjs fails the job when anything is skipped, so a
        # green build here means the backend integration tests really ran.
        env:
          EVENTOUCH_TEST_DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_test
        run: npm test

      - name: Typecheck the TypeScript server modules
        # Converted modules run without a build step (Node 24 type stripping);
        # this is the check that keeps runtime and types the same file.
        run: npm run server:typecheck

      - name: Typecheck the new app
        run: npx --prefix apps/web tsc --noEmit -p apps/web/tsconfig.json

      - name: Build the new app
        run: npm --prefix apps/web run build

      - name: Verify API image reads owner-only source as non-root
        # Docker COPY preserves source modes. Include owner-only files in a
        # throwaway build context and exercise the image as its declared user.
        run: |
          set -eu
          context="$(mktemp -d)"
          trap 'rm -rf "$context"' EXIT
          mkdir -p "$context/apps/web/lib" "$context/data"
          cp Dockerfile package.json package-lock.json "$context/"
          cp -R server "$context/server"
          cp apps/web/lib/client-address.mts apps/web/lib/sms-text-validation.cjs apps/web/lib/attendance-state.cjs apps/web/lib/cancellation-state.cjs "$context/apps/web/lib/"
          cp data/sample.json "$context/data/"
          chmod 600 "$context/package.json" "$context/server/messaging-solapi.js" "$context/server/commands/content-results.js" "$context/apps/web/lib/sms-text-validation.cjs"
          docker build -t eventouch-ci:api-permissions "$context"
          docker run --rm --network none --read-only --entrypoint node eventouch-ci:api-permissions -e '
            const assert = require("node:assert/strict");
            const solapi = require("/app/server/messaging-solapi.js");
            require("/app/server/commands/content-results.js");
            const provider = solapi.createSolapiProvider({configured:true, sender:"01011112222", apiKey:"fixture", apiSecret:"fixture", host:"http://127.0.0.1", kakaoPfId:"fixture"});
            assert.equal(provider.buildMessage({channel:"SMS", to:"01011112222", text:"hello 🎉"}).error, "SMS_CHARSET_UNSUPPORTED");
            assert.equal(provider.buildMessage({channel:"SMS", to:"01011112222", text:"안내"}).message.type, "SMS");
            assert.equal(provider.buildMessage({channel:"ALIMTALK", to:"01011112222", text:"hello 🎉", templateId:"fixture", smsFallback:false}).message.kakaoOptions.disableSms, true);
          '

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install root and web dependencies
        run: npm run setup

      - name: Dependency vulnerability gate (root omit=dev + web, moderate+)
        # Conservative and explicit: the default gate fails on moderate and
        # above for both lockfiles. Loosening it needs an explicit --level
        # flag, so a weakened threshold always shows in the diff.
        run: npm run security:audit

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventouch_mobile
          POSTGRES_USER: eventouch
          POSTGRES_PASSWORD: eventouch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventouch -d eventouch_mobile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install root and web dependencies
        run: npm run setup

      - name: Install the browser for the audit
        run: npx playwright install --with-deps chromium

      - name: Audit real device profiles in both orientations
        # 6 devices x 2 orientations x 6 real Next routes = 72 layout audits
        # plus 44px target coverage. It does not replace holding the device;
        # see scripts/device-checklist.md for what still needs a human.
        env:
          EVENTOUCH_MOBILE_DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_mobile
          DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_mobile
          WEB_BASE: http://127.0.0.1:8777
        run: |
          npm run db:migrate
          npm --prefix apps/web run build
          (PORT=8777 npm --prefix apps/web run start & echo $! > /tmp/next-mobile.pid)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8777/ >/dev/null && break; sleep 2; done
          npm run mobile
          kill "$(cat /tmp/next-mobile.pid)"

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventouch_a11y
          POSTGRES_USER: eventouch
          POSTGRES_PASSWORD: eventouch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventouch -d eventouch_a11y"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install root and web dependencies
        run: npm run setup

      - name: Install the browser for the audit
        run: npx playwright install --with-deps chromium

      - name: Audit accessibility across the new app
        # Serious and critical WCAG A/AA violations fail the job: public,
        # operator, staff, unknown-slug, unauthenticated private and error
        # states against the running Next build with a real API.
        env:
          EVENTOUCH_A11Y_DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_a11y
          DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_a11y
          WEB_BASE: http://127.0.0.1:8777
        run: |
          npm run db:migrate
          npm --prefix apps/web run build
          (PORT=8777 npm --prefix apps/web run start & echo $! > /tmp/next-a11y.pid)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8777/ >/dev/null && break; sleep 2; done
          npm run a11y
          kill "$(cat /tmp/next-a11y.pid)"
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventouch_web
          POSTGRES_USER: eventouch
          POSTGRES_PASSWORD: eventouch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventouch -d eventouch_web"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install root and web dependencies
        run: npm run setup

      - name: Install the browser for the audits
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg for the camera audit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      # The new app has its own lockfile and build; this job is the place CI
      # proves it typechecks and builds before any browser touches it.
      - name: Typecheck the new app
        run: npx --prefix apps/web tsc --noEmit -p apps/web/tsconfig.json

      - name: Build the new app
        run: npm --prefix apps/web run build

      - name: Create fresh private evidence root
        # Every web job run owns a fresh, owner-private evidence root. mktemp
        # guarantees a new directory per run, so consecutive runs can never
        # silently reuse (or overwrite) each other's logs and captures.
        # The exact paths are conveyed to the audit and upload steps below
        # through $GITHUB_ENV — no step re-derives or hardcodes them.
        run: |
          set -euo pipefail
          umask 077
          EVIDENCE_ROOT="$(mktemp -d /tmp/eventouch-ci-evidence-XXXXXX)"
          chmod 700 "$EVIDENCE_ROOT"
          mkdir -m 700 "$EVIDENCE_ROOT/logs" "$EVIDENCE_ROOT/captures"
          chmod 700 "$EVIDENCE_ROOT" "$EVIDENCE_ROOT/logs" "$EVIDENCE_ROOT/captures"
          printf 'EVENTOUCH_CI_EVIDENCE_ROOT=%s\n' "$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          printf 'EVENTOUCH_CI_LOGS=%s\n' "$EVIDENCE_ROOT/logs" >> "$GITHUB_ENV"
          printf 'EVENTOUCH_CI_CAPTURES=%s\n' "$EVIDENCE_ROOT/captures" >> "$GITHUB_ENV"

      - name: Run the browser audits serially against one Next build
        # Each browser audit owns its Next and API processes against an
        # isolated schema, while reusing the same production build.
        env:
          EVENTOUCH_TEST_DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_web
          EVENTOUCH_A11Y_DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_web
          EVENTOUCH_MOBILE_DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_web
          DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_web
          # Screenshots and JSON use synthetic, isolated fixture data under
          # the fresh per-job evidence root created above.
          EVENTOUCH_CAPTURE_ROOT: ${{ env.EVENTOUCH_CI_CAPTURES }}
          EVENTOUCH_CI_SHARD: ${{ matrix.shard }}
        run: |
          # pipefail: every piped command below (each audit teed to its own
          # log) keeps its real exit code, so a failing audit still fails
          # the step instead of reporting tee's success.
          set -o pipefail
          # Failure logs are evidence too: the evidence root is already a
          # fresh 0700 directory from the previous step. Refuse to run when
          # the conveyed paths are missing instead of falling back to a
          # shared fixed directory, and refuse to overwrite preexisting logs.
          : "${EVENTOUCH_CI_LOGS:?evidence root missing: run the evidence-root step first}"
          : "${EVENTOUCH_CI_CAPTURES:?evidence root missing: run the evidence-root step first}"
          umask 077
          mkdir -p /tmp/opencode
          test -d "$EVENTOUCH_CI_LOGS"
          test -d "$EVENTOUCH_CI_CAPTURES"
          # Reserve every log before starting any gate: piping directly into
          # a no-clobber writer would start the producer concurrently, before
          # an existing file is detected. Earlier evidence is never truncated.
          set -o noclobber
          for log in db-migrate web-audit web-console-audit web-report-data-availability-audit web-report-live-availability-audit web-report-cancellation-review-audit web-archive-preconditions-audit web-staff-source-integrity-audit web-waitlist-approval-audit web-waitlist-overview-audit web-roulette-schedule-audit web-roulette-conflict-audit web-lucky-capacity-audit web-lucky-batches-audit web-lucky-range-config-audit web-system-audit web-organizations-audit web-organization-roles-audit web-recovery-audit web-import-audit web-import-contact-review-audit web-hanwool-audit web-theme-audit web-theme-freshness-audit web-page-visibility-review-audit web-page-publication-context-audit web-retirement-audit web-preparation-audit web-display-continuity-audit web-intake-roster-edit-audit web-operator-cross-tab-receipt-audit web-ticket-postponement-audit web-ticket-reissue-resume-audit web-ticket-copy-recovery-audit web-ticket-loading-recovery-audit web-camera-fallback-audit web-message-ticket-availability-audit web-message-cancellation-conflict-audit web-message-routing-review-audit web-message-routing-details-audit web-message-name-review-audit web-team-role-switch-audit web-team-refresh-recovery-audit web-staff-manual-presence-audit web-report-export-scope-audit web-reward-recovery-audit web-reward-cancellation-conflict-audit web-signup-retry-audit web-register-field-error-audit web-verification-uncertain-audit web-attendee-identity-audit web-attendee-multievent-recovery-audit web-attendee-audit web-attendee-approval-state-audit web-attendee-visibility-audit web-attendee-retry-audit web-attendee-booth-retry-audit web-crossrole-audit web-lifecycle-audit web-account-recovery-audit web-close-audit web-workbench-audit web-ui-audit web-delivery-audit web-qa-schedule-audit web-cards-audit web-uiux-recovery-audit web-uiux-workflows-audit web-taskflow-audit web-template-library-audit web-message-authoring-audit web-message-focus-audit web-message-targeting-audit web-publication-audit web-publication-context-audit web-participation-navigation-audit web-nametag-print-audit web-roster-nametag-freshness-audit web-roster-export-audit web-roster-export-integrity-audit web-roster-presence-audit web-reviewed-exit-audit web-attendance-consistency-audit web-checkin-attendance-guard-audit web-cancellation-conflict-checkin-audit web-staff-inline-recovery-audit web-approval-cancellation-conflict-audit web-cancellation-conflict-review-audit web-attendance-reconciliation-audit web-workspace-preservation-audit web-booth-mode-review-audit web-staff-booth-clock-audit web-booth-server-clock-audit web-overview-message-attention-audit web-message-nav-attention-audit web-message-nav-freshness-audit web-ticket-review-queue-audit web-message-locked-reference-audit web-schedule-review-audit web-attendee-refresh-audit web-venue-visibility-audit web-staff-direction-review-audit web-message-charset-audit audit-usability; do
            : > "$EVENTOUCH_CI_LOGS/$log.log" || { echo "Existing CI evidence; refusing to run: $EVENTOUCH_CI_LOGS/$log.log" >&2; exit 1; }
          done
          set +o noclobber
          # Append only to the files just reserved inside the private root.
          ci_tee() {
            local dest="$1"
            tee -a "$dest"
          }
          # Audits that still drive the screens as they were before the confirmed
          # redesign (old tabs, buttons and headings) are marked `|| ci_pending`:
          # their failure is reported as a warning and listed in the job summary
          # instead of stopping every audit after them. Port one to its screen,
          # then delete its suffix so it blocks again. Every other gate blocks.
          # A browser audit that fails once is run one more time, in the same log (tee -a), so
          # both attempts are on record. Only a failure on both attempts fails the gate. The
          # retry is listed in the job summary; it never replaces an assertion or a status check.
          ci_retried=()
          ci_retry() {
            local name="$1"
            local log="$EVENTOUCH_CI_LOGS/$name.log"
            shift
            ci_retried+=("$name")
            echo "::warning title=Audit retried::$name failed on its first attempt; running it once more. Both attempts stay in its log."
            # The second attempt gets its own capture root under the same captures tree (still uploaded), so
            # it never meets the first attempt's capture folders (audits refuse to overwrite them).
            local retry_root="$EVENTOUCH_CI_CAPTURES/retry-$name"
            mkdir -m 700 "$retry_root"
            EVENTOUCH_CAPTURE_ROOT="$retry_root" "$@" 2>&1 | ci_tee "$log"
          }
          ci_pending_failed=()
          ci_pending() {
            ci_pending_failed+=("$1")
            echo "::warning title=Audit pending port::$1 failed; it still targets the pre-redesign screens (see its log in the evidence artifact)."
          }
          # Three parallel shards split the gates round-robin in call order:
          # gate 1 runs on shard 1, gate 2 on shard 2, gate 3 on shard 3,
          # gate 4 on shard 1 again, and so on. Each shard still runs its own
          # gates serially against its own database and evidence root, so a
          # new gate is one added line and the shards rebalance themselves.
          # A gate that still targets pre-redesign screens is marked
          # `run_gate "log" pending npm run ...`: its failure warns and is
          # listed instead of failing the shard. Every other gate blocks.
          case "${EVENTOUCH_CI_SHARD:?CI shard is not set}" in
            1|2|3) ;;
            *) echo "unknown CI shard: $EVENTOUCH_CI_SHARD" >&2; exit 1 ;;
          esac
          GATE_INDEX=0
          run_gate() {
            local log="$1"
            shift
            local mode="retry"
            if [ "$1" = "pending" ]; then
              mode="pending"
              shift
            fi
            GATE_INDEX=$((GATE_INDEX + 1))
            if [ $(( (GATE_INDEX - 1) % 3 )) -ne $((EVENTOUCH_CI_SHARD - 1)) ]; then
              return 0
            fi
            if [ "$mode" = "pending" ]; then
              "$@" 2>&1 | ci_tee "$EVENTOUCH_CI_LOGS/$log.log" || ci_pending "$log"
            else
              "$@" 2>&1 | ci_tee "$EVENTOUCH_CI_LOGS/$log.log" || ci_retry "$log" "$@"
            fi
          }
          npm run db:migrate 2>&1 | ci_tee "$EVENTOUCH_CI_LOGS/db-migrate.log"
          run_gate "web-audit" npm run web:audit
          run_gate "web-console-audit" npm run web:console:audit
          run_gate "web-report-data-availability-audit" npm run web:report-data-availability:audit
          run_gate "web-report-live-availability-audit" npm run web:report-live-availability:audit
          run_gate "web-report-cancellation-review-audit" npm run web:report-cancellation-review:audit
          run_gate "web-archive-preconditions-audit" npm run web:archive-preconditions:audit
          run_gate "web-staff-source-integrity-audit" npm run web:staff-source-integrity:audit
          run_gate "web-waitlist-approval-audit" npm run web:waitlist-approval:audit
          run_gate "web-waitlist-overview-audit" npm run web:waitlist-overview:audit
          run_gate "web-roulette-schedule-audit" npm run web:roulette-schedule:audit
          run_gate "web-roulette-conflict-audit" npm run web:roulette-conflict:audit
          run_gate "web-lucky-capacity-audit" npm run web:lucky-capacity:audit
          run_gate "web-lucky-batches-audit" npm run web:lucky-batches:audit
          run_gate "web-lucky-range-config-audit" npm run web:lucky-range-config:audit
          run_gate "web-system-audit" npm run web:system:audit
          run_gate "web-organizations-audit" npm run web:organizations:audit
          run_gate "web-organization-roles-audit" npm run web:organization-roles:audit
          run_gate "web-recovery-audit" npm run web:recovery:audit
          run_gate "web-import-audit" npm run web:import:audit
          run_gate "web-import-contact-review-audit" npm run web:import-contact-review:audit
          run_gate "web-hanwool-audit" npm run web:hanwool:audit
          run_gate "web-theme-audit" npm run web:theme:audit
          run_gate "web-theme-freshness-audit" npm run web:theme-freshness:audit
          run_gate "web-page-visibility-review-audit" npm run web:page-visibility-review:audit
          run_gate "web-page-publication-context-audit" npm run web:page-publication-context:audit
          run_gate "web-retirement-audit" npm run web:retirement:audit
          # Preparation / close / workbench / card journeys run against the
          # same isolated database; caps and assertions live in the scripts,
          # CI only wires them so a green build means they really ran.
          run_gate "web-preparation-audit" npm run web:preparation:audit
          run_gate "web-display-continuity-audit" npm run web:display-continuity:audit
          run_gate "web-intake-roster-edit-audit" npm run web:intake-roster-edit:audit
          run_gate "web-operator-cross-tab-receipt-audit" npm run web:operator-cross-tab-receipt:audit
          run_gate "web-ticket-postponement-audit" npm run web:ticket-postponement:audit
          run_gate "web-ticket-reissue-resume-audit" npm run web:ticket-reissue-resume:audit
          run_gate "web-ticket-copy-recovery-audit" npm run web:ticket-copy-recovery:audit
          run_gate "web-ticket-loading-recovery-audit" npm run web:ticket-loading-recovery:audit
          run_gate "web-camera-fallback-audit" npm run web:camera-fallback:audit
          run_gate "web-message-ticket-availability-audit" npm run web:message-ticket-availability:audit
          run_gate "web-message-cancellation-conflict-audit" npm run web:message-cancellation-conflict:audit
          run_gate "web-message-routing-review-audit" npm run web:message-routing-review:audit
          run_gate "web-message-routing-details-audit" npm run web:message-routing-details:audit
          run_gate "web-message-name-review-audit" npm run web:message-name-review:audit
          run_gate "web-team-role-switch-audit" npm run web:team-role-switch:audit
          run_gate "web-team-refresh-recovery-audit" npm run web:team-refresh-recovery:audit
          run_gate "web-staff-manual-presence-audit" npm run web:staff-manual-presence:audit
          run_gate "web-report-export-scope-audit" npm run web:report-export-scope:audit
          run_gate "web-reward-recovery-audit" npm run web:reward-recovery:audit
          run_gate "web-reward-cancellation-conflict-audit" npm run web:reward-cancellation-conflict:audit
          run_gate "web-signup-retry-audit" npm run web:signup-retry:audit
          run_gate "web-register-field-error-audit" npm run web:register-field-error:audit
          run_gate "web-verification-uncertain-audit" npm run web:verification-uncertain:audit
          run_gate "web-attendee-identity-audit" npm run web:attendee-identity:audit
          run_gate "web-attendee-multievent-recovery-audit" npm run web:attendee-multievent-recovery:audit
          run_gate "web-attendee-audit" npm run web:attendee:audit
          run_gate "web-attendee-approval-state-audit" npm run web:attendee-approval-state:audit
          run_gate "web-attendee-visibility-audit" npm run web:attendee-visibility:audit
          run_gate "web-attendee-retry-audit" npm run web:attendee-retry:audit
          run_gate "web-attendee-booth-retry-audit" npm run web:attendee-booth-retry:audit
          run_gate "web-crossrole-audit" npm run web:crossrole:audit
          run_gate "web-lifecycle-audit" npm run web:lifecycle:audit
          run_gate "web-account-recovery-audit" npm run web:account-recovery:audit
          run_gate "web-close-audit" npm run web:close:audit
          run_gate "web-workbench-audit" npm run web:workbench:audit
          run_gate "web-ui-audit" npm run web:ui:audit
          run_gate "web-delivery-audit" npm run web:delivery:audit
          run_gate "web-qa-schedule-audit" npm run web:qa-schedule:audit
          run_gate "web-cards-audit" npm run web:cards:audit
          run_gate "web-uiux-recovery-audit" npm run web:uiux-recovery:audit
          run_gate "web-uiux-workflows-audit" npm run web:uiux-workflows:audit
          run_gate "web-taskflow-audit" npm run web:taskflow:audit
          run_gate "web-template-library-audit" npm run web:template-library:audit
          run_gate "web-message-authoring-audit" npm run web:message-authoring:audit
          run_gate "web-message-focus-audit" npm run web:message-focus:audit
          run_gate "web-message-targeting-audit" npm run web:message-targeting:audit
          run_gate "web-publication-audit" npm run web:publication:audit
          run_gate "web-publication-context-audit" npm run web:publication-context:audit
          run_gate "web-participation-navigation-audit" npm run web:participation-navigation:audit
          run_gate "web-nametag-print-audit" npm run web:nametag-print:audit
          run_gate "web-roster-nametag-freshness-audit" npm run web:roster-nametag-freshness:audit
          run_gate "web-roster-export-audit" npm run web:roster-export:audit
          run_gate "web-roster-export-integrity-audit" npm run web:roster-export-integrity:audit
          run_gate "web-roster-presence-audit" npm run web:roster-presence:audit
          run_gate "web-reviewed-exit-audit" npm run web:reviewed-exit:audit
          run_gate "web-attendance-consistency-audit" npm run web:attendance-consistency:audit
          run_gate "web-checkin-attendance-guard-audit" npm run web:checkin-attendance-guard:audit
          run_gate "web-cancellation-conflict-checkin-audit" npm run web:cancellation-conflict-checkin:audit
          run_gate "web-staff-inline-recovery-audit" npm run web:staff-inline-recovery:audit
          run_gate "web-approval-cancellation-conflict-audit" npm run web:approval-cancellation-conflict:audit
          run_gate "web-cancellation-conflict-review-audit" npm run web:cancellation-conflict-review:audit
          run_gate "web-attendance-reconciliation-audit" npm run web:attendance-reconciliation:audit
          run_gate "web-workspace-preservation-audit" npm run web:workspace-preservation:audit
          run_gate "web-booth-mode-review-audit" npm run web:booth-mode-review:audit
          run_gate "web-staff-booth-clock-audit" npm run web:staff-booth-clock:audit
          run_gate "web-booth-server-clock-audit" npm run web:booth-server-clock:audit
          run_gate "web-overview-message-attention-audit" npm run web:overview-message-attention:audit
          run_gate "web-message-nav-attention-audit" npm run web:message-nav-attention:audit
          run_gate "web-message-nav-freshness-audit" npm run web:message-nav-freshness:audit
          run_gate "web-ticket-review-queue-audit" npm run web:ticket-review-queue:audit
          run_gate "web-message-locked-reference-audit" npm run web:message-locked-reference:audit
          run_gate "web-schedule-review-audit" npm run web:schedule-review:audit
          run_gate "web-attendee-refresh-audit" npm run web:attendee-refresh:audit
          run_gate "web-venue-visibility-audit" npm run web:venue-visibility:audit
          run_gate "web-staff-direction-review-audit" npm run web:staff-direction-review:audit
          run_gate "web-message-charset-audit" npm run web:message-charset:audit
          # Usability as a gate, not a review: every goal must still be
          # reachable in a handful of actions, with the keyboard path and the
          # server state behind it measured.
          run_gate "audit-usability" npm run audit:usability
          if [ "${#ci_retried[@]}" -gt 0 ]; then
            {
              echo "### Audits retried once (first attempt failed; see both attempts in the log)"
              printf -- '- %s\n' "${ci_retried[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${#ci_pending_failed[@]}" -gt 0 ]; then
            {
              echo "### Audits pending port to the confirmed screens (non-blocking)"
              printf -- '- %s\n' "${ci_pending_failed[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Failure evidence only: per-command stdout logs plus screenshots/JSON
      # from the isolated synthetic fixture, kept 7 days. Success uploads
      # nothing (no PII retention). No secrets flow through these logs: the
      # only credentials in this job's env are the ephemeral CI PostgreSQL
      # user/password (eventouch/eventouch), and the audit scripts delete
      # provider keys and run with EVENTOUCH_SMS_MOCK=1.
      - name: Upload audit logs and captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-audit-evidence
          path: |
            ${{ env.EVENTOUCH_CI_LOGS }}
            ${{ env.EVENTOUCH_CI_CAPTURES }}
          retention-days: 7
          if-no-files-found: ignore
