  ${visible.length?`<div class="ux-desktop-table">${table([`<input type="checkbox" data-v5-select-page aria-label="현재 페이지 참가자 선택" ${all?'checked':''}>`,'참가자','그룹','상태','티켓','연락처','작업'],visible.map(row))}</div><div class="ux-mobile-people">${visible.map(p=>`<article class="ux-person-card"><div class="ux-person-card-head"><input type="checkbox" data-v5-select="${e(p.id)}" aria-label="${e(p.name)} 선택" ${selected.includes(p.id)?'checked':''} ${p.cancelled?'disabled':''}>${U.avatar(p.name)}<div class="grow"><strong>${e(p.name)}</strong><span>${e(p.company)}</span></div>${U.participantStatus(p)}</div><dl><div><dt>티켓</dt><dd class="mono">${e(p.ticket)}</dd></div><div><dt>그룹</dt><dd>${e(p.group)}</dd></div></dl><div class="ux-person-card-actions">${B('참가자 보기','participant-detail','','chevron',`data-id="${e(p.id)}"`)}${!p.cancelled&&p.status!=='IN'?B('입장 확인','v5-manual-admit','ink','scan',`data-id="${e(p.id)}"`):L('입퇴장 데스크','checkin','','scan')}</div></article>`).join('')}</div>`:empty('조건에 맞는 참가자가 없습니다','이름 또는 티켓 코드를 확인하거나 필터를 초기화하세요.',B('필터 초기화','reset-filters','ink','refresh'))}
  <footer class="ux-pagination"><span>${page} / ${totalPages} 페이지</span><div>${B('이전','page-prev','','back',page===1?'disabled':'')}${B('다음','page-next','','chevron',page>=totalPages?'disabled':'')}</div></footer></section>${footer()}</div>`;
 };
 function admissionContext(){const id=ui().unitId;let unit=W().units.find(u=>u.id===id);if(!unit)unit=W().units.find(u=>u.action===(ui().checkAction||'IN'))||W().units[0];if(unit){ui().unitId=unit.id;ui().unitName=unit.name;ui().checkAction=unit.action;}return unit;}
 function queueMarkup(){const q=(T().queue||[]).filter(c=>c.eventId===A().state.activeEventId);if(!q.length)return '';return `<section class="ux-queue"><header><h3>입장 미확정 · ${q.length}건</h3>${B('대기 요청 재전송','v4-retry-queue','sm','refresh')}</header><p>성공으로 처리하지 않은 요청입니다. 같은 요청 ID로 재검증합니다.</p><ul>${q.slice(0,8).map(c=>`<li><span class="mono">${e(c.payload.ticket)}</span><strong>${c.reviewError?'검토 필요':'전송 대기'}</strong>${c.reviewError?`<small>${e(c.reviewError)}</small>`:''}</li>`).join('')}</ul>${q.length>8?`<p>외 ${q.length-8}건 · 재전송 결과를 확인하세요.</p>`:''}</section>`;}
 function feedback(){const r=ui().scanResult;if(!r)return `<div class="ux-scan-idle" role="status">${icon('scan')}<div><h2>참가자 티켓을 스캔해주세요</h2><p>부스 QR이 아닌, 참가자의 모바일 티켓입니다.</p></div></div>`;const person=r.person;return `<section class="ux-scan-result ${r.tone}" role="status" aria-live="polite" data-scan-code="${e(r.code)}"><span class="ux-result-symbol">${icon(r.tone==='success'?'check':r.tone==='danger'?'info':'clock')}</span><div><div class="ux-eyebrow">${r.code==='QUEUED'||r.code==='UNCONFIRMED'?'NOT CONFIRMED':r.tone==='success'?'CONFIRMED':'NOT PROCESSED'}</div><h2>${e(r.title)}</h2>${person?`<strong class="ux-result-name">${e(person.name)} <small>${e(person.company)} · ${e(person.group)}</small></strong>`:''}<p>${e(r.body)}</p>${r.lastLog?`<div class="ux-last-check">최근 기록 · ${e(r.lastLog.unit)} · ${time(r.lastLog.at)}</div>`:''}<div class="ux-result-actions">${r.actions.includes('DETAIL')&&person?B('참가자 확인','participant-detail','','people',`data-id="${e(person.id)}"`):''}${r.actions.includes('SEARCH')?B('이름으로 검색','v5-scan-search','','search'):''}${r.actions.includes('DESK')?B('데스크 확인','v5-open-desk','','settings'):''}${r.actions.includes('RETRY_SAME')?B('동일 요청 재확인','v5-retry-same','','refresh'):''}${r.actions.includes('HISTORY')?L('처리 기록','check-history','','clock'):''}${r.tone==='success'&&person?B('네임택 인쇄','badge-preview','','print',`data-id="${e(person.id)}"`):''}${B('다음 QR 준비','v5-scan-next','ink','scan')}</div></div></section>`;}
 function scanSummary(){const r=ui().scanResult;if(!r)return '';return `<div class="ux-summary-content ${e(r.tone)}"><span class="ux-result-symbol">${icon(r.tone==='success'?'check':'info')}</span><div><strong>${e(r.title)}</strong><span>${e(r.person?.name||'처리 결과를 확인하세요')}${r.code==='QUEUED'||r.code==='UNCONFIRMED'?' · 입장 미확정':''}</span></div>${B('결과 보기','v5-scan-detail','','chevron')}</div>`;}
 function cameraBlock(){return `<div class="ux-camera-wrap"><div class="v4-camera"><video id="v4-camera-video" playsinline muted></video><div class="v4-camera-frame"></div><div id="v4-camera-help" class="v4-camera-help" role="status">카메라 시작 버튼을 눌러주세요.</div></div><div class="ux-camera-actions">${B('카메라 시작','v4-camera-start','ink','scan')}${B('카메라 정지','v4-camera-stop','','pause')}</div><p class="ux-muted ux-camera-note">카메라 권한과 QR 자동 인식 지원이 필요합니다. 사용할 수 없으면 코드 직접 입력을 이용하세요.</p></div>`;}
 function admission(camera=false){const unit=admissionContext(),isOut=unit?.action==='OUT';return `<div class="ux-field-page">${head(isOut?'퇴장 데스크':'입장 데스크','참가자가 보여주는 티켓 QR을 스캔합니다.',B('데스크 변경','v5-open-desk','','settings'),'FIELD / ADMISSION')}<div class="ux-desk-context"><div>${badge(isOut?'퇴장 OUT':'입장 IN',isOut?'info':'success')}<strong>${e(unit?.name||'데스크 미설정')}</strong><span>${e(E().name)}</span></div>${conn()}</div><div id="ux-scan-summary" class="ux-scan-summary">${scanSummary()}</div><div class="ux-scanner-layout ${camera?'with-camera':''}"><section class="ux-scan-work">${camera?cameraBlock():`<div class="ux-scan-direction">${icon('phone')} 참가자 모바일 티켓 ${icon('arrow')} ${icon('scan')} 운영자 리더·카메라</div>`}<form id="scan-form" class="ux-scan-form" data-ux-no-dirty><label for="scan-code">티켓 코드 직접 입력</label><div><input id="scan-code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required placeholder="DEMO-1001" aria-describedby="ux-scan-helper"><button class="btn primary" type="submit">${isOut?'퇴장 확인':'입장 확인'}</button></div><p id="ux-scan-helper">Enter로 처리 · 처리 후 입력창으로 복귀 · 실제 승인은 서버 응답 후 확인</p></form><div class="ux-scan-secondary">${L(camera?'리더 입력 화면':'카메라로 스캔',camera?'checkin':'field-scanner','','scan')}${B('참가자 직접 검색','v5-scan-search','','search')}${L('처리 기록','check-history','','clock')}</div><div id="ux-feedback">${feedback()}</div>${queueMarkup()}</section><aside>${panel('최근 현장 처리','새 입퇴장 작업 기준',logList(W().logs.slice(0,5),true))}<div class="ux-callout">${icon('info')}<div><strong>중복 스캔은 재입장이 아닙니다.</strong><p>입장 중인 티켓은 그대로 둡니다. 퇴장한 참가자만 행사 정책에 따라 재입장합니다.</p>${B('재입장 정책 확인','v5-admission-policy','sm','','')}</div></div></aside></div>${footer()}</div>`;}
 ETViews.checkin=()=>admission(false);ETViews['field-scanner']=()=>admission(true);
 ETViews.booths=()=>{const w=W(),mode=w.boothMode;return `<div class="v4-page">${head('부스·스탬프 운영','행사 전체에 적용되는 한 가지 인증 방식을 선택합니다.',B('부스 추가','add-booth','primary','plus'),'ON-SITE / STAMPS')}

 function render(){init();const pg=page(),o=pg.items.find(o=>o.id===A().ui.reportObject);return `<div class="v4-page">${U.head('결과보고서 스튜디오','템플릿을 바탕으로 내용을 편집하고, 위치·크기를 조절합니다.',B('데이터 다시 채우기','v4-report-refresh','','refresh')+B('인쇄 · PDF 저장','v4-report-print','primary','print'),'REPORT STUDIO / STRUCTURED CANVAS')}<div class="v4-control-strip v4-report-toolbar">${B('텍스트 추가','v4-report-add','','plus')}${B('페이지 복제','v4-report-clone','','layers')}${B('실행 취소','v4-report-undo','','back',XP().reportHistory.length?'':'disabled')}${B('JSON 내보내기','v4-report-export','','download')}<span class="v4-note" style="margin:0">객체를 끌어서 이동 · 우하단으로 크기 조절 · 방향키 1% / Shift 0.2%</span></div><div class="v4-report-editor"><nav class="v4-slide-list" aria-label="보고서 페이지">${XP().reportPages.map(p=>`<button class="v4-slide-thumb ${pg.id===p.id?'active':''}" data-action="v4-report-page" data-page="${e(p.id)}"><span class="v4-kicker">${p.dark?'DARK COVER':'CONTENT'}</span><strong>${e(p.name)}</strong></button>`).join('')}</nav><div>${canvas(pg,o?.id)}<div class="v4-slide-label"><span>${e(pg.name)} / 16:9</span><span>편집 내용은 저장소 정책에 따라 보관됩니다.</span></div></div><aside class="v4-report-inspector"><h3>객체 속성</h3>${o?`<form id="v4-report-object-form"><input type="hidden" name="objectId" value="${e(o.id)}"><div class="field"><label for="v4-object-text">텍스트</label><textarea id="v4-object-text" name="text" rows="5" maxlength="1200">${e(o.text)}</textarea></div><div class="v4-report-pair">${field('X (%)','x',o.x,'number','min="0" max="95" step="0.2"')}${field('Y (%)','y',o.y,'number','min="0" max="95" step="0.2"')}${field('가로 (%)','width',o.width,'number','min="5" max="100" step="0.2"')}${field('세로 (%)','height',o.height,'number','min="5" max="100" step="0.2"')}${field('글자 크기 (cqw)','size',o.size,'number','min="0.8" max="12" step="0.1"')}${field('색상','color',o.color,'color')}</div><button class="btn primary w100 mt16" type="submit">속성 적용</button></form><div class="mt16">${B('객체 삭제','v4-report-delete','danger w100','trash')}</div>`:`<div class="v4-inline-empty" style="padding:24px 0">텍스트를 선택하면 속성을 편집할 수 있습니다.</div>`}<div class="v4-note">템플릿 기반 텍스트 캔버스입니다. 이미지 자유 편집·정렬 가이드·협업·PPTX 및 서버 PDF는 후속 범위입니다.</div></aside></div><div class="v4-callout">보고서 생성 시점의 데이터를 채웁니다. 텍스트를 직접 수정해도 원본 참가자·투표 데이터를 변경하지 않습니다. 원 기획의 전체 프레젠테이션 편집기를 완료한 것은 아닙니다.</div></div>`;}
 function snapshot(){const x=XP();x.reportHistory.push(JSON.parse(JSON.stringify(x.reportPages)));x.reportHistory=x.reportHistory.slice(-20);}
 function save(message){A().save('REPORT_EDIT','구조화 보고서 편집',message);}
 function setup(){const act=A().actions;act['v4-report-page']=el=>{A().ui.reportPage=el.dataset.page;A().ui.reportObject=null;A().render();};act['v4-report-add']=()=>{snapshot();const pg=page(),id='text-'+Date.now().toString(36);pg.items.push({id,text:'텍스트를 입력하세요.',x:10,y:45,width:70,height:16,size:2.5,color:pg.dark?'#FFF8ED':'#17191D',weight:500});A().ui.reportObject=id;save();};act['v4-report-clone']=()=>{snapshot();const pg=JSON.parse(JSON.stringify(page()));pg.id+='-'+Date.now();pg.name+=' 복제';XP().reportPages.push(pg);A().ui.reportPage=pg.id;save('페이지를 복제했습니다.');};act['v4-report-delete']=()=>{snapshot();const pg=page();pg.items=pg.items.filter(o=>o.id!==A().ui.reportObject);A().ui.reportObject=null;save();};act['v4-report-undo']=()=>{if(!XP().reportHistory.length)return;XP().reportPages=XP().reportHistory.pop();A().ui.reportObject=null;save();};act['v4-report-refresh']=()=>{A().showDialog('보고서 내용을 새로 채울까요?','<p>현재 편집한 텍스트와 배치를 기본 3페이지 템플릿으로 다시 채웁니다. 실행 취소로 복구할 수 있습니다.</p>',B('취소','close-dialog')+B('새로 채우기','v4-report-refresh-confirm','primary'));};act['v4-report-refresh-confirm']=()=>{snapshot();XP().reportPages=templates();A().ui.reportPage='cover';A().ui.reportObject=null;A().closeDialog();save('현재 운영 데이터로 채웠습니다.');};act['v4-report-export']=()=>A().jsonDownload('EVENTOUCH-report-v4.json',{schemaVersion:'4.0',eventId:A().state.activeEventId,generatedAt:new Date().toISOString(),pages:XP().reportPages});act['v4-report-print']=()=>{const win=window.open('','_blank');if(!win){A().toast('팝업 허용 후 다시 시도하세요.','error');return;}win.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>EVENTOUCH 결과보고서</title><style>@page{size:landscape;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif}.slide{position:relative;width:100vw;height:56.25vw;break-after:page;overflow:hidden;container-type:inline-size}.slide:last-child{break-after:auto}.obj{position:absolute;line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.slide{width:100vw;height:100vh}}</style></head><body>${XP().reportPages.map(pg=>`<section class="slide" style="background:${pg.dark?'#17191D':'#FFFEFB'}">${pg.items.map(o=>`<div class="obj" style="left:${o.x}%;top:${o.y}%;width:${o.width}%;font-size:${o.size}vw;color:${e(o.color)};font-weight:${o.weight}">${e(o.text)}</div>`).join('')}</section>`).join('')}</body></html>`);win.document.close();setTimeout(()=>win.print(),400);};
 let drag=null;
 document.addEventListener('pointerdown',ev=>{const node=ev.target.closest('[data-object]');if(A().route!=='report-canvas'||!node)return;const pg=page(),o=pg.items.find(x=>x.id===node.dataset.object),rect=node.closest('[data-report-canvas]').getBoundingClientRect();if(!o)return;A().ui.reportObject=o.id;snapshot();drag={o,rect,x:ev.clientX,y:ev.clientY,start:{...o},resize:!!ev.target.closest('[data-resize]'),node};node.setPointerCapture(ev.pointerId);ev.preventDefault();});
 document.addEventListener('pointermove',ev=>{if(!drag)return;const d=drag,dx=(ev.clientX-d.x)/d.rect.width*100,dy=(ev.clientY-d.y)/d.rect.height*100;if(d.resize){d.o.width=Math.max(5,Math.min(100-d.o.x,d.start.width+dx));d.o.height=Math.max(5,Math.min(100-d.o.y,d.start.height+dy));}else{d.o.x=Math.max(0,Math.min(100-d.o.width,d.start.x+dx));d.o.y=Math.max(0,Math.min(100-d.o.height,d.start.y+dy));}for(const k of ['x','y','width','height'])d.o[k]=Math.round(d.o[k]*10)/10;Object.assign(d.node.style,{left:d.o.x+'%',top:d.o.y+'%',width:d.o.width+'%',height:d.o.height+'%'});});
 document.addEventListener('pointerup',()=>{if(drag){drag=null;save();}});
 document.addEventListener('keydown',ev=>{if(A().route!=='report-canvas')return;const node=ev.target.closest('[data-object]');if(!node)return;const o=page().items.find(x=>x.id===node.dataset.object);if(ev.key==='Enter'){A().ui.reportObject=o.id;A().render();return;}if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(ev.key))return;ev.preventDefault();snapshot();const delta=ev.shiftKey?.2:1;if(ev.key==='ArrowLeft')o.x=Math.max(0,o.x-delta);if(ev.key==='ArrowRight')o.x=Math.min(100-o.width,o.x+delta);if(ev.key==='ArrowUp')o.y=Math.max(0,o.y-delta);if(ev.key==='ArrowDown')o.y=Math.min(100-o.height,o.y+delta);A().ui.reportObject=o.id;save();document.querySelector(`[data-object="${o.id}"]`)?.focus();});
 }
 function submit(form){const f=Object.fromEntries(new FormData(form)),o=page().items.find(o=>o.id===f.objectId);if(!o)throw Error('선택한 객체가 없습니다.');if(!/^#[0-9A-F]{6}$/i.test(f.color))throw Error('색상 코드를 확인하세요.');snapshot();Object.assign(o,{text:f.text,color:f.color,x:+f.x,y:+f.y,width:+f.width,height:+f.height,size:+f.size});o.width=Math.min(o.width,100-o.x);o.height=Math.min(o.height,100-o.y);save('객체 속성을 반영했습니다.');}
 ETViews['report-canvas']=render;window.ETReport={setup,submit,templates};
})();

</script>
 <script>
/* v7 single product shell. Desktop, field, participant and output are layout modes,
   not separately managed products. No source-note or demo tooling in attendee menus. */
(function(){
'use strict';
const P=ETProduct,U=ETUI,{e,icon,logo,badge,button:B,link:L}=U;
const V=window.ET7={A:()=>ETApp,W:()=>ETApp.workspace(),E:()=>ETApp.event(),ui:()=>ETApp.ui};
V.q=()=>ETApp.ui.v7Params||{};
V.role=()=>ETApp.ui.productRole||'AGENCY';
V.editable=(group)=>P.canWrite(V.role(),group);
V.eventAllowed=eid=>V.role()==='AGENCY'||eid===(ETApp.ui.roleEventId||ETApp.state.events[0]?.id);
V.allowed=id=>P.canRoute(V.role(),P.canonical(id));
V.enabled=id=>!P.FEATURE[id]||!!V.W().features[P.FEATURE[id]];
V.h=(title,desc,action='',tag='')=>`<header class="et7-page-head"><div>${tag?`<p class="et7-eyebrow">${e(tag)}</p>`:''}<h1>${e(title)}</h1>${desc?`<p>${e(desc)}</p>`:''}</div>${action?`<div class="et7-actions">${action}</div>`:''}</header>`;
V.panel=(title,desc,body,actions='')=>`<section class="et7-panel"><header class="et7-panel-head"><div><h2>${e(title)}</h2>${desc?`<p>${e(desc)}</p>`:''}</div>${actions}</header><div class="et7-panel-body">${body}</div></section>`;
V.blank=(title,desc,action='')=>`<div class="et7-empty">${icon('layers')}<h2>${e(title)}</h2><p>${e(desc)}</p>${action}</div>`;
V.metric=(label,value,caption,tone='')=>`<article class="et7-metric ${tone}"><p>${e(label)}</p><strong>${e(String(value))}</strong><small>${e(caption||'')}</small></article>`;
V.pill=(text,tone='')=>`<span class="et7-pill ${e(tone)}">${e(text)}</span>`;
V.notFound=()=>V.blank('항목을 찾을 수 없습니다.','삭제되었거나 다른 행사의 항목입니다.',L('목록으로 돌아가기','overview','primary','back'));
U.qr=code=>ETQR.encode(String(code));
for(const [id,r]of Object.entries(P.ROUTES))ET_ROUTES[id]=[r.title,'grid',r.scope==='agency'?'대행사':r.scope==='participant'?'참가자':'행사',r.kind];
function navLink(id,ic,title,active){return `<a href="#${id}" class="et7-nav-link ${active?'is-active':''}" ${active?'aria-current="page"':''}>${icon(ic)}<span>${e(title)}</span>${active?'<i></i>':''}</a>`;}
function scopeSidebar(route){const r=P.route(route),agency=r?.scope==='agency';const group=r?.group;
 const links=agency?P.AGENCY_NAV.filter(x=>V.allowed(x[0])).map(([id,i,t])=>navLink(id,i,t,id===route)).join(''):P.GROUPS.map(g=>({...g,entry:g.tabs.find(([id])=>V.allowed(id)&&V.enabled(id))?.[0]})).filter(g=>g.entry).map(g=>navLink(g.entry,g.icon,g.name,g.id===group)).join('');
 return `<aside class="et7-sidebar ${ETApp.ui.sidebarOpen?'is-open':''}" aria-label="${agency?'대행사':'행사'} 메뉴"><a class="et7-brand" href="#${V.role()==='AGENCY'?'agency-home':'overview'}">${logo()}</a><div class="et7-space-context"><small>${agency?'AGENCY WORKSPACE':'EVENT WORKSPACE'}</small>${agency?'<strong>대행사 관리</strong>':`<button data-action="v7-event-picker" aria-label="행사 전환"><strong>${e(V.E().name)}</strong>${icon('down')}</button>`}</div>${!agency&&V.role()==='AGENCY'?'<a class="et7-scope-back" href="#agency-home">'+icon('back')+' 대행사 홈</a>':''}<nav>${links}</nav><footer><span class="et7-prototype-chip">가상 데이터 · 프로토타입</span><a href="#demo">${icon('play')} 체험 안내</a><a href="#screens">${icon('layers')} 화면 설계</a></footer></aside>`;
}
function topbar(route){const meta=P.route(route);return `<header class="et7-topbar"><div class="et7-top-context"><button class="icon-btn et7-mobile-menu" data-action="toggle-sidebar" aria-label="메뉴 열기">${icon('menu')}</button><span>${meta?.scope==='agency'?'대행사':e(V.E().name)}</span>${icon('chevron')}<strong>${e(meta?.title||'화면')}</strong></div><div class="et7-top-tools"><span class="et7-prototype-chip">권한 체험</span><label class="sr-only" for="v7-role">검수용 역할 선택</label><select id="v7-role">${Object.entries(P.ROLES).map(([id,name])=>`<option value="${id}" ${V.role()===id?'selected':''}>${name}</option>`).join('')}</select><a class="icon-btn" href="#mobile-home" aria-label="참가자 화면 보기">${icon('phone')}</a><a class="icon-btn" href="#documents" aria-label="문서 보기">${icon('help')}</a></div></header>`;}
function moduleTabs(route){const r=P.route(route),g=P.GROUPS.find(g=>g.id===r?.group);if(!g||['mode','advanced'].includes(r.kind))return'';const tabs=g.tabs.filter(([id])=>V.allowed(id)&&V.enabled(id));return `<nav class="et7-module-tabs" aria-label="${e(g.name)} 내부 메뉴">${tabs.map(([id,name])=>`<a href="#${id}" ${route===id?'aria-current="page"':''} class="${route===id?'is-active':''}">${e(name)}</a>`).join('')}</nav>`;}
function fieldDock(route){const group=P.route(route)?.group;if(!['AGENCY','MANAGER','STAFF'].includes(V.role()))return '';return `<nav class="et7-field-nav" aria-label="현장 빠른 메뉴">${P.FIELD_NAV.filter(([id])=>V.allowed(id)).map(([id,i,t])=>`<a href="#${id}" class="${id==='field-scanner'?'is-primary ':''}${id===route?'is-active':''}" ${id===route?'aria-current="page"':''}>${id==='field-scanner'?'<span class="et7-qr-button">'+icon(i)+'</span>':icon(i)}<span>${t}</span></a>`).join('')}</nav>`;}
function participantParent(route){if(route==='mobile-program-detail')return'mobile-program';if(route==='mobile-fullticket')return'mobile-qr';if(route==='mobile-booth-scan')return'mobile-qr';if(['mobile-home','mobile-program','mobile-qr','mobile-engage','mobile-more'].includes(route))return null;if(/info|help|notice|venue|board/.test(route))return'mobile-more';return'mobile-engage';}
function mobileActive(route){if(route==='mobile-home')return'mobile-home';if(route.includes('program'))return'mobile-program';if(/qr|ticket|scan/.test(route))return'mobile-qr';if(/info|help|notice|venue|board|more/.test(route))return'mobile-more';return'mobile-engage';}
V.mobileShell=function(title,body){const route=ETApp.route,back=participantParent(route),large=route==='mobile-fullticket';const entry=/mobile-(entry|registration|invalid|expired|not-open|loading)/.test(route);const active=mobileActive(route);return `<div class="et7-participant"><header class="et7-mobile-header">${back?`<a class="icon-btn" href="#${back}" aria-label="이전 화면">${icon('back')}</a>`:`<a class="et7-mobile-brand" href="#mobile-home">${logo()}</a>`}<strong>${e(back?title:route==='mobile-home'?'':title)}</strong><a class="icon-btn" href="#mobile-notice" aria-label="행사 공지">${icon('bell')}</a></header><main class="et7-mobile-body mobile-page ${large?'et7-ticket-focus':''}" id="main-content" tabindex="-1">${body}</main>${!large&&!entry?`<nav class="et7-mobile-nav" aria-label="참가자 주요 메뉴">${P.PARTICIPANT_NAV.map(([id,i,t])=>`<a href="#${id}" class="${id==='mobile-qr'?'is-primary ':''}${active===id?'is-active':''}" ${active===id?'aria-current="page"':''}>${id==='mobile-qr'?`<span class="et7-qr-button">${icon(i)}</span>`:icon(i)}<span>${t}</span></a>`).join('')}</nav>`:''}</div>`;};
// All legacy attendee screens call this shared entry point; no regex screen patching.
ETV4.mobileShell=V.mobileShell;
V.denied=()=>V.blank('이 역할에서는 볼 수 없는 화면입니다.','행사와 담당 업무에 맞는 메뉴만 표시합니다. 역할 체험은 상용 인증이 아닙니다.',L('허용된 화면으로','overview','primary','back'));
window.ETProductUI={renderRoute(route){
 V.prepare?.();
 const r=P.route(route)||{scope:'reference'};
 document.body.dataset.product='v7';document.body.dataset.surface=r.scope==='participant'?'participant':r.scope==='output'?'stage':'operator';document.body.dataset.density=r.scope==='participant'?'comfortable':r.scope==='output'?'stage':innerWidth<=960?'field':'compact';document.body.dataset.dsVersion='7.0.0';document.body.dataset.scope=r.scope;document.body.dataset.screenKind=r.kind||'screen';document.body.dataset.role=V.role();
 const can=V.allowed(route)&&(r.scope!=='event'||V.eventAllowed(ETApp.state.activeEventId));let content;
 if(!can)content=V.denied();else if(!V.enabled(route))content=r.scope==='participant'?V.mobileShell('이용 안내',V.blank('이번 행사에서는 사용하지 않는 기능입니다.','행사 홈에서 지금 이용할 수 있는 기능을 확인하세요.',L('홈으로','mobile-home','primary','back'))):V.blank('사용하지 않는 기능입니다.','설정에서 활성화한 기능만 참가자에게 공개됩니다.',V.editable('settings')?L('기능 설정','features','primary','settings'):'');
 else content=ETViews[route]?ETViews[route]():V.blank('준비되지 않은 화면입니다.','체험 안내로 돌아가세요.',L('체험 안내','demo'));
 if(r.scope==='participant'||r.scope==='output'||['landing','login'].includes(route))return content;
 if(r.kind==='mode'&&can)return `<div class="et7-task-top"><a href="#onsite">${icon('back')} 현장 운영</a><strong>${e(V.E().name)}</strong><span>현장 작업 모드</span></div><main class="et7-field-task" id="main-content" tabindex="-1">${content}</main>${fieldDock(route)}`;
 return scopeSidebar(route)+`<div class="et7-workspace">${topbar(route)}${r.scope==='event'?moduleTabs(route):''}<main class="et7-content" id="main-content" tabindex="-1">${content}</main></div>${r.scope==='event'?fieldDock(route):''}`;
}};
})();

</script>
 <script>
(function(){'use strict';const V=ET7,P=ETProduct,U=ETUI,{e,icon,button:B,link:L,field,select,table,fmt}=U;const A=V.A,W=V.W,E=V.E;
const stateName=s=>({PRE:'준비 중',LIVE:'진행 중',END:'종료'}[s]||s);
V.eventCard=ev=>`<article class="et7-event-card"><div class="et7-event-art" data-status="${e(ev.status)}"><span>${e(ev.date.replaceAll('-','.'))}</span><strong>${e(ev.name)}</strong><small>${e(ev.client)}</small></div><div class="et7-event-card-body"><div class="et7-row between">${V.pill(stateName(ev.status),ev.status==='LIVE'?'success':'')}<span>${e(ev.time)}</span></div><h3>${e(ev.name)}</h3><p>${icon('pin')}${e(ev.venue)}</p><div class="et7-row between"><span>${fmt(P.summary(A().state.workspaces[ev.id]).total)}명 등록</span>${B('행사 열기','open-event','ink','arrow',`data-id="${e(ev.id)}"`)}</div></div></article>`;
ETViews['agency-home']=()=>{const s=A().state,m=s.events.map(ev=>P.summary(s.workspaces[ev.id]));return V.h('행사 운영의 전체 흐름','고객사와 여러 행사를 관리하고, 현장 업무는 각 행사에서 이어갑니다.',L('새 행사 만들기','setup','primary','plus'),'AGENCY WORKSPACE')+`<div class="et7-metrics">${V.metric('관리 행사',s.events.length+'건','포트폴리오 전체')}${V.metric('진행 중',s.events.filter(e=>e.status==='LIVE').length+'건','LIVE 상태 행사','accent')}${V.metric('등록 참가자',fmt(m.reduce((a,b)=>a+b.total,0))+'명','행사별 등록 합산 · 고유 인원 아님')}${V.metric('고객사',s.clients.length+'곳','등록된 고객사')}</div>`+V.panel('행사 포트폴리오','각 행사의 데이터와 운영 공간으로 이동합니다.',`<div class="et7-event-grid">${s.events.slice(0,4).map(V.eventCard).join('')}</div>`,L('전체 행사','events','text-btn','arrow'))+`<div class="et7-two">${V.panel('고객사','고객사별 행사와 담당자를 확인합니다.',`<div class="et7-rows">${s.clients.map(c=>`<a href="#clients" class="et7-list-row">${U.avatar(c.name)}<div class="grow"><strong>${e(c.name)}</strong><small>${e(c.contact)} · ${e(c.email)}</small></div><span>${s.events.filter(v=>v.client===c.name).length}건</span>${icon('chevron')}</a>`).join('')}</div>`)}${V.panel('최근 작업','초기 샘플이 아닌, 이 데모에서 수행한 작업입니다.',s.audit.length?`<div class="et7-rows">${s.audit.slice(0,5).map(l=>`<div class="et7-list-row"><div><strong>${e(l.eventName||'대행사')}</strong><small>${e(l.action)} · ${e(l.detail)}</small></div></div>`).join('')}</div>`:V.blank('새 작업이 아직 없습니다.','행사를 만들거나 설정을 저장하면 기록됩니다.'))}</div>`;};
ETViews.events=()=>{const q=A().ui.eventQuery||'',status=A().ui.eventStatus||'ALL',events=A().state.events.filter(ev=>V.eventAllowed(ev.id)&&(status==='ALL'||ev.status===status)&&[ev.name,ev.client].some(t=>t.toLowerCase().includes(q.toLowerCase())));return V.h('행사','운영할 행사를 선택하세요.',V.role()==='AGENCY'?L('새 행사','setup','primary','plus'):'','PORTFOLIO')+`<div class="et7-toolbar"><div class="et7-search">${icon('search')}<input id="v7-event-query" aria-label="행사명 또는 고객사 검색" placeholder="행사명 또는 고객사" value="${e(q)}"></div>${select('상태','v7-event-status',[['ALL','모든 상태'],['PRE','준비 중'],['LIVE','진행 중'],['END','종료']],status)}</div><div class="et7-event-grid">${events.map(V.eventCard).join('')}</div>${!events.length?V.blank('조건에 맞는 행사가 없습니다.','검색 조건을 바꾸거나 새 행사를 만드세요.'):''}`;};
ETViews.clients=()=>V.h('고객사','고객사와 담당자 정보를 관리합니다. 파트너 CRM은 별도 범위입니다.',B('고객사 추가','new-client','primary','plus'),'AGENCY / CLIENTS')+V.panel('고객사 목록',`${A().state.clients.length}곳`,table(['고객사','담당자','이메일','연결 행사','작업'],A().state.clients.map(c=>`<tr><td><strong>${e(c.name)}</strong></td><td>${e(c.contact)}</td><td>${e(c.email)}</td><td>${A().state.events.filter(v=>v.client===c.name).length}건</td><td>${B('편집','edit-client','sm','edit',`data-id="${e(c.id)}"`)}</td></tr>`)));
ETViews.access=()=>V.h('팀·권한','대행사 사용자 명단과 역할을 검토합니다. 실제 초대나 계정 인증은 하지 않습니다.',B('사용자 추가','new-member','primary','plus'),'AGENCY / TEAM')+`<nav class="et7-module-tabs"><a class="is-active" href="#access">사용자</a><a href="#agency-audit">활동 기록</a></nav>`+V.panel('대행사 사용자','이메일과 역할',table(['사용자','이메일','역할','작업'],A().state.members.map(m=>`<tr><td>${e(m.name)}</td><td>${e(m.email)}</td><td>${V.pill(m.role)}</td><td>${B('역할 편집','member-role','sm','edit',`data-id="${e(m.id)}"`)}</td></tr>`)))+`<div class="et7-notice">상단의 ‘권한 체험’은 화면 접근과 편집 제한을 검수하는 기능입니다. 상용 인증·서버 사용자 권한을 대신하지 않습니다.</div>`;

ETViews.setup=()=>{const d=A().ui.v7EventDraft||{},step=A().ui.v7EventStep||1;const featureNames={stamp:'부스·스탬프',poll:'투표',quiz:'퀴즈',qna:'Q&A',draw:'추첨',survey:'만족도',photo:'포토 이벤트',venue:'행사장 안내',board:'게시판'};return V.h('새 행사를 준비합니다','필수 정보만 먼저 설정하세요. 세부 기능은 행사 공간에서 이어갑니다.',L('행사 목록','events','','back'),'NEW EVENT')+`<div class="et7-wizard-steps">${['기본정보','참여 기능','검토'].map((t,i)=>`<div class="${step>=i+1?'active':''}"><b>${i+1}</b>${t}</div>`).join('')}</div><form id="v7-event-create"><div class="et7-panel et7-form-panel">${step===1?`<h2>행사의 기본 정보</h2><div class="form-grid">${field('행사명','name',d.name||'','text','required maxlength="120"')}${select('고객사','client',A().state.clients.map(c=>c.name),d.client||A().state.clients[0]?.name)}${field('개최일','date',d.date||'2026-11-20','date','required')}${field('시작 시간','time',d.time||'09:00','time','required')}${field('장소','venue',d.venue||'','text','required maxlength="100"')}${field('참가 정원 · 0은 제한 없음','capacity',d.capacity||300,'number','min="0" max="1000000" required')}${field('행사 주소 코드','slug',d.slug||'','text','required pattern="[a-z0-9-]{3,40}" placeholder="example-2026"')}</div><p class="et7-helper">주소에는 영문 소문자·숫자·하이픈만 사용합니다.</p>`:step===2?`<h2>필요한 참여 기능만 선택하세요</h2><p>쓰지 않는 기능은 참가자 메뉴와 운영 메뉴에서 숨깁니다.</p><div class="et7-feature-options">${Object.entries(featureNames).map(([k,n])=>`<label><input type="checkbox" name="feature_${k}" ${d['feature_'+k]?'checked':''}>${icon(k==='stamp'?'gift':k==='photo'?'photo':'spark')}<strong>${n}</strong></label>`).join('')}</div>`:`<h2>행사 만들기 전 확인</h2><dl class="et7-facts"><div><dt>행사</dt><dd>${e(d.name)}</dd></div><div><dt>고객사</dt><dd>${e(d.client)}</dd></div><div><dt>일시·장소</dt><dd>${e(d.date)} ${e(d.time)} · ${e(d.venue)}</dd></div><div><dt>정원</dt><dd>${e(d.capacity)}명</dd></div><div><dt>활성 기능</dt><dd>${Object.entries(featureNames).filter(([k])=>d['feature_'+k]).map(([,v])=>v).join(' · ')||'기본 등록·티켓만'}</dd></div></dl><div class="et7-notice">준비 중 상태로 생성됩니다. 참가자·인증·사진 등 타 행사 데이터는 복제하지 않습니다.</div>`}<div class="et7-wizard-footer">${step>1?B('이전','v7-event-prev','','back'):L('취소','events')}<button class="btn primary" type="submit">${step===3?'행사 준비 시작':'다음 단계'} ${icon('arrow')}</button></div></div></form>`;};
})();

</script>
 <script>
(function(){'use strict';const V=ET7,P=ETProduct,U=ETUI,{e,icon,button:B,link:L,field,select,table,fmt}=U,A=V.A,W=V.W,E=V.E;
V.readiness=()=>{const w=W();return [
 ['기본정보',!!E().name&&!!E().venue,'settings','행사명·일시·장소'],['참가자 등록',w.participants.length>0,'participants','명단 확인 또는 가져오기'],['등록 양식',w.fields.some(f=>f.id==='name')&&w.fields.some(f=>f.id==='phone'),'registration-form','이름·연락처 필수'],['입장 데스크',w.units.length>0,'check-units','스캔 작업 화면 준비'],...w.features.stamp?[['부스 등록',w.booths.length>0,'booths','인증할 부스와 운영시간'],[w.boothMode==='SELF'?'부스 QR 출력 확인':'스탭 담당 화면 확인',w.boothMode==='SELF'?w.booths.length>0&&w.booths.every(b=>w.product.printed[b.id]):false,'booths',w.boothMode==='SELF'?'출력 완료는 운영자 확인 기준':'각 부스에서 스탭 화면 열기']]:[],['행사 미디어',w.product.media.length>0,'media-library','행사 로고·키비주얼'],['리허설','false'===true,'preflight','실제 장비·현장 인수는 별도']];};
const checklist=()=>`<div class="et7-checklist">${V.readiness().map(([title,ok,r,sub])=>`<a href="#${r}"><span class="et7-check ${ok?'done':''}">${icon(ok?'check':'clock')}</span><div><strong>${e(title)}</strong><small>${e(sub)}</small></div>${V.pill(ok?'설정됨':'확인 필요',ok?'success':'warning')}${icon('chevron')}</a>`).join('')}</div>`;
ETViews.readiness=()=>V.h('행사 준비 체크','완료된 설정과 현장 확인이 필요한 항목을 구분합니다.','','EVENT / READINESS')+V.panel('준비 항목','설정 여부가 실기기 검수 완료를 의미하지는 않습니다.',checklist());
ETViews.overview=()=>{const w=W(),m=P.summary(w),status=E().status,pc=ETUX.programContext(E(),w,ETUX.nowFor(w));const phase={PRE:['행사를 준비하고 있습니다','현장 오픈 전에 필요한 설정을 확인하세요.','준비 중'],LIVE:['지금, 행사 현황을 확인하세요','입장·참여·확인이 필요한 작업을 한 화면에서 봅니다.','진행 중'],END:['행사의 결과를 정리합니다','운영 데이터와 현장 사진을 보고서로 묶으세요.','종료']}[status];const alerts=[...w.photos.some(p=>p.status==='PENDING')?[['사진 검토',w.photos.filter(p=>p.status==='PENDING').length+'장 대기','photos','photo']]:[],...w.qna.some(q=>!q.answer)?[['답변 대기 질문',w.qna.filter(q=>!q.answer).length+'건','qna','message']]:[],...w.messages.some(m=>m.status==='DRAFT')?[['메시지 초안',w.messages.filter(m=>m.status==='DRAFT').length+'건','messages','mail']]:[]].filter(([, ,r])=>V.allowed(r)&&V.enabled(r));return V.h(phase[0],phase[1],status==='END'?L('보고서 만들기','reports','primary','file'):status==='PRE'?L('준비 체크','readiness','primary','check'):L('입장 데스크','checkin','primary','scan'),'EVENT OVERVIEW')+`<section class="et7-event-heading"><div>${V.pill(phase[2],status==='LIVE'?'success':'')}<h2>${e(E().name)}</h2><p>${e(E().date)} ${e(E().time)} · ${e(E().venue)}</p></div><div><span class="et7-eyebrow">${w.ux.clock.mode==='rehearsal'?'시연 시각':'실제 시각'}</span><strong>${e(new Date(ETUX.nowFor(w)).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Seoul'}))}</strong>${V.editable('settings')?B('시간 기준','v5-clock','text-btn','clock'):''}</div></section><div class="et7-metrics">${V.metric('등록 참가자',fmt(m.total)+'명','취소 제외')}${V.metric('누적 입장',fmt(m.checked)+'명','한 번 이상 입장 · 중복 제외')}${V.metric('현재 입장 중',fmt(m.inside)+'명','퇴장한 참가자 제외','accent')}${V.metric('아직 미입장',fmt(m.notArrived)+'명','입장 기록 없는 참가자')}</div>`+(status==='PRE'?V.panel('오픈 전 확인','설정하고 실행 화면까지 점검하세요.',checklist()):status==='END'?V.panel('결과 요약','현재 저장된 운영 데이터',`<div class="et7-summary-columns"><div><strong>${m.rate}%</strong><span>입장률</span></div><div><strong>${w.responses.length}건</strong><span>만족도 응답</span></div><div><strong>${w.visits.length}건</strong><span>이 데모에서 추가한 부스 인증</span></div></div>`,L('전체 분석','analytics','','chart')):`<div class="et7-two">${V.panel('확인이 필요한 업무','누락된 작업부터 처리하세요.',alerts.length?`<div class="et7-rows">${alerts.map(([t,s,r,i])=>`<a class="et7-list-row" href="#${r}"><span class="et7-icon-box">${icon(i)}</span><div class="grow"><strong>${t}</strong><small>${s}</small></div>${icon('chevron')}</a>`).join('')}</div>`:V.blank('대기 작업이 없습니다.','실제 장치 상태까지 정상이라는 뜻은 아닙니다.'))}${V.panel('진행 프로그램','설정한 시간 기준',`<div class="et7-now"><span class="et7-eyebrow">NOW</span><h3>${e(pc.current?.title||'현재 진행 중인 일정 없음')}</h3><p>${e(pc.current?.location||'')}</p>${pc.next?`<div class="et7-next"><span>NEXT ${e(pc.next.time)}</span><strong>${e(pc.next.title)}</strong></div>`:''}</div>`,L('전체 일정','schedule','','calendar'))}</div>`)+V.panel('최근 입퇴장','새 처리부터 기록됩니다.',`<div class="et7-rows">${w.logs.slice(0,4).map(l=>`<div class="et7-list-row"><span class="et7-icon-box">${icon(l.action==='IN'?'check':'logout')}</span><div class="grow"><strong>${e(l.name)}</strong><small>${e(l.unit)}</small></div><span>${l.action==='IN'?'입장':l.action==='OUT'?'퇴장':'정정'}</span></div>`).join('')||'<p>아직 처리 기록이 없습니다.</p>'}</div>`,L('기록 보기','check-history','text-btn','arrow'));};
ETViews.groups=()=>V.h('참가자 그룹','등록과 운영에 사용할 그룹을 정의합니다.',V.editable('participants')?B('그룹 추가','v7-group-add','primary','plus'):'')+V.panel('등록 그룹','이름 변경 시 해당 그룹의 참가자에도 반영합니다.',table(['그룹','참가자 수','작업'],W().product.groups.map(g=>`<tr><td><strong>${e(g)}</strong></td><td>${W().participants.filter(p=>!p.cancelled&&p.group===g).length}명</td><td>${V.editable('participants')?B('이름 변경','v7-group-edit','sm','edit',`data-name="${e(g)}"`):'조회 전용'}</td></tr>`)));
ETViews['registration-form']=()=>V.h('등록 양식','필수 정보와 행사별 질문을 구성합니다.',V.editable('participants')?B('항목 추가','v7-field-add','primary','plus'):'','REGISTRATION / FORM')+`<div class="et7-two">${V.panel('입력 항목',`양식 버전 ${W().product.formVersion} · 기존 응답은 유지됩니다.`,`<div class="et7-rows">${W().fields.map((f,i)=>`<div class="et7-list-row"><span class="et7-counter">${i+1}</span><div class="grow"><strong>${e(f.label)} ${f.required?'<em>필수</em>':''}</strong><small>${e(f.type)} · ${e(f.id)}</small></div><div class="et7-row">${B('위','v7-field-move','icon-btn','','data-id="'+e(f.id)+'" data-delta="-1" '+(i===0?'disabled':''))}${B('편집','v7-field-edit','sm','edit','data-id="'+e(f.id)+'"')}${!['name','phone'].includes(f.id)?B('삭제','v7-field-delete','sm danger','','data-id="'+e(f.id)+'"'):''}</div></div>`).join('')}</div>`)}${V.panel('참가자 입력 미리보기','실제 참가 신청은 참가자 진입 화면에서 합니다.',W().fields.map(f=>f.type==='select'?select(f.label+(f.required?' *':''),'preview-'+f.id,f.options||[],null,'disabled'):field(f.label+(f.required?' *':''),'preview-'+f.id,'','text','disabled')).join(''))}</div>`;
ETViews.features=()=>V.h('기능 설정','필요한 기능만 켜서 운영자와 참가자 메뉴를 간소화합니다.','','EVENT / FEATURES')+`<form id="v7-features"><div class="et7-panel et7-form-panel"><div class="et7-feature-options">${Object.entries({stamp:'부스·스탬프',poll:'투표',quiz:'퀴즈',qna:'Q&A',draw:'럭키드로우',survey:'만족도',photo:'포토 이벤트',venue:'행사장 안내',board:'게시판'}).map(([k,n])=>`<label><input name="${k}" type="checkbox" ${W().features[k]?'checked':''}><strong>${n}</strong><small>${W().features[k]?'사용 중':'사용 안 함'}</small></label>`).join('')}</div><div class="et7-wizard-footer"><p>끄더라도 기존 데이터는 삭제하지 않습니다.</p><button type="submit" class="btn primary">기능 설정 저장</button></div></div></form>`;
ETViews.settings=()=>V.h('행사 기본정보','행사의 정보와 상태를 관리합니다. 일시정지 같은 전역 상태는 추가하지 않습니다.','','EVENT / SETTINGS')+`<form id="v7-event-settings"><div class="et7-panel et7-form-panel"><div class="form-grid">${field('행사명','name',E().name,'text','required')}${field('개최일','date',E().date,'date','required')}${field('시작 시간','time',E().time,'time','required')}${field('장소','venue',E().venue,'text','required')}${field('참가 정원','capacity',E().capacity,'number','min="0" max="1000000" required')}${select('행사 상태','status',[['PRE','준비 중'],['LIVE','진행 중'],['END','종료']],E().status)}</div><div class="field"><label for="v7-description">행사 소개</label><textarea id="v7-description" name="description" rows="4">${e(E().description)}</textarea></div><div class="et7-wizard-footer"><p>상태 변경은 이 행사의 화면에만 영향을 줍니다.</p><button class="btn primary" type="submit">변경 저장</button></div></div></form>`;
ETViews['event-members']=()=>V.h('행사 권한','이 행사에 참여하는 담당자를 기록합니다. 실제 계정 초대는 별도입니다.',B('담당자 추가','v7-member-add','primary','plus'))+V.panel('행사 담당자','데모 역할 설정',W().product.members.length?table(['이름','이메일','역할'],W().product.members.map(m=>`<tr><td>${e(m.name)}</td><td>${e(m.email)}</td><td>${e(P.ROLES[m.role])}</td></tr>`)):V.blank('행사 담당자가 없습니다.','대행사 사용자와 별개로 담당 범위를 정의할 수 있습니다.'));
const content=ETViews.content;for(const[r,tab]of [['notices','notice'],['venue-editor','venue'],['board-editor','board']])ETViews[r]=()=>{A().ui.contentTab=tab;return content();};
})();

</script>
 <script>
(function(){'use strict';const V=ET7,P=ETProduct,U=ETUI,{e,icon,logo,button:B,link:L,table,select,fmt}=U,A=V.A,W=V.W,E=V.E;
V.booth=()=>{const id=V.q().id;return id?W().booths.find(b=>b.id===id):W().booths[0];};
V.boothState=b=>{const now=ETUX.nowFor(W());if(b.endsAt&&now>=Date.parse(b.endsAt))return ['CLOSED','종료'];if(b.capacity&&b.used>=b.capacity)return['CLOSED','수량 소진'];if(b.startsAt&&now<Date.parse(b.startsAt))return['WAITING','운영 전'];return[b.status,({OPEN:'진행 중',WAITING:'대기 중',PAUSED:'대기 중',CLOSED:'종료'})[b.status]||'대기 중'];};
ETViews.onsite=()=>V.h('현장 운영','행사 안에서 필요한 작업 모드만 실행합니다.',L('입장 스캔','field-scanner','primary','scan'),'EVENT / ON-SITE')+`<div class="et7-work-grid">${[['입퇴장 데스크','참가자 QR 확인과 네임택 출력','check-units','scan'],['부스·스탬프',W().boothMode==='SELF'?'부스 QR을 출력해 참가자가 스캔':'스탭이 참가자 티켓을 스캔','booths','gift'],['입퇴장 기록','정상·중복·정정 결과 확인','check-history','clock'],['현장 사전 점검','카메라·인쇄·연결 상태 확인','preflight','shield']].filter(([,,r])=>V.allowed(r)&&V.enabled(r)).map(([t,s,r,i])=>`<a class="et7-work-card" href="#${r}"><span class="et7-icon-box">${icon(i)}</span><h2>${t}</h2><p>${s}</p><span class="et7-arrow">열기 ${icon('arrow')}</span></a>`).join('')}</div>`+V.panel('운영 범위','현재 선택한 행사만 처리합니다.',`<p>${e(E().name)} · ${W().units.length}개 데스크 · ${W().booths.length}개 부스</p><div class="et7-notice">작업 화면을 연다고 참가자 데이터가 복사되지 않습니다. 같은 행사의 데이터와 처리 기록을 사용합니다.</div>`);
ETViews['check-units']=()=>V.h('등록데스크','직원용·태블릿·키오스크를 데스크의 실행 모드로 관리합니다.',V.editable('onsite')?B('데스크 추가','v7-desk-add','primary','plus'):'','ON-SITE / DESKS')+`<div class="et7-desk-grid">${W().units.map(u=>`<article class="et7-desk-card"><div class="et7-row between"><span class="et7-icon-box">${icon(u.mode==='tablet'?'tablet':u.mode==='kiosk'?'monitor':'scan')}</span>${V.pill(u.action==='IN'?'입장':'퇴장')}</div><h2>${e(u.name)}</h2><p>${({desk:'직원용 등록데스크',tablet:'모바일·태블릿 스캔',kiosk:'참가자 자가 체크인'})[u.mode]||'직원용'}</p><small>연결 여부는 이 카드에서 추정하지 않습니다.</small><div class="et7-card-footer">${B('설정','v7-desk-edit','sm','settings',`data-id="${e(u.id)}"`)}${L('작업 화면 열기',(u.mode==='tablet'?'field-scanner':u.mode==='kiosk'?'kiosk':'checkin')+'?unit='+encodeURIComponent(u.id),'ink','arrow')}</div></article>`).join('')}</div>`+(!W().units.length?V.blank('데스크가 없습니다.','처리할 입장 또는 퇴장 데스크를 추가하세요.'): '');
ETViews.booths=()=>V.h('부스·스탬프','등록 → 안내판 출력 또는 스탭 배포 → 인증 기록으로 이어집니다.',V.editable('onsite')?B('부스 추가','v7-booth-add','primary','plus'):'','ON-SITE / BOOTHS')+`<section class="et7-mode-banner"><span class="et7-icon-box">${icon(W().boothMode==='SELF'?'phone':'tablet')}</span><div class="grow"><strong>${W().boothMode==='SELF'?'참가자 셀프 스캔':'스탭 확인 방식'}</strong><p>${W().boothMode==='SELF'?'참가자가 부스 안내판의 QR을 촬영합니다.':'스탭이 참가자의 티켓 QR을 촬영합니다.'} 행사 전체에 한 방식만 적용합니다.</p></div>${V.editable('onsite')?B('인증 방식','v5-booth-mode','sm','settings'):''}</section><div class="et7-booth-grid">${W().booths.map(b=>{const[status,name]=V.boothState(b);return`<article class="et7-booth-card"><div class="et7-row between"><span class="et7-eyebrow">${e(b.zone||'BOOTH')}</span>${V.pill(name,status==='OPEN'?'success':status==='WAITING'?'warning':'')}</div><h2>${e(b.name)}</h2><p>${e(b.description)}</p><div class="et7-progress"><div style="width:${b.capacity?Math.min(100,b.used/b.capacity*100):0}%"></div></div><div class="et7-row between"><small>이용 ${fmt(b.used)} / ${b.capacity?fmt(b.capacity):'제한 없음'}</small><small>1인 ${b.limit}회</small></div><div class="et7-card-footer">${L('상세','booth-detail?id='+e(b.id),'','chevron')}${W().boothMode==='SELF'?L('QR 출력','booth-print?id='+e(b.id),'ink','print'):L('스탭 인증','staff?booth='+e(b.id),'ink','scan')}</div></article>`;}).join('')}</div>`+(!W().booths.length?V.blank('첫 부스를 등록하세요.','등록한 부스별로 다른 QR과 이용 기록이 만들어집니다.'): '');
ETViews['booth-detail']=()=>{const b=V.booth();if(!b)return V.notFound();const[status,n]=V.boothState(b);const self=W().boothMode==='SELF';return V.h(b.name,'부스 설정과 현장 배포를 한곳에서 관리합니다.',V.editable('onsite')?B('부스 편집','v7-booth-edit','','edit',`data-id="${e(b.id)}"`):'','BOOTH / DETAIL')+`<div class="et7-two">${V.panel('운영 정보','시간·수량·상태',`<dl class="et7-facts"><div><dt>상태</dt><dd>${V.pill(n,status==='OPEN'?'success':'')}</dd></div><div><dt>위치</dt><dd>${e(b.zone||'미지정')}</dd></div><div><dt>운영 시작</dt><dd>${e(b.startsAt||'상시 운영')}</dd></div><div><dt>운영 종료</dt><dd>${e(b.endsAt||'종료 시각 없음')}</dd></div><div><dt>이용수량</dt><dd>${b.used} / ${b.capacity||'제한 없음'}</dd></div><div><dt>개인별 인증</dt><dd>${b.limit}회</dd></div></dl>${L('이 부스 이용 기록','booth-history?id='+e(b.id),'w100','clock')}`)}${V.panel(self?'부스 안내판':'담당 스탭 배포',self?'인쇄한 QR을 이 부스에 게시하세요.':'스탭 전용 작업 화면을 전달하세요.',self?`<div class="et7-booth-qr">${U.qr(b.credential)}</div><code class="et7-code">${e(b.credential)}</code>${L('안내판 출력 준비','booth-print?id='+e(b.id),'primary w100','print')}<small class="et7-helper">${W().product.printed[b.id]?'운영자 출력 완료 확인: '+e(W().product.printed[b.id].at):'아직 출력 완료를 확인하지 않았습니다.'}</small>`:`<div class="et7-direction">${icon('tablet')}<span>스탭</span>${icon('arrow')}${icon('scan')}<span>참가자 티켓</span></div>${L('스탭 화면 열기','staff?booth='+e(b.id),'primary w100','scan')}${B('작업 링크 복사','v7-staff-link','w100','external',`data-id="${e(b.id)}"`)}<div class="et7-notice">리허설 링크는 접근 권한을 보호하지 않습니다. 실제 배포 전 담당자 인증·만료가 필요합니다.</div>`)}</div>`;};
ETViews['booth-print']=()=>{const b=V.booth();if(!b)return V.notFound();if(W().boothMode!=='SELF')return V.h('스탭 확인 방식입니다','참가자용 부스 QR을 게시하지 않습니다.',L('부스 상세','booth-detail?id='+e(b.id),'primary','back'));const format=A().ui.posterFormat||'A4';return V.h('부스 QR 안내판','부스명과 QR 내용이 일치하는지 확인한 후 출력하세요.',L('부스 상세','booth-detail?id='+e(b.id),'','back'),'BOOTH / PRINT')+`<div class="et7-print-layout"><section class="et7-panel et7-print-options"><h2>출력 준비</h2>${select('안내판 형식','v7-poster-format',['A4','A5','QR'],format)}<div class="et7-notice">QR은 브라우저에서 실제 생성됩니다. 암호화된 상용 인증 토큰은 아닙니다.</div>${B('인쇄 / PDF 저장','v7-print','primary w100','print')}${B('QR PNG 다운로드','v7-qr-png','w100','download',`data-id="${e(b.id)}"`)}${B('QR SVG 다운로드','v7-qr-svg','w100','download',`data-id="${e(b.id)}"`)}${B('출력 완료 확인','v7-print-confirm','w100','check',`data-id="${e(b.id)}"`)}<small class="et7-helper">출력 완료는 실제 인쇄 여부를 운영자가 확인하는 기록입니다.</small></section><article id="et7-poster" class="et7-poster format-${format}"><div class="et7-poster-brand">${logo()}</div><span>${e(E().name)}</span><h2>${e(b.name)}</h2><p>QR을 스캔하고<br>스탬프를 받아보세요.</p><div id="et7-poster-qr">${U.qr(b.credential)}</div><code>${e(b.credential)}</code><footer>행사 모바일 웹 → 가운데 QR → 부스 QR 스캔<br><small>이 안내판의 QR은 위 부스에 연결됩니다.</small></footer></article></div>`;};
ETViews['booth-history']=()=>{const id=V.q().id,rows=W().visits.filter(v=>!id||v.boothId===id);return V.h('부스 이용 기록','새로운 인증부터 참가자·부스·시간이 기록됩니다.',L('부스 목록','booths','','back'))+V.panel('인증 이력',`${rows.length}건`,rows.length?table(['시간','부스','참가자','방식'],[...rows].reverse().map(v=>`<tr><td>${e(new Date(v.at).toLocaleString('ko-KR'))}</td><td>${e(W().booths.find(b=>b.id===v.boothId)?.name||v.boothId)}</td><td>${e(W().participants.find(p=>p.id===v.participantId)?.name||v.participantId)}</td><td>${v.mode==='SELF'?'셀프 스캔':'스탭 확인'}</td></tr>`)):V.blank('아직 인증 기록이 없습니다.','카드의 초기 수량은 합성 데이터이며, 새 인증부터 상세 기록이 남습니다.'));};
ETViews['field-more']=()=>V.h('현장 더보기','매번 쓰지 않는 관리 기능은 이곳에 모았습니다.','','FIELD / MORE')+`<div class="et7-rows et7-panel">${[['qna','message','Q&A 관리'],['photos','photo','사진 검토'],['notices','bell','공지 확인'],['preflight','wifi','연결·기기 점검'],['check-history','clock','입퇴장 기록'],['overview','grid','운영 현황']].filter(([r])=>V.allowed(r)&&V.enabled(r)).map(([r,i,t])=>`<a class="et7-list-row" href="#${r}">${icon(i)}<strong class="grow">${t}</strong>${icon('chevron')}</a>`).join('')}</div>`;
ETViews.kiosk=()=>`<div class="et7-kiosk"><span class="et7-eyebrow">SELF CHECK-IN · REHEARSAL</span><h1>${e(E().name)}</h1><p>본인의 모바일 티켓을 스캔하거나 코드를 입력하세요.</p><form id="v4-scan-form" data-ux-no-dirty><label class="sr-only" for="kiosk-ticket">티켓 코드</label><input id="kiosk-ticket" name="ticket" placeholder="DEMO-1001" required autocomplete="off"><button class="btn primary" type="submit">입장 확인</button></form>${A().ui.scanResult?`<section class="et7-kiosk-result"><h2>${e(A().ui.scanResult.title)}</h2><p>${e(A().ui.scanResult.person?.name||'')}</p></section>`:''}<small>인쇄 자동화 및 무인 단말 잠금은 실장비 연동 범위입니다.</small></div>`;
})();

 <script>
(function(){'use strict';const V=ET7,U=ETUI,{e,icon,button:B,link:L,fmt}=U,A=V.A,W=V.W,E=V.E;const M=(t,b)=>V.mobileShell(t,b),person=()=>A().attendee();
function safeMedia(usage){return W().product.media.find(a=>a.usage===usage&&a.mime.startsWith('image/'));}
V.engagementItems=()=>{const w=W(),p=person();const arr=[['poll','mobile-poll','chart','실시간 투표',w.poll.status==='OPEN'&&!Object.prototype.hasOwnProperty.call(w.poll.votes,p?.id),Object.prototype.hasOwnProperty.call(w.poll.votes,p?.id)?'응답 완료':w.poll.status==='OPEN'?'응답 접수 중':'마감'],['quiz','mobile-quiz','spark','퀴즈',w.quiz.status==='OPEN'&&!w.quiz.answers[p?.id],w.quiz.answers[p?.id]?'참여 완료':w.quiz.status==='OPEN'?'참여 가능':'마감'],['qna','mobile-qna','message','Q&A',true,'운영팀에 질문하기'],['stamp','mobile-stamp','gift','스탬프 투어',true,`${new Set(w.visits.filter(v=>v.participantId===p?.id).map(v=>v.boothId)).size} / ${w.booths.length}개 방문`],['photo','mobile-photo','photo','포토 이벤트',true,'사진 올리고 함께 보기'],['survey','mobile-survey','star','만족도 평가',w.survey.open&&!w.responses.some(r=>r.participantId===p?.id),w.responses.some(r=>r.participantId===p?.id)?'제출 완료':w.survey.open?'응답 접수 중':'현재 닫힘']];return arr.filter(([k])=>w.features[k]);};
ETViews['mobile-home']=()=>{const p=person(),w=W(),pc=ETUX.programContext(E(),w,ETUX.nowFor(w)),media=safeMedia('keyvisual');const current=V.engagementItems().find(x=>x[4]);return M('',`<section class="et7-mobile-cover ${media?'has-image':''}">${media?`<img src="${e(media.data)}" alt="행사 키비주얼">`:''}<div><span>${V.pill(({PRE:'준비 중',LIVE:'진행 중',END:'종료'})[E().status],E().status==='LIVE'?'success':'')}</span><h1>${e(E().name)}</h1><p>${e(E().date.replaceAll('-','.'))}<br>${e(E().venue)}</p></div></section><div class="et7-greeting"><div><strong>${e(p?.name||'참가자')}님, 반갑습니다.</strong><p>${p?.cancelled?'등록 취소 상태입니다. 운영팀에 문의하세요.':p?.status==='IN'?'행사장에 입장 중입니다.':'입장할 때 아래 QR 버튼을 눌러주세요.'}</p></div>${p?.status==='IN'?icon('check'):icon('scan')}</div>${!p?L('참가 신청','mobile-registration','primary w100','plus'):p.cancelled?`<div class="et7-notice">취소된 등록에는 입장 티켓을 표시하지 않습니다.</div>`:p.status!=='IN'?`<a class="et7-mobile-action" href="#mobile-qr"><span class="et7-icon-box">${icon('scan')}</span><div><small>입장 준비</small><strong>모바일 티켓 보여주기</strong></div>${icon('chevron')}</a>`:current?`<a class="et7-mobile-action" href="#${current[1]}"><span class="et7-icon-box">${icon(current[2])}</span><div><small>지금 참여할 수 있어요</small><strong>${current[3]}</strong></div>${icon('chevron')}</a>`:''}<section class="et7-mobile-section"><header><h2>지금과 다음</h2><a href="#mobile-program">전체 일정 ${icon('chevron')}</a></header><small class="et7-helper">${w.ux.clock.mode==='rehearsal'?'시연 시각 기준':'실제 시각 기준'}</small><div class="et7-agenda-card"><span class="et7-eyebrow">NOW</span><h3>${e(pc.current?.title||'현재 진행 중인 일정이 없습니다.')}</h3><p>${e(pc.current?.location||'일정에서 다음 프로그램을 확인하세요.')}</p>${pc.next?`<a href="#mobile-program"><span>NEXT ${e(pc.next.time)}</span><strong>${e(pc.next.title)}</strong>${icon('chevron')}</a>`:''}</div></section>${w.notices.length?`<section class="et7-mobile-section"><header><h2>행사 소식</h2><a href="#mobile-notice">전체 보기</a></header><a href="#mobile-notice" class="et7-notice-card">${icon( ETViews['mobile-ticket']=ETViews['mobile-qr'];

ETViews['mobile-more']=()=>M('더보기',`<div class="et7-mobile-title"><span class="et7-eyebrow">EVENT GUIDE</span><h1>필요한 정보를<br>간편하게 확인하세요.</h1></div><div class="et7-mobile-list">${[['mobile-info','person','신청 정보','내 등록 내용 확인',true],['mobile-notice','bell','공지사항','운영팀의 최신 안내',true],['mobile-venue','pin','행사장 안내','장소와 동선',W().features.venue],['mobile-board','board','행사 게시판','행사에 남기는 이야기',W().features.board],['mobile-help','help','이용 도움말','티켓·스탬프·문의 안내',true]].filter(x=>x[4]).map(([r,i,t,s])=>`<a href="#${r}"><span class="et7-icon-box">${icon(i)}</span><div><strong>${t}</strong><small>${s}</small></div>${icon('chevron')}</a>`).join('')}</div>`);
ETViews['mobile-info']=()=>{const p=person();return M('신청 정보',p?`<div class="et7-mobile-title"><h1>나의 신청 정보</h1><p>정보 수정이 필요하면 현장 운영팀에 문의해주세요.</p></div><dl class="et7-facts et7-mobile-facts">${[['이름',p.name],['소속',p.company],['연락처',p.phone],['이메일',p.email],['그룹',p.group],['등록 상태',p.cancelled?'취소':'등록 완료'],...W().fields.filter(f=>!['name','phone','company','email'].includes(f.id)).map(f=>[f.label,p.customAnswers?.[f.id]||'응답 없음'])].map(([k,v])=>`<div><dt>${e(k)}</dt><dd>${e(v)}</dd></div>`).join('')}</dl>`:V.blank('참가 정보가 없습니다.','등록 후 확인할 수 있습니다.',L('참가 신청','mobile-registration','primary','plus')));};
ETViews['mobile-help']=()=>M('이용 도움말',`<div class="et7-mobile-title"><h1>행사 이용 안내</h1></div>${[['입장할 때는 어떻게 하나요?','하단 가운데 QR을 눌러 내 티켓을 등록데스크에 보여주세요.'],['부스에서는 어떤 QR을 쓰나요?',W().boothMode==='SELF'?'QR → 부스 QR 스캔을 눌러 부스 안내판을 촬영하세요.':'부스 스탭에게 내 티켓 QR을 보여주세요.'],['QR 카메라가 열리지 않아요.','브라우저 권한을 확인하세요. 지원하지 않는 환경에서는 화면의 코드 입력을 사용하거나 스탭에게 도움을 요청하세요.'],['등록 정보를 수정하고 싶어요.','현장 운영팀에 문의해주세요. 이 데모는 실제 고객센터와 연결되지 않습니다.']].map(([t,s])=>`<details class="et7-faq"><summary>${t}</summary><p>${e(s)}</p></details>`).join('')}`);

 <script>
(function(){'use strict';const V=ET7,P=ETProduct,U=ETUI,{e,icon,button:B,link:L,select,fmt}=U,A=V.A,W=V.W,E=V.E;
V.mediaCard=a=>`<article class="et7-media-card"><div class="et7-media-preview">${a.mime.startsWith('video/')?`<video src="${e(a.data)}" controls muted playsinline preload="metadata"></video>`:`<img src="${e(a.data)}" alt="${e(a.name)}">`}</div><div class="et7-media-meta"><strong>${e(a.name)}</strong><small>${e(a.mime)} · ${Math.ceil(a.size/1024)} KB</small>${select('사용 위치','v7-media-usage-'+a.id,[['logo','로고'],['keyvisual','참가자 키비주얼'],['background','대기 배경'],['draw','추첨 배경'],['photo','포토월 배경'],['venue','행사장 안내도'],['program','시간표 이미지'],['video','동영상']],a.usage,`data-media-id="${e(a.id)}"`)}<div class="et7-row between">${B('출력에 사용','v7-media-use','sm ink','monitor',`data-id="${e(a.id)}"`)}${B('삭제','v7-media-delete','sm danger','trash',`data-id="${e(a.id)}"`)}</div></div></article>`;
ETViews['media-library']=()=>V.h('행사 미디어','행사별 로고·키비주얼·배경을 등록하고, 기본 스크린 출력에 사용합니다.',B('미디어 추가','v7-media-add','primary','upload'),'SCREEN / ASSETS')+`<div class="et7-notice">이미지와 짧은 영상의 리허설 재생입니다. 이미지 약 1MB·영상 약 2MB, 행사별 저장 약 3MB로 제한합니다. 상용 저장소·대용량 영상 전송은 미연동입니다.</div><div class="et7-media-grid">${W().product.media.map(V.mediaCard).join('')}</div>${!W().product.media.length?V.blank('행사 미디어를 등록하세요.','이미지는 참가자 키비주얼과 행사 스크린에 함께 사용할 수 있습니다.',B('파일 올리기','v7-media-add','primary','upload')):''}`;
V.outputData=()=>window.ETTransport?.displayProjection?.product||P.presentationSnapshot(A().state);
V.outputMarkup=(d,preview=false)=>{const cfg=d.settings||{},asset=d.media?.find(a=>a.id===cfg.assetId),bg=d.media?.find(a=>a.usage==='background'&&a.mime.startsWith('image/')),logo=d.media?.find(a=>a.usage==='logo'&&a.mime.startsWith('image/'));let inner='';
 if(cfg.type==='media'&&asset)inner=asset.mime.startsWith('video/')?`<video class="et7-output-video" src="${e(asset.data)}" ${preview?'muted':'controls autoplay muted playsinline'} style="object-fit:${e(cfg.fit||'contain')}" loop preload="metadata"></video>`:`<img class="et7-output-media" src="${e(asset.data)}" alt="${e(asset.name)}" style="object-fit:${e(cfg.fit||'contain')}">`;
 else if(cfg.type==='poll'){const totals=(d.poll?.base||[]).map((b,i)=>b+Object.values(d.poll?.votes||{}).filter(v=>v===i).length),total=totals.reduce((n,v)=>n+v,0);inner=`<div class="et7-output-content"><span>LIVE POLL</span><h1>${e(d.poll?.title)}</h1><div class="et7-output-bars">${(d.poll?.options||[]).map((t,i)=>`<div><label>${e(t)}<b>${total?Math.round(totals[i]/total*100):0}%</b></label><div><i style="width:${total?totals[i]/total*100:0}%"></i></div></div>`).join('')}</div><p>${fmt(total)}개의 응답</p></div>`;}
 else if(cfg.type==='quiz')inner=`<div class="et7-output-content"><span>LIVE QUIZ</span><h1>${e(d.quiz?.title)}</h1>${d.quiz?.answer?`<div class="et7-answer">${e(d.quiz.answer)}</div>`:'<p>모바일에서 답을 제출해주세요.</p>'}</div>`;
 else if(cfg.type==='draw')inner=`<div class="et7-output-content"><span>LUCKY DRAW</span>${d.draw?`<h1>${e(d.draw.name)}</h1><p>${e(d.draw.company)}</p><strong>축하합니다!</strong>`:'<h1>다음 행운의 주인공은?</h1><p>당첨 결과는 운영자가 공개한 후 표시됩니다.</p>'}</div>`;
 else if(cfg.type==='photos'){const photos=d.photos||[];inner=photos.length?`<div class="et7-output-photos layout-${e(cfg.layout)}">${photos.slice(0,preview?4:24).map((p,i)=>`<figure data-wall-index="${i}">${p.data?`<img src="${e(p.data)}" alt="${e(p.caption)}">`:`<div class="et7-synthetic-photo"><strong>${e(p.caption)}</strong><small>가상 샘플 사진</small></div>`}<figcaption>${e(p.caption)} <span>${e(p.author)}</span></figcaption></figure>`).join('')}</div>`:`<div class="et7-output-content"><span>PHOTO WALL</span><h1>함께한 순간을 기다립니다.</h1><p>공개 승인된 사진이 이곳에 표시됩니다.</p></div>`;}
 else inner=`${bg?`<img class="et7-output-bg" src="${e(bg.data)}" alt="">`:''}<div class="et7-output-content">${logo?`<img class="et7-stage-logo" src="${e(logo.data)}" alt="행사 로고">`:'<span>PEOPLE · EVENTS · CONNECTED</span>'}<h1>${e(d.event?.name||'EVENTOUCH')}</h1><p>${e(d.event?.date)} · ${e(d.event?.venue)}</p><strong>잠시 후 시작합니다.</strong></div>`;
 return `<div class="et7-output ${preview?'is-preview':''}" data-output-kind="${e(cfg.type||'idle')}">${inner}</div>`;
};
ETViews.presentation=()=>{const d=P.presentationSnapshot(A().state),names={idle:'행사 대기 화면',media:'업로드 미디어',poll:'투표 결과',quiz:'퀴즈',draw:'당첨 결과',photos:'포토월'};return V.h('행사 스크린','행사 미디어와 참여 결과를 보여주는 출력 기능입니다.',B('출력 창 열기','v7-output-open','primary','monitor'),'SCREEN / OUTPUT')+`<div class="et7-presentation-layout"><section class="et7-panel"><header class="et7-panel-head"><div><h2>현재 출력 설정</h2><p>${e(names[d.settings.type])} · 관객 화면에서 메뉴는 보이지 않습니다.</p></div>${V.pill('설정 미리보기')}</header>${V.outputMarkup(d,true)}<div class="et7-panel-body et7-row between"><span>이미지·영상은 행사 미디어에서 지정합니다.</span>${L('미디어 관리','media-library','','photo')}</div></section><section class="et7-panel et7-output-options"><h2>콘텐츠 선택</h2><p>기본 출력은 별도 제어실 없이 선택할 수 있습니다.</p>${Object.entries(names).filter(([type])=>type!=='media'&&(!({poll:'poll',quiz:'quiz',draw:'draw',photos:'photo'})[type]||W().features[({poll:'poll',quiz:'quiz',draw:'draw',photos:'photo'})[type]])).map(([type,name])=>B(name,'v7-output-type',`w100 ${d.settings.type===type?'ink':''}`,({idle:'photo',poll:'chart',quiz:'spark',draw:'gift',photos:'photo'})[type],`data-type="${type}"`)).join('')}<small>개인 이름이 포함되는 당첨 결과는 고급 추첨 화면에서 먼저 공개해야 표시됩니다.</small></section></div><div class="et7-two">${V.panel('포토월 설정','승인된 사진을 그리드 또는 한 장씩 보여줍니다.',L('포토월 구성','photo-wall','w100','photo'))}${V.panel('고급 연출 · 선택 기능','Preview/TAKE와 3D 장면은 필요할 때만 사용합니다.',L('고급 라이브 제어','live-control','w100','spark'))}</div>`;};
ETViews['screen-output']=()=>`<main id="main-content" class="et7-screen-output" tabindex="-1">${V.outputMarkup(V.outputData())}<div class="et7-output-controls"><button data-action="v7-fullscreen" class="btn ink">${icon('monitor')} 전체화면</button><span>리허설 출력 · 소리는 영상 컨트롤에서 직접 켜세요.</span></div></main>`;
ETViews['photo-wall']=()=>V.h('포토월','사진 검토와 분리된 출력 설정입니다.',B('포토월 출력 창','v7-wall-open','primary','monitor'),'SCREEN / PHOTO WALL')+`<div class="et7-two">${V.panel('공개 사진',`${W().photos.filter(p=>p.status==='APPROVED').length}장`,V.outputMarkup({...P.presentationSnapshot(A().state),settings:{...W().product.presentation,type:'photos'}},true),L('사진 검토','photos','text-btn','arrow'))}<form id="v7-wall-settings" class="et7-panel et7-form-panel"><h2>출력 레이아웃</h2>${select('레이아웃','layout',[['grid','그리드'],['spotlight','한 장씩 표시']],W().product.presentation.layout)}${U.field('사진 전환 간격 · 초','seconds',W().product.presentation.seconds,'number','min="3" max="60" required')}<div class="et7-notice">한 장씩 표시는 승인 사진을 순서대로 순환합니다. 노출 여부는 사진 검토에서 변경합니다.</div><button type="submit" class="btn primary w100">포토월 설정 저장</button></form></div>`;
ETViews.photos=()=>{const filter=A().ui.photoFilter||'PENDING',selected=A().ui.photoSelected||[],rows=W().photos.filter(p=>p.status===filter);return V.h('사진 검토','어떤 사진을 공개할지 결정합니다. 관객에게 보여주는 구성은 포토월에서 설정합니다.',L('포토월 설정','photo-wall','','monitor'),'ENGAGEMENT / PHOTO')+`<div class="et7-filter-tabs">${[['PENDING','검토 대기'],['APPROVED','공개'],['HIDDEN','비공개']].map(([k,t])=>B(`${t} ${W().photos.filter(p=>p.status===k).length}`,'v7-photo-filter',filter===k?'ink':'','',`data-status="${k}"`)).join('')}</div>${selected.length?`<div class="et7-selection-bar"><strong>${selected.length}장 선택</strong>${B('선택 공개','v7-photo-bulk','ink','check','data-status="APPROVED"')}${B('선택 비공개','v7-photo-bulk','','','data-status="HIDDEN"')}${B('해제','v7-photo-clear','text-btn')}</div>`:''}<div class="et7-photo-grid">${rows.map(p=>`<article class="et7-photo-card"><label class="et7-photo-select"><input type="checkbox" data-photo-select="${e(p.id)}" ${selected.includes(p.id)?'checked':''} aria-label="${e(p.author)} 사진 선택"></label><div class="et7-photo-content">${p.data?`<img src="${e(p.data)}" alt="${e(p.caption)}">`:`<div class="et7-synthetic-photo"><strong>${e(p.caption)}</strong><small>가상 샘플 콘텐츠</small></div>`}</div><div class="et7-photo-meta"><strong>${e(p.author)}</strong><p>${e(p.caption)}</p><div class="et7-row">${B('공개','v7-photo-one','ink','check',`data-id="${e(p.id)}" data-status="APPROVED"`)}${B('비공개','v7-photo-one','','',`data-id="${e(p.id)}" data-status="HIDDEN"`)}</div></div></article>`).join('')}</div>${!rows.length?V.blank('해당 사진이 없습니다.','새 참가자 사진은 검토 대기에 들어옵니다.'):''}`;};
})();

</script>
 <script>
(function(){'use strict';const V=ET7,P=ETProduct,U=ETUI,{e,icon,button:B,link:L,field,select,table,fmt}=U,A=V.A,W=V.W,E=V.E;
const status=s=>({DRAFT:'초안',SCHEDULED:'예약 준비',SIMULATED:'시뮬레이션 완료',CANCELLED:'취소'})[s]||s;
ETViews.messages=()=>V.h('캠페인','대상과 내용을 검토해 안내 메시지를 준비합니다. 실제 발송은 하지 않습니다.',V.editable('communication')?L('캠페인 만들기','campaign-compose','primary','plus'):'','COMMUNICATION / CAMPAIGNS')+V.panel('준비한 캠페인',`${W().messages.length}건`,table(['캠페인','대상','채널','예약 시간','상태','작업'],W().messages.map(m=>`<tr><td><a class="et7-table-link" href="#campaign-detail?id=${e(m.id)}">${e(m.title)}</a></td><td>${fmt(m.count)}명</td><td>${e(m.channel)}</td><td>${e(m.scheduled||'없음')}</td><td>${V.pill(status(m.status),m.status==='SIMULATED'?'success':'')}</td><td>${L('검토 내용','campaign-detail?id='+e(m.id),'sm','chevron')}</td></tr>`)));
ETViews.templates=()=>V.h('메시지 템플릿','여러 캠페인에서 재사용할 문구를 관리합니다.',B('템플릿 추가','v7-template-add','primary','plus'))+`<div class="et7-two">${W().product.templates.map(t=>V.panel(t.name,t.channel,`<div class="et7-message-sample">${e(t.content)}</div><div class="et7-card-footer">${B('편집','v7-template-edit','','edit',`data-id="${e(t.id)}"`)}${L('이 템플릿으로 준비','campaign-compose?template='+e(t.id),'ink','arrow')}</div>`)).join('')}</div>`;
ETViews.deliveries=()=>V.h('발송 내역','외부 공급사 미연동 상태를 명확히 표시합니다.','','COMMUNICATION / DELIVERY')+`<div class="et7-notice">실제 전송·도달·실패 수를 수집하지 않습니다. 아래 내역은 캠페인 준비 상태입니다.</div>`+V.panel('발송 준비 이력','실제 발송 실적으로 해석하지 마세요.',table(['캠페인','준비 대상','처리 상태','실제 전달'],W().messages.map(m=>`<tr><td>${e(m.title)}</td><td>${fmt(m.count)}명</td><td>${status(m.status)}</td><td>미연동</td></tr>`)));
V.recipients=d=>{const ids=A().ui.selectedPeople||[];return W().participants.filter(p=>!p.cancelled&&(d.target==='IN'?p.status==='IN':d.target==='NEVER'?!p.everIn:d.target==='SELECTED'?ids.includes(p.id):true)&&(!d.group||d.group==='ALL'||p.group===d.group));};
ETViews['campaign-compose']=()=>{A().ui.v7Campaign??={target:'ALL',group:'ALL',channel:'알림톡'};const d=A().ui.v7Campaign,step=A().ui.v7CampaignStep||1,rows=V.recipients(d);return V.h('캠페인 준비','대상 → 내용 → 발송 조건 → 검토 순서로 확인합니다.',L('캠페인 목록','messages','','back'),'COMMUNICATION / CREATE')+`<div class="et7-wizard-steps">${['대상','내용','발송 조건','검토'].map((t,i)=>`<div class="${step>=i+1?'active':''}"><b>${i+1}</b>${t}</div>`).join('')}</div><form id="v7-campaign"><div class="et7-panel et7-form-panel">${step===1?`<h2>누구에게 보낼까요?</h2><div class="form-grid">${select('대상 범위','target',[['ALL','전체 참가자'],['IN','현재 입장 중'],['NEVER','아직 미입장'],['SELECTED','명단에서 선택한 참가자']],d.target)}${select('그룹','group',[['ALL','모든 그룹'],...W().product.groups],d.group)}</div><div class="et7-campaign-count"><strong>${rows.length}</strong>명의 유효한 참가자</div><p>취소된 등록은 제외합니다. 선택된 참가자 ${A().ui.selectedPeople?.length||0}명</p>`:step===2?`<h2>어떤 내용을 전할까요?</h2>${field('캠페인 이름','title',d.title||'','text','required maxlength="80"')}${select('템플릿 불러오기','v7-template-choice',[['','직접 입력'],...W().product.templates.map(t=>[t.id,t.name])],d.templateId||'')}<div class="field"><label for="v7-message-body">메시지 내용</label><textarea id="v7-message-body" name="content" rows="7" required maxlength="2000">${e(d.content||'')}</textarea><small>{{이름}}, {{행사명}} 치환은 미리보기 예시입니다. 공급사 템플릿 승인은 별도입니다.</small></div>`:step===3?`<h2>발송 조건을 준비합니다</h2><div class="form-grid">${select('채널','channel',['알림톡','SMS','LMS','MMS'],d.channel)}${field('예약 시간 · KST · 비우면 초안','scheduled',d.scheduled||'','datetime-local')}</div><label class="et7-check-label"><input type="checkbox" name="fallback" ${d.fallback?'checked':''}>알림톡 실패 시 문자 전환을 제안 조건에 포함</label><div class="et7-notice">비용은 공급사 계약·템플릿·발송 조건을 확정한 뒤 산정합니다. 현재는 0원이 아니라 미산정입니다.</div>`:`<h2>저장 전 확인하세요</h2><dl class="et7-facts"><div><dt>캠페인</dt><dd>${e(d.title)}</dd></div><div><dt>검토 대상</dt><dd>${d.recipientIds?.length||0}명 · 검토 시점 고정</dd></div><div><dt>채널</dt><dd>${e(d.channel)}</dd></div><div><dt>예약</dt><dd>${e(d.scheduled||'예약 없음 · 초안')}</dd></div><div><dt>비용·실제 발송</dt><dd>미산정 · 발송하지 않음</dd></div></dl><div class="et7-message-sample">${e((d.content||'').replaceAll('{{이름}}',rows[0]?.name||'참가자').replaceAll('{{행사명}}',E().name))}</div><label class="et7-check-label"><input type="checkbox" name="confirm" required>대상·내용·예약 조건을 확인했습니다.</label>`}<div class="et7-wizard-footer">${step>1?B('이전','v7-campaign-prev','','back'):L('취소','messages')}<button type="submit" class="btn primary">${step===4?'발송 없이 저장':'다음 단계'} ${icon('arrow')}</button></div></div></form>`;};
ETViews['campaign-detail']=()=>{const m=W().messages.find(m=>m.id===V.q().id);if(!m)return V.notFound();return V.h(m.title,'검토 시점 대상과 발송 준비 정보를 확인합니다.',L('목록','messages','','back'))+V.panel('캠페인 정보',status(m.status),`<dl class="et7-facts"><div><dt>대상</dt><dd>${m.count}명 · ${e(m.target)}</dd></div><div><dt>채널</dt><dd>${e(m.channel)}</dd></div><div><dt>예약</dt><dd>${e(m.scheduled||'없음')}</dd></div><div><dt>외부 전송</dt><dd>실행하지 않음</dd></div></dl><div class="et7-message-sample">${e(m.content)}</div>${V.editable('communication')&&m.status!=='CANCELLED'?B('캠페인 취소','cancel-campaign','danger','close',`data-id="${e(m.id)}"`):''}`);};
ETViews.analytics=()=>{const w=W(),m=P.summary(w),avg=w.responses.length?w.responses.reduce((n,r)=>n+r.scores.reduce((a,b)=>a+b,0)/r.scores.length,0)/w.responses.length:0;return V.h('행사 결과 분석','현재 운영 데이터를 읽는 화면입니다. 보고서 작성과 분리했습니다.',L('보고서로 정리','reports','primary','file'),'RESULTS / ANALYTICS')+`<div class="et7-metrics">${V.metric('등록',fmt(m.total)+'명','취소 제외')}${V.metric('입장률',m.rate+'%','누적 입장 ÷ 등록','accent')}${V.metric('만족도',w.responses.length?avg.toFixed(1)+' / 5':'응답 없음',w.responses.length+'명 응답')}${V.metric('부스 신규 기록',w.visits.length+'건','데모에서 추가한 인증')}</div><div class="et7-two">${V.panel('그룹별 등록','등록된 모든 그룹을 집계합니다.',`<div class="et7-stat-bars">${w.product.groups.map(g=>{const n=w.participants.filter(p=>!p.cancelled&&p.group===g).length;return`<div><div><strong>${e(g)}</strong><span>${n}명</span></div><div class="et7-progress"><i style="width:${m.total?n/m.total*100:0}%"></i></div></div>`;}).join('')}</div>`)}${V.panel('부스 이용','초기 합성 수량 + 이번 데모의 인증 수량',table(['부스','이용','인증 기록'],w.booths.map(b=>`<tr><td>${e(b.name)}</td><td>${b.used}</td><td>${w.visits.filter(v=>v.boothId===b.id).length}</td></tr>`)))}</div>`;};
ETViews.reports=()=>V.h('결과보고서','운영 데이터의 스냅샷을 만들고 검토·출력합니다.',V.editable('results')?B('보고서 생성','v7-report-create','primary','plus'):'','RESULTS / REPORTS')+V.panel('저장한 보고서','생성 시점의 수치와 사진을 보관합니다.',W().product.reports.length?`<div class="et7-rows">${W().product.reports.map(r=>`<a class="et7-list-row" href="#report-preview?id=${e(r.id)}"><span class="et7-icon-box">${icon('file')}</span><div class="grow"><strong>${e(r.title)}</strong><small>${e(new Date(r.at).toLocaleString('ko-KR'))} · ${r.metrics.total}명</small></div>${icon('chevron')}</a>`).join('')}</div>`:V.blank('아직 보고서가 없습니다.','현재 운영 데이터와 공개 사진으로 첫 보고서를 만들어보세요.'))+`<details class="et7-advanced"><summary>고급 편집 · 기존 캔버스 프로토타입</summary><p>텍스트 배치·페이지 편집은 선택 기능입니다. 자유 이미지 편집·PPTX 출력은 미구현입니다.</p>${L('캔버스 편집기','report-canvas','','edit')}</details>`;

<script>

 act['v4-camera-start']=startCamera;act['v4-camera-stop']=stopCamera;act['v4-retry-queue']=()=>T.retryQueue();

 act['claim-stamp']=el=>command('booth.visit',{participantId:A.attendee()?.id,boothId:el.dataset.id},'부스 스탬프가 반영되었습니다.');
 async function scan(ticket,action){try{const r=await command('check.scan',{ticket,action,unit:A.ui.unitName||'현장 데스크'});const p=W().participants.find(p=>p.ticket===String(ticket).trim().toUpperCase());A.ui.lastCheck={ok:!r.queued,participant:p,person:p,name:p?.name||'',code:r.queued?'QUEUED':'OK',action,message:r.queued?'연결 후 전송 대기 · 입장 미확정':action==='IN'?'입장이 완료되었습니다.':'퇴장이 완료되었습니다.'};A.render();const feedback=document.getElementById('v4-scan-feedback');if(feedback)feedback.innerHTML=`<div class="v4-scanner-result ${r.queued?'v4-result-wait':'v4-result-good'}"><h2>${e(A.ui.lastCheck.message)}</h2><p>${e(p?.name||ticket)} · ${e(p?.company||'')}</p></div>`;return r;}catch(err){A.ui.lastCheck={ok:false,code:err.message.includes('이미')?'ALREADY_IN':'ERROR',message:err.message};A.render();const feedback=document.getElementById('v4-scan-feedback');if(feedback)feedback.innerHTML=`<div class="v4-scanner-result v4-result-bad"><h2>처리하지 않았습니다.</h2><p>${e(err.message)}</p></div>`;A.toast(err.message,'error');return{ok:false};}}

 V.handleSubmit=async form=>{const f=Object.fromEntries(new FormData(form));
 switch(form.id){
 case 'v4-scan-form':case 'scan-form':case 'checkin-form':await scan(f.ticket||f.code||form.querySelector('input')?.value,f.action||A.ui.checkAction||'IN');return true;
 case 'mobile-poll-form':await command('poll.vote',{participantId:A.attendee()?.id,option:Number(f.option)},'투표를 접수했습니다.');A.render();return true;
 case 'mobile-quiz-form':await command('quiz.answer',{participantId:A.attendee()?.id,answer:f.answer},'퀴즈 답변을 접수했습니다.');A.render();return true;
 case 'mobile-survey-form':await command('survey.submit',{participantId:A.attendee()?.id,scores:W().survey.questions.map((_,i)=>Number(f['score_'+i])),comment:f.comment},'의견을 전달했습니다.');A.render();return true;

 case 'v4-unit-form':W().units.push({id:'desk-'+Date.now().toString(36),name:f.name,action:f.action});A.closeDialog();A.save('ADD_CHECK_UNIT',f.name,'데스크를 추가했습니다.');return true;

 async function importFile(file){if(!file)return;if(file.size>2*1024*1024)throw Error('2MB 이하 CSV를 선택하세요.');const rows=X.parseCSV(await file.text());if(rows.length<2)throw Error('헤더와 참가자 행이 필요합니다.');if(rows.length>1001)throw Error('한 번에 1,000명까지 가져올 수 있습니다.');const aliases={'이름':'name','연락처':'phone','소속':'company','이메일':'email','그룹':'group',name:'name',phone:'phone',company:'company',email:'email',group:'group'},keys=rows[0].map(h=>aliases[h.trim()]);if(!keys.includes('name')||!keys.includes('phone'))throw Error('이름과 연락처 헤더가 필요합니다.');const known=new Set(W().participants.filter(p=>!p.cancelled).map(p=>p.name+'|'+p.phone)),valid=[],errors=[];rows.slice(1).forEach((r,i)=>{const p={};keys.forEach((k,j)=>{if(k)p[k]=String(r[j]||'').trim();});const k=p.name+'|'+p.phone;if(!p.name||!p.phone)errors.push((i+2)+'행: 이름·연락처 필수');else if(known.has(k))errors.push((i+2)+'행: 중복 참가자');else if(p.name.length>50||p.phone.length>30)errors.push((i+2)+'행: 입력 길이 초과');else{known.add(k);valid.push({...p,company:p.company||'',email:p.email||'guest@example.com',group:['일반','VIP','STAFF'].includes(p.group)?p.group:'일반'});}});A.ui.importPreview={valid,errors};A.render();}
 document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='f-stagePreset')command('stage.preset',{preset:t.value}).catch(err=>A.toast(err.message,'error'));if(t.id==='f-stageAspect')command('stage.aspect',{aspect:t.value}).catch(err=>A.toast(err.message,'error'));if(t.id==='f-stageQuality')command('stage.quality',{quality:t.value}).catch(err=>A.toast(err.message,'error'));if(t.id==='v4-csv-file')importFile(t.files[0]).catch(err=>A.toast(err.message,'error'));if(t.dataset.preflight!==undefined){A.ui.preflightChecks=A.ui.preflightChecks||{};A.ui.preflightChecks[t.dataset.preflight]=t.checked;}});
 function stopCamera(){if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;cancelAnimationFrame(cameraFrame);cameraFrame=0;const video=document.getElementById('v4-camera-video');if(video)video.srcObject=null;}
 async function startCamera(){stopCamera();const help=document.getElementById('v4-camera-help');if(!navigator.mediaDevices?.getUserMedia){help.textContent='이 환경에서는 카메라를 사용할 수 없습니다. 수동 입력을 이용하세요.';return;}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=document.getElementById('v4-camera-video');video.srcObject=cameraStream;await video.play();if(!('BarcodeDetector'in window)){help.textContent='카메라는 켜졌지만 QR 자동 인식이 지원되지 않습니다. 수동 코드를 입력하세요.';return;}const supported=await BarcodeDetector.getSupportedFormats();if(!supported.includes('qr_code')){help.textContent='QR 인식이 지원되지 않습니다. 수동 코드를 입력하세요.';return;}const detector=new BarcodeDetector({formats:['qr_code']});help.textContent='QR을 프레임 안에 맞춰주세요.';let scanning=true;const detect=async()=>{if(!cameraStream||!scanning)return;try{const codes=await detector.detect(video);if(codes[0]){scanning=false;const value=codes[0].rawValue;stopCamera();await scan(value,A.ui.checkAction||'IN');return;}}catch{}cameraFrame=requestAnimationFrame(detect);};detect();}catch(err){stopCamera();help.textContent=err.name==='NotAllowedError'?'카메라 권한이 거부되었습니다. 브라우저 권한을 확인하거나 수동 입력을 사용하세요.':'카메라를 시작할 수 없습니다. 수동 입력을 이용하세요.';}}
 document.addEventListener('keydown',ev=>{const input=['INPUT','TEXTAREA','SELECT'].includes(ev.target.tagName)||document.getElementById('modal').open;if(input)return;if(A.route==='live'&&ev.key.toLowerCase()==='f'){ev.preventDefault();act['v4-fullscreen']();return;}if(A.route!=='live-control')return;if((ev.ctrlKey||ev.metaKey)&&ev.key==='Enter'){ev.preventDefault();Promise.resolve(act['v4-take']()).catch(err=>A.toast(err.message,'error'));}else if(ev.key.toLowerCase()==='b'&&ev.altKey&&ev.shiftKey&&!ev.ctrlKey&&!ev.metaKey){ev.preventDefault();command('stage.emergency',{mode:'BLACK'}).catch(err=>A.toast(err.message,'error'));}});

 ETReport.setup();A.render();

 const uid=()=>crypto.randomUUID?.()||'ux-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 const modal=document.getElementById('modal');let busyScan=false,stream=null,frame=0,generation=0,latched='',noCodeAt=0,wake=null;
 const previousSubmit=ETV4.handleSubmit,oldRender=A.render;let lastRoute=A.route,lastEvent=A.state.activeEventId;
 const send=async(type,payload={},options={})=>T.send(type,payload,options);
 function safeClose(){A.closeDialog(true);}
 function resultError(err){return String(err?.message||'작업을 완료하지 못했습니다.');}

 // Avoid recreating a live video or scanner input while a command is in flight.
 V.renderInPlace=route=>{if((stream||busyScan)&&route===lastRoute&&['checkin','field-scanner','staff','mobile-booth-scan'].includes(route)&&document.getElementById('ux-feedback')){refreshFeedback();return true;}return false;};
 function focusScan(){const el=document.querySelector('#scan-code,#staff-ticket,#booth-code');if(el){el.value='';if(!stream)el.focus({preventScroll:true});}}
 async function scan(raw,options={}){
  if(busyScan)return{busy:true};busyScan=true;
  const unit=V.admissionContext(),action=unit?.action||A.ui.checkAction||'IN',eventId=A.state.activeEventId;
  const before=R.checkContext(A.state,eventId,raw,action,unit?.id);
  const id=options.id||uid(),payload={ticket:String(raw).trim(),action,unitId:unit?.id,unit:unit?.name};
  A.ui.lastScanRequest={id,eventId,payload};
  try{
   // Local UI catches errors before sending. Server remains authoritative for concurrent operations.
   if(!['OK','REENTRY'].includes(before.code)){A.ui.scanResult=before;A.ui.lastCheck={ok:false,code:before.code,message:before.title,person:before.person};return{ok:false};}
   const response=await send('check.scan',payload,{id,eventId});
   const person=W().participants.find(p=>p.id===before.person.id),log=W().logs.find(l=>l.id===id);
   const r=response.queued?R.outcome('QUEUED',{person}):R.outcome(before.code,{title:action==='OUT'?'퇴장 완료':before.title,person,lastLog:log,logId:id});
   A.ui.scanResult=r;A.ui.lastCheck={ok:!response.queued,code:r.code,person,participant:person,message:r.title,action};
   if(!response.queued&&A.ui.haptics!==false&&navigator.vibrate)navigator.vibrate(60);
   return response;
  }catch(err){
   const fresh=R.checkContext(A.state,eventId,raw,action,unit?.id);
   const uncertain=T.mode==='server'&&/응답|연결|처리 여부|fetch/i.test(resultError(err));
   A.ui.scanResult=uncertain?R.outcome('UNCONFIRMED',{person:before.person}):!['OK','REENTRY'].includes(fresh.code)?fresh:R.outcome('ERROR',{body:resultError(err),person:before.person});
   A.ui.lastCheck={ok:false,code:A.ui.scanResult.code,message:A.ui.scanResult.title};return{ok:false};
  }finally{
   busyScan=false;refreshFeedback();if(!stream)A.render();focusScan();
  }
 }
 V.scan=scan;ETV4.scan=scan;
 async function boothScan(raw){
  if(busyScan)return;busyScan=true;
  try{
   const self=A.route==='mobile-booth-scan',cred=R.parseCredential(raw),pid=self?A.attendee()?.id:W().participants.find(p=>p.ticket===cred.value)?.id;
   const boothId=self?cred.value:A.ui.staffBooth||W().booths[0]?.id;
   const payload={participantId:pid,boothId,credential:String(raw).trim(),source:self?'SELF':'STAFF'};
   R.validateBooth(A.state,A.state.activeEventId,payload);
   const response=await send('booth.visit',payload);
   if(response.queued)throw Error('부스 인증은 오프라인 승인하지 않습니다. 연결 후 다시 확인하세요.');
   const b=W().booths.find(b=>b.id===boothId),person=W().participants.find(p=>p.id===pid);
   A.ui.boothFeedback={ok:true,title:(b?.name||'부스')+' 스탬프 획득',body:(self?'나의 스탬프에 반영되었습니다.':(person?.name||'참가자')+'님의 부스 참여를 확인했습니다.')};
   if(A.ui.haptics!==false&&navigator.vibrate)navigator.vibrate(60);
  }catch(err){A.ui.boothFeedback={ok:false,title:'인증하지 않았습니다',body:resultError(err)};}
  finally{busyScan=false;refreshFeedback();if(!stream)A.render();focusScan();}
 }

  catch(err){A.ui.scanResult=R.outcome('UNCONFIRMED',{body:resultError(err)});}A.render();};
 act['detail-checkin']=el=>{safeClose();const p=W().participants.find(p=>p.ticket===el.dataset.ticket);if(p)act['v5-manual-admit']({dataset:{id:p.id}});};

 };
 act['v5-manual-confirm']=async el=>{const p=W().participants.find(p=>p.id===el.dataset.id),unit=W().units.find(u=>u.action==='IN');if(!unit)throw Error('입장 데스크가 없습니다. 데스크를 먼저 추가하세요.');safeClose();A.ui.unitId=unit.id;A.ui.checkAction='IN';await scan(p.ticket);A.navigate('checkin');};

 act['v5-correct']=el=>{const l=W().logs.find(l=>l.id===el.dataset.id);if(!l)return;A.showDialog('최근 처리 정정',`<p><strong>${e(l.name)}</strong>님의 ${l.action==='IN'?'입장':'퇴장'} 기록을 정정합니다. 원본은 삭제하지 않습니다.</p><div class="ux-callout"><div><strong>직전 상태로 복원</strong><p>이미 다음 입퇴장 처리가 있거나 다른 운영자가 상태를 변경했다면 거절됩니다.</p></div></div><input type="hidden" name="logId" value="${e(l.id)}">${field('정정 사유 · 5~200자','reason','','text','required minlength="5" maxlength="200" placeholder="예: 다른 참가자 티켓 오인식"')}`,B('그대로 두기','close-dialog')+'<button type="submit" class="btn danger">사유와 함께 정정</button>','v5-correct-form');};
