를 두 번 처리하면 두 번째 요청은 중복 안내가 표시됩니다. 참가자는 이름·전화 대신 가상 데이터만 입력하세요.<\/p>\n<h2>버전 기준<\/h2>\n<p>현재 기준은 <code>docs/00–13<\/code>과 <code>src/product/model.js<\/code>, <code>assets/v7/<\/code>입니다. <code>docs/archive-v5<\/code>, <code>archive-v4<\/code>, <code>legacy-v3<\/code>, <code>v6<\/code> 등은 과거 기록이며 현재 구현의 완료 근거가 아닙니다. 이전의 v5/v6 전체 통과 수치를 이번 버전 통과로 재사용하지 않습니다.<\/p>\n"}, {"id": "01-product-architecture", "title": "제품 계층·메뉴·화면 책임", "markdown": "# 제품 계층·메뉴·화면 책임\n\n## 고정한 구조\n\n|계층|누가 사용하는가|책임|포함하지 않는 것|\n|---|---|---|---|\n|대행사|대행사 관리자|고객사·여러 행사·팀·전체 활동|개별 데스크의 반복 스캔|\n|행사 Workspace|행사 담당자|선택한 행사 하나의 준비·운영·결과|타 행사 데이터|\n|현장 작업 모드|데스크·부스 담당자|입퇴장·인증 처리와 결과 복구|별도의 제품·중복 데이터베이스|\n|참가자 웹|초청·등록 참가자|일정·티켓·참여|운영 메뉴·검토 도구|\n|스크린 출력|관객|공개 콘텐츠 보기|참가자 연락처·운영 버튼|\n\n대행사 사이드바는 홈/행사/고객사/팀·권한만 표시합니다. 행사 진입 후 사이드바는 개요/참가자/현장 운영/참여 프로그램/커뮤니케이션/행사 페이지/스크린/결과/설정으로 교체합니다. 대행사와 행사 메뉴를 같은 긴 목록으로 동시에 나열하지 않습니다.\n\n## 메뉴 안의 탭\n\n- 개요: 운영 현황·준비 체크.\n- 참가자: 명단·등록 양식·그룹·가져오기. 내보내기는 명단의 작업입니다.\n- 현장 운영: 현장 현황·데스크·부스·입퇴장 기록·부스 기록.\n- 참여: 전체·투표·퀴즈·Q&A·추첨·만족도·사진 검토.\n- 커뮤니케이션: 캠페인·템플릿·발송 내역.\n- 행사 페이지: 디자인·프로그램·공지·행사장·게시판.\n- 스크린: 화면 출력·행사 미디어·포토월.\n- 결과: 분석·보고서.\n- 설정: 기본정보·기능 설정·행사 권한·활동 기록.\n\n현장 스캔과 출력은 mode, QR 확대는 overlay, 등록 wizard는 task, 잘못된 링크는 state, 제어실과 캔버스는 advanced로 구분합니다. URL 개수는 화면 완성률이나 기능 수가 아닙니다.\n\n## 제거·통합\n\n`mobile-ticket`은 `mobile-qr`, `registration`은 `registration-form`, `content`는 `notices`로 연결되는 호환 alias입니다. 모든 참가자 화면은 동일한 실행 중 mobileShell로 렌더링합니다. v6 CSS/JS overlay는 로드하지 않습니다. 기존 v3–v5 재사용 함수는 현재 v7 shell과 필요한 신규 view가 감쌉니다.\n\nField Mode는 별도 로그인 제품이 아니며, 현장 작업은 해당 행사의 데이터와 명령을 재사용합니다. 포괄적인 부스 PAUSED/RESUME 메뉴를 없애고 WAITING/OPEN/CLOSED와 시간·수량 조건으로 표현합니다.\n", "html": "<h1>제품 계층·메뉴·화면 책임<\/h1>\n<h2>고정한 구조<\/h2>\n<table>\n<thead>\n<tr>\n  <th>계층<\/th>\n  <th>누가 사용하는가<\/th>\n  <th>책임<\/th>\n  <th>포함하지 않는 것<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>대행사<\/td>\n  <td>대행사 관리자<\/td>\n  <td>고객사·여러 행사·팀·전체 활동<\/td>\n  <td>개별 데스크의 반복 스캔<\/td>\n<\/tr>\n<tr>\n  <td>행사 Workspace<\/td>\n  <td>행사 담당자<\/td>\n  <td>선택한 행사 하나의 준비·운영·결과<\/td>\n  <td>타 행사 데이터<\/td>\n<\/tr>\n<tr>\n  <td>현장 작업 모드<\/td>\n  <td>데스크·부스 담당자<\/td>\n  <td>입퇴장·인증 처리와 결과 복구<\/td>\n  <td>별도의 제품·중복 데이터베이스<\/td>\n<\/tr>\n<tr>\n  <td>참가자 웹<\/td>\n  <td>초청·등록 참가자<\/td>\n  <td>일정·티켓·참여<\/td>\n  <td>운영 메뉴·검토 도구<\/td>\n<\/tr>\n<tr>\n  <td>스크린 출력<\/td>\n  <td>관객<\/td>\n  <td>공개 콘텐츠 보기<\/td>\n  <td>참가자 연락처·운영 버튼<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>대행사 사이드바는 홈/행사/고객사/팀·권한만 표시합니다. 행사 진입 후 사이드바는 개요/참가자/현장 운영/참여 프로그램/커뮤니케이션/행사 페이지/스크린/결과/설정으로 교체합니다. 대행사와 행사 메뉴를 같은 긴 목록으로 동시에 나열하지 않습니다.<\/p>\n<h2>메뉴 안의 탭<\/h2>\n<ul>\n<li>개요: 운영 현황·준비 체크.<\/li>\n<li>참가자: 명단·등록 양식·그룹·가져오기. 내보내기는 명단의 작업입니다.<\/li>\n<li>현장 운영: 현장 현황·데스크·부스·입퇴장 기록·부스 기록.<\/li>\n<li>참여: 전체·투표·퀴즈·Q&amp;A·추첨·만족도·사진 검토.<\/li>\n<li>커뮤니케이션: 캠페인·템플릿·발송 내역.<\/li>\n<li>행사 페이지: 디자인·프로그램·공지·행사장·게시판.<\/li>\n<li>스크린: 화면 출력·행사 미디어·포토월.<\/li>\n<li>결과: 분석·보고서.<\/li>\n<li>설정: 기본정보·기능 설정·행사 권한·활동 기록.<\/li>\n<\/ul>\n<p>현장 스캔과 출력은 mode, QR 확대는 overlay, 등록 wizard는 task, 잘못된 링크는 state, 제어실과 캔버스는 advanced로 구분합니다. URL 개수는 화면 완성률이나 기능 수가 아닙니다.<\/p>\n<h2>제거·통합<\/h2>\n<p><code>mobile-ticket<\/code>은 <code>mobile-qr<\/code>, <code>registration<\/code>은 <code>registration-form<\/code>, <code>content<\/code>는 <code>notices<\/code>로 연결되는 호환 alias입니다. 모든 참가자 화면은 동일한 실행 중 mobileShell로 렌더링합니다. v6 CSS/JS overlay는 로드하지 않습니다. 기존 v3–v5 재사용 함수는 현재 v7 shell과 필요한 신규 view가 감쌉니다.<\/p>\n<p>Field Mode는 별도 로그인 제품이 아니며, 현장 작업은 해당 행사의 데이터와 명령을 재사용합니다. 포괄적인 부스 PAUSED/RESUME 메뉴를 없애고 WAITING/OPEN/CLOSED와 시간·수량 조건으로 표현합니다.<\/p>\n"}, {"id": "02-role-and-event-scope", "title": "역할·행사 범위와 접근 경계", "markdown": "# 역할·행사 범위와 접근 경계\n\n## 화면 권한 체험\n\n|역할|열람|변경|\n|---|---|---|\n|대행사 관리자|모든 데모 고객사·행사|모든 데모 업무|\n|행사 매니저|담당 행사 및 제한된 행사 선택|담당 행사 업무|\n|고객사 담당자|담당 행사 현황·명단·사진·결과|조회 전용|\n|현장 스탭|현황·명단·스캔·부스·Q&A·사진|현장/참여 업무만|\n|조회 전용|현황·준비 체크·일정·스크린·결과|없음|\n\n상단 ‘권한 체험’은 프로토타입 검수용입니다. 담당 행사는 첫 데모 행사로 제한한 예시이며 실제 조직/회원 인증을 구현하지 않습니다. 메뉴를 숨기고 직접 경로 접근과 UI 명령을 제한하지만 이를 상용 보안으로 해석하면 안 됩니다.\n\n## 로컬 서버에서 실제 수행하는 범위\n\n리허설 세션은 operator/participant/display로 구분됩니다. 참가자/출력 세션은 생성할 때 선택한 eventId를 유지합니다. 다른 운영자가 activeEventId를 바꾸어도 출력·참가자의 행사가 변경되지 않습니다. 참가자 명령이 다른 eventId를 보내면 거절합니다. 출력 세션은 읽기 전용입니다.\n\n참가자 응답에는 본인의 기록과 공개 콘텐츠만 포함하며 팀·템플릿·보고서 스냅샷을 제거합니다. 스크린 데이터는 집계와 공개 사진을 사용합니다. 이 조치는 데이터 경계를 검증하기 위한 리허설 구현이고, 세션 발급 자체는 본인 인증이 아닙니다.\n\n## 상용 전 필수\n\n실제 로그인·초대·권한 부여·조직 격리·토큰 만료·감사 저장·개인정보 접근통제·전송 보안은 별도 개발과 인수가 필요합니다. 보고서 공개 권한과 고객사 담당자의 편집 범위는 계약 전에 확정하세요.\n", "html": "<h1>역할·행사 범위와 접근 경계<\/h1>\n<h2>화면 권한 체험<\/h2>\n<table>\n<thead>\n<tr>\n  <th>역할<\/th>\n  <th>열람<\/th>\n  <th>변경<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>대행사 관리자<\/td>\n  <td>모든 데모 고객사·행사<\/td>\n  <td>모든 데모 업무<\/td>\n<\/tr>\n<tr>\n  <td>행사 매니저<\/td>\n  <td>담당 행사 및 제한된 행사 선택<\/td>\n  <td>담당 행사 업무<\/td>\n<\/tr>\n<tr>\n  <td>고객사 담당자<\/td>\n  <td>담당 행사 현황·명단·사진·결과<\/td>\n  <td>조회 전용<\/td>\n<\/tr>\n<tr>\n  <td>현장 스탭<\/td>\n  <td>현황·명단·스캔·부스·Q&amp;A·사진<\/td>\n  <td>현장/참여 업무만<\/td>\n<\/tr>\n<tr>\n  <td>조회 전용<\/td>\n  <td>현황·준비 체크·일정·스크린·결과<\/td>\n  <td>없음<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>상단 ‘권한 체험’은 프로토타입 검수용입니다. 담당 행사는 첫 데모 행사로 제한한 예시이며 실제 조직/회원 인증을 구현하지 않습니다. 메뉴를 숨기고 직접 경로 접근과 UI 명령을 제한하지만 이를 상용 보안으로 해석하면 안 됩니다.<\/p>\n<h2>로컬 서버에서 실제 수행하는 범위<\/h2>\n<p>리허설 세션은 operator/participant/display로 구분됩니다. 참가자/출력 세션은 생성할 때 선택한 eventId를 유지합니다. 다른 운영자가 activeEventId를 바꾸어도 출력·참가자의 행사가 변경되지 않습니다. 참가자 명령이 다른 eventId를 보내면 거절합니다. 출력 세션은 읽기 전용입니다.<\/p>\n<p>참가자 응답에는 본인의 기록과 공개 콘텐츠만 포함하며 팀·템플릿·보고서 스냅샷을 제거합니다. 스크린 데이터는 집계와 공개 사진을 사용합니다. 이 조치는 데이터 경계를 검증하기 위한 리허설 구현이고, 세션 발급 자체는 본인 인증이 아닙니다.<\/p>\n<h2>상용 전 필수<\/h2>\n<p>실제 로그인·초대·권한 부여·조직 격리·토큰 만료·감사 저장·개인정보 접근통제·전송 보안은 별도 개발과 인수가 필요합니다. 보고서 공개 권한과 고객사 담당자의 편집 범위는 계약 전에 확정하세요.<\/p>\n"}, {"id": "03-design-system", "title": "EVENTOUCH Design System 7 — Warm Operations", "markdown": "# EVENTOUCH Design System 7 — Warm Operations\n\n색상을 더 늘리기보다 화면 책임·정보 순서·간격·피드백을 통일합니다. 다른 서비스의 원본 자산이나 글꼴 파일은 포함하지 않았습니다.\n\n## Foundation\n\n|역할|값|사용|\n|---|---|---|\n|브랜드 Orange|#F35B2C|브랜드 표식·강조선|\n|Action Orange|#BC3F1B|흰 글자가 있는 주요 행동|\n|Ink|#17191D|본문·운영 사이드바|\n|Canvas|#FAF8F5|업무 배경|\n|Surface|#FFFFFF|카드·모달·표|\n|Border|#E1DDD5|구획선|\n|Success|#176544|완료 상태|\n\n색만으로 정상/오류/대기를 구분하지 않습니다. 아이콘·문구·다음 행동을 병행합니다. 브랜드 색을 자동 치환해도 모든 대비가 보장된다는 주장은 하지 않습니다.\n\n## 간격과 크기\n\n공통 spacing은 4/8/12/16/20/24/32/40/48/64px입니다. 페이지 좌우는 데스크톱32px, 모바일20px, 350px 이하16px입니다. 화면 섹션은24–32px, 연속 필드16px, 라벨–입력8px, 연속 버튼8px을 기준으로 합니다.\n\n|구성|기준|\n|---|---|\n|데스크톱 sidebar|232px|\n|데스크톱 header|64px|\n|참가자 header|56px|\n|모바일 bottom nav|68px + safe-area|\n|중앙 QR 시각 버튼|54px·위로10px·별도 전체 탭 터치영역|\n|데스크톱 컨트롤|40px 이상|\n|모바일 주요 컨트롤|48px 이상|\n|현장 코드 입력|52px|\n|모바일 입력 글자|16px|\n\n모바일의 페이지 제목과 CTA, 카드 본문은 한 열로 흐르며 좁은 폭에서 줄바꿈합니다. 테이블은 명단에서 카드로 전환하고, 관리용 복합 테이블은 좁은 화면 내 별도 가로 스크롤을 허용합니다. 모든 수평 데이터를 억지로 세로 카드로 바꾸지는 않습니다.\n\n## 제품별 밀도\n\nCompact: 사이드바→내부 탭→페이지 제목→작업. Field: 현재 행사·데스크→큰 입력→즉시 결과→다음 처리. Comfortable: 행사→지금 행동→일정·참여. Stage: 메뉴 없는 출력, 6% 안전 영역과 큰 글자.\n\n## 컴포넌트 상태\n\n버튼 default/focus/disabled/loading, 입력 empty/filled/invalid/readonly, 명단 empty/filtered/selected, 티켓 valid/cancelled/no-registration, 스캐너 idle/success/duplicate/rejected/unconfirmed, 사진 pending/approved/hidden, 보고서 empty/snapshot.\n\n모달은 제출 실패 시 입력을 유지합니다. 참가자 상세는 drawer를 먼저 사용하고 전체 상세 링크를 보조로 제공합니다. 입력 중 이동은 확인을 받습니다. ‘내 밝기를 자동 최대화했다’ 같은 불가능하거나 미수행한 조작 문구는 사용하지 않습니다.\n\n## 소스\n\n최신 적용은 `assets/v7/product.css`, 토큰은 `design-system/tokens.json`/`tokens.ts`입니다. 기존 베이스 CSS는 호환용이며 v7 공통 shell과 컴포넌트 규칙이 우선합니다. 실제 기기의 키보드·동적 주소창·음성 안내·모든 대비 조합은 별도 접근성 검수 대상입니다.\n", "html": "<h1>EVENTOUCH Design System 7 — Warm Operations<\/h1>\n<p>색상을 더 늘리기보다 화면 책임·정보 순서·간격·피드백을 통일합니다. 다른 서비스의 원본 자산이나 글꼴 파일은 포함하지 않았습니다.<\/p>\n<h2>Foundation<\/h2>\n<table>\n<thead>\n<tr>\n  <th>역할<\/th>\n  <th>값<\/th>\n  <th>사용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>브랜드 Orange<\/td>\n  <td>#F35B2C<\/td>\n  <td>브랜드 표식·강조선<\/td>\n<\/tr>\n<tr>\n  <td>Action Orange<\/td>\n  <td>#BC3F1B<\/td>\n  <td>흰 글자가 있는 주요 행동<\/td>\n<\/tr>\n<tr>\n  <td>Ink<\/td>\n  <td>#17191D<\/td>\n  <td>본문·운영 사이드바<\/td>\n<\/tr>\n<tr>\n  <td>Canvas<\/td>\n  <td>#FAF8F5<\/td>\n  <td>업무 배경<\/td>\n<\/tr>\n<tr>\n  <td>Surface<\/td>\n  <td>#FFFFFF<\/td>\n  <td>카드·모달·표<\/td>\n<\/tr>\n<tr>\n  <td>Border<\/td>\n  <td>#E1DDD5<\/td>\n  <td>구획선<\/td>\n<\/tr>\n<tr>\n  <td>Success<\/td>\n  <td>#176544<\/td>\n  <td>완료 상태<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>색만으로 정상/오류/대기를 구분하지 않습니다. 아이콘·문구·다음 행동을 병행합니다. 브랜드 색을 자동 치환해도 모든 대비가 보장된다는 주장은 하지 않습니다.<\/p>\n<h2>간격과 크기<\/h2>\n<p>공통 spacing은 4/8/12/16/20/24/32/40/48/64px입니다. 페이지 좌우는 데스크톱32px, 모바일20px, 350px 이하16px입니다. 화면 섹션은24–32px, 연속 필드16px, 라벨–입력8px, 연속 버튼8px을 기준으로 합니다.<\/p>\n<table>\n<thead>\n<tr>\n  <th>구성<\/th>\n  <th>기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>데스크톱 sidebar<\/td>\n  <td>232px<\/td>\n<\/tr>\n<tr>\n  <td>데스크톱 header<\/td>\n  <td>64px<\/td>\n<\/tr>\n<tr>\n  <td>참가자 header<\/td>\n  <td>56px<\/td>\n<\/tr>\n<tr>\n  <td>모바일 bottom nav<\/td>\n  <td>68px + safe-area<\/td>\n<\/tr>\n<tr>\n  <td>중앙 QR 시각 버튼<\/td>\n  <td>54px·위로10px·별도 전체 탭 터치영역<\/td>\n<\/tr>\n<tr>\n  <td>데스크톱 컨트롤<\/td>\n  <td>40px 이상<\/td>\n<\/tr>\n<tr>\n  <td>모바일 주요 컨트롤<\/td>\n  <td>48px 이상<\/td>\n<\/tr>\n<tr>\n  <td>현장 코드 입력<\/td>\n  <td>52px<\/td>\n<\/tr>\n<tr>\n  <td>모바일 입력 글자<\/td>\n  <td>16px<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>모바일의 페이지 제목과 CTA, 카드 본문은 한 열로 흐르며 좁은 폭에서 줄바꿈합니다. 테이블은 명단에서 카드로 전환하고, 관리용 복합 테이블은 좁은 화면 내 별도 가로 스크롤을 허용합니다. 모든 수평 데이터를 억지로 세로 카드로 바꾸지는 않습니다.<\/p>\n<h2>제품별 밀도<\/h2>\n<p>Compact: 사이드바→내부 탭→페이지 제목→작업. Field: 현재 행사·데스크→큰 입력→즉시 결과→다음 처리. Comfortable: 행사→지금 행동→일정·참여. Stage: 메뉴 없는 출력, 6% 안전 영역과 큰 글자.<\/p>\n<h2>컴포넌트 상태<\/h2>\n<p>버튼 default/focus/disabled/loading, 입력 empty/filled/invalid/readonly, 명단 empty/filtered/selected, 티켓 valid/cancelled/no-registration, 스캐너 idle/success/duplicate/rejected/unconfirmed, 사진 pending/approved/hidden, 보고서 empty/snapshot.<\/p>\n<p>모달은 제출 실패 시 입력을 유지합니다. 참가자 상세는 drawer를 먼저 사용하고 전체 상세 링크를 보조로 제공합니다. 입력 중 이동은 확인을 받습니다. ‘내 밝기를 자동 최대화했다’ 같은 불가능하거나 미수행한 조작 문구는 사용하지 않습니다.<\/p>\n<h2>소스<\/h2>\n<p>최신 적용은 <code>assets/v7/product.css<\/code>, 토큰은 <code>design-system/tokens.json<\/code>/<code>tokens.ts<\/code>입니다. 기존 베이스 CSS는 호환용이며 v7 공통 shell과 컴포넌트 규칙이 우선합니다. 실제 기기의 키보드·동적 주소창·음성 안내·모든 대비 조합은 별도 접근성 검수 대상입니다.<\/p>\n"}, {"id": "04-mobile-and-qr", "title": "모바일 탐색·QR 사용 흐름", "markdown": "# 모바일 탐색·QR 사용 흐름\n\n## 참가자\n\n`홈 / 일정 / QR / 참여 / 더보기`를 모든 일반 참가자 화면에서 동일하게 유지합니다. 상단 hamburger는 제거했습니다. 상세는 뒤로가기, 공지 버튼을 사용합니다. QR 확대·참가 신청·일부 오류 상태 등 집중 작업에서만 하단 메뉴가 없습니다.\n\n중앙 QR은 카메라를 바로 강제로 실행하는 버튼이 아닙니다. 내 티켓을 보여주고 행사 인증 방식에 따라 스캔 행동을 제공합니다.\n\n- 미등록: 등록으로 안내하며 다른 참가자의 QR을 대체 표시하지 않습니다.\n- 등록 취소: 유효한 티켓 QR을 표시하지 않습니다.\n- 입장 전: 내 티켓이 우선입니다.\n- 입장 후 SELF: 부스 QR 스캔을 강조하되 내 티켓을 계속 이용합니다.\n- STAFF: 부스 담당자에게 내 티켓을 보여주도록 안내합니다.\n- 스탬프 사용 안 함: 부스 스캔 진입을 숨기고 직접 경로에도 안내합니다.\n\n참여 메뉴는 사용 가능한 기능과 제출 완료 상태를 구분합니다. 신청 정보는 읽기 전용이며, 참가 신청은 별도 진입 작업입니다. 일정 상세에서 해당 장소 안내로 이동합니다. 홈의 NOW/NEXT는 ‘시연 시각’ 또는 ‘실제 시각’ 기준을 표시합니다.\n\n## 운영자\n\n`현황 / 참가자 / 스캔 / 현장 / 더보기`의 업무 중심 도크입니다. 같은 행사 Workspace의 반응형 모드이며 대행사 목록이나 조회전용 고객사 화면에 불필요한 스캔 도크를 강제로 붙이지 않습니다. 담당 부스 공유 링크는 지정 부스 선택을 고정합니다.\n\n## 인쇄 QR과 인증\n\n실제 SVG를 브라우저에서 생성하고 PNG로 내보낼 수 있습니다. 부스 QR payload는 `ET:BOOTH:<eventId>:<boothId>`입니다. 개인 티켓은 데모 문자열입니다. 공개 정보형 식별자이며 암호화된 인증 토큰이 아닙니다.\n\n부스 이름을 수정해도 ID는 그대로이고 새 부스를 만들면 새 QR이 생깁니다. A4/A5/QR-only 안내판은 행사명·부스명·사용 안내·인식 내용이 일치합니다. 출력 완료 체크는 프린터 응답이 아니라 운영자 수동 확인 기록입니다. PDF는 브라우저 인쇄의 PDF 저장 기능을 사용합니다.\n\n부스 SELF: 안내판 인쇄→현장 게시→참가자 QR 스캔→상태/시간/수량/개인횟수 확인→기록. STAFF: 작업 링크→참가자 티켓 스캔→담당 부스 기록. 둘을 한 행사에서 혼합하는 정책은 도입하지 않았습니다. QR 사진 공유 방지·단기 서명·실제 토큰 배포는 운영형 인증 설계 범위입니다.\n", "html": "<h1>모바일 탐색·QR 사용 흐름<\/h1>\n<h2>참가자<\/h2>\n<p><code>홈 / 일정 / QR / 참여 / 더보기<\/code>를 모든 일반 참가자 화면에서 동일하게 유지합니다. 상단 hamburger는 제거했습니다. 상세는 뒤로가기, 공지 버튼을 사용합니다. QR 확대·참가 신청·일부 오류 상태 등 집중 작업에서만 하단 메뉴가 없습니다.<\/p>\n<p>중앙 QR은 카메라를 바로 강제로 실행하는 버튼이 아닙니다. 내 티켓을 보여주고 행사 인증 방식에 따라 스캔 행동을 제공합니다.<\/p>\n<ul>\n<li>미등록: 등록으로 안내하며 다른 참가자의 QR을 대체 표시하지 않습니다.<\/li>\n<li>등록 취소: 유효한 티켓 QR을 표시하지 않습니다.<\/li>\n<li>입장 전: 내 티켓이 우선입니다.<\/li>\n<li>입장 후 SELF: 부스 QR 스캔을 강조하되 내 티켓을 계속 이용합니다.<\/li>\n<li>STAFF: 부스 담당자에게 내 티켓을 보여주도록 안내합니다.<\/li>\n<li>스탬프 사용 안 함: 부스 스캔 진입을 숨기고 직접 경로에도 안내합니다.<\/li>\n<\/ul>\n<p>참여 메뉴는 사용 가능한 기능과 제출 완료 상태를 구분합니다. 신청 정보는 읽기 전용이며, 참가 신청은 별도 진입 작업입니다. 일정 상세에서 해당 장소 안내로 이동합니다. 홈의 NOW/NEXT는 ‘시연 시각’ 또는 ‘실제 시각’ 기준을 표시합니다.<\/p>\n<h2>운영자<\/h2>\n<p><code>현황 / 참가자 / 스캔 / 현장 / 더보기<\/code>의 업무 중심 도크입니다. 같은 행사 Workspace의 반응형 모드이며 대행사 목록이나 조회전용 고객사 화면에 불필요한 스캔 도크를 강제로 붙이지 않습니다. 담당 부스 공유 링크는 지정 부스 선택을 고정합니다.<\/p>\n<h2>인쇄 QR과 인증<\/h2>\n<p>실제 SVG를 브라우저에서 생성하고 PNG로 내보낼 수 있습니다. 부스 QR payload는 <code>ET:BOOTH:&lt;eventId&gt;:&lt;boothId&gt;<\/code>입니다. 개인 티켓은 데모 문자열입니다. 공개 정보형 식별자이며 암호화된 인증 토큰이 아닙니다.<\/p>\n<p>부스 이름을 수정해도 ID는 그대로이고 새 부스를 만들면 새 QR이 생깁니다. A4/A5/QR-only 안내판은 행사명·부스명·사용 안내·인식 내용이 일치합니다. 출력 완료 체크는 프린터 응답이 아니라 운영자 수동 확인 기록입니다. PDF는 브라우저 인쇄의 PDF 저장 기능을 사용합니다.<\/p>\n<p>부스 SELF: 안내판 인쇄→현장 게시→참가자 QR 스캔→상태/시간/수량/개인횟수 확인→기록. STAFF: 작업 링크→참가자 티켓 스캔→담당 부스 기록. 둘을 한 행사에서 혼합하는 정책은 도입하지 않았습니다. QR 사진 공유 방지·단기 서명·실제 토큰 배포는 운영형 인증 설계 범위입니다.<\/p>\n"}, {"id": "05-workflows", "title": "화면별 업무 완료 흐름", "markdown": "# 화면별 업무 완료 흐름\n\n|업무|진입|완료 결과|다음 이동|\n|---|---|---|---|\n|행사 생성|대행사/행사/새 행사|PRE 상태의 빈 행사|준비 체크|\n|명단 검토|참가자/검색·필터|대상 확인·선택|상세 drawer·그룹·캠페인|\n|양식 구성|등록 양식|필수/선택 질문 저장·버전 변경|모바일 신청|\n|그룹 관리|그룹|그룹 추가/변경·대상 재분류|명단 필터|\n|데스크 설정|현장/데스크|작업 방향·화면 모드 저장|해당 unit 실행|\n|부스 등록|현장/부스|이름·시간·수량·횟수·상태 저장|상세·QR·스탭 링크|\n|사진 공개|참여/사진 검토|공개 여부 저장|포토월 미리보기|\n|스크린 출력|스크린/화면 출력|행사별 콘텐츠 선택|관객용 출력 창|\n|공지·일정|행사 페이지|실제 텍스트와 시간 저장|참가자 홈·일정|\n|캠페인|커뮤니케이션|대상 ID 고정·초안/예약 준비|검토 내용·발송내역|\n|보고서|결과/보고서|생성시점 수치·사진 스냅샷|미리보기·JSON·인쇄|\n\n## 행사 생성\n\n기존 제안의 여섯 단계 wizard를 **기본정보→참여기능→검토의 세 단계**로 축소했습니다. 세부 참가 양식·현장·미디어를 마법사에서 중복 작성하지 않고 새 Workspace에서 설정합니다. 빈 행사 생성 시 이전 참가자·사진·인증 기록은 복제하지 않습니다.\n\n## 현장 예외\n\n스캔에는 중복, 취소, 다른 행사, 다른 QR 종류, 미등록, 서버 응답 미확정, 오프라인 대기가 있습니다. ‘대기’는 ‘입장 성공’이 아닙니다. 원본 이력을 삭제하지 않는 정정 흐름과 재입장 정책은 기존 코어를 유지했습니다. 실물 리더·카메라·프린터 인수는 별도입니다.\n\n## 부스 상태\n\n대기/진행/종료와 운영 시간·수량을 사용합니다. 표시와 인증 검증은 동일한 행사 시간 기준을 사용합니다. 시연 시각을 설정한 경우 명확히 표시하고, 실운영 전 실제 시각 정책으로 전환해야 합니다.\n\n## 캠페인\n\n대상→내용/템플릿→채널·예약 조건→검토로 진행합니다. 수신 대상은 검토 단계에서 ID 배열로 저장하고 최종 제출 시 유효성을 검사합니다. 공급사 비용은 0원이 아니라 미산정입니다. 대체 문자 요청은 제안 조건이며 실제 전송 로직이 아닙니다.\n\n## 개인정보·권한\n\n가상 데이터만 사용합니다. 조회전용과 현장 역할의 메뉴/쓰기 제한은 프로토타입으로 구현했습니다. 고객사 간 실제 조직 격리 및 인증은 별도입니다.\n", "html": "<h1>화면별 업무 완료 흐름<\/h1>\n<table>\n<thead>\n<tr>\n  <th>업무<\/th>\n  <th>진입<\/th>\n  <th>완료 결과<\/th>\n  <th>다음 이동<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>행사 생성<\/td>\n  <td>대행사/행사/새 행사<\/td>\n  <td>PRE 상태의 빈 행사<\/td>\n  <td>준비 체크<\/td>\n<\/tr>\n<tr>\n  <td>명단 검토<\/td>\n  <td>참가자/검색·필터<\/td>\n  <td>대상 확인·선택<\/td>\n  <td>상세 drawer·그룹·캠페인<\/td>\n<\/tr>\n<tr>\n  <td>양식 구성<\/td>\n  <td>등록 양식<\/td>\n  <td>필수/선택 질문 저장·버전 변경<\/td>\n  <td>모바일 신청<\/td>\n<\/tr>\n<tr>\n  <td>그룹 관리<\/td>\n  <td>그룹<\/td>\n  <td>그룹 추가/변경·대상 재분류<\/td>\n  <td>명단 필터<\/td>\n<\/tr>\n<tr>\n  <td>데스크 설정<\/td>\n  <td>현장/데스크<\/td>\n  <td>작업 방향·화면 모드 저장<\/td>\n  <td>해당 unit 실행<\/td>\n<\/tr>\n<tr>\n  <td>부스 등록<\/td>\n  <td>현장/부스<\/td>\n  <td>이름·시간·수량·횟수·상태 저장<\/td>\n  <td>상세·QR·스탭 링크<\/td>\n<\/tr>\n<tr>\n  <td>사진 공개<\/td>\n  <td>참여/사진 검토<\/td>\n  <td>공개 여부 저장<\/td>\n  <td>포토월 미리보기<\/td>\n<\/tr>\n<tr>\n  <td>스크린 출력<\/td>\n  <td>스크린/화면 출력<\/td>\n  <td>행사별 콘텐츠 선택<\/td>\n  <td>관객용 출력 창<\/td>\n<\/tr>\n<tr>\n  <td>공지·일정<\/td>\n  <td>행사 페이지<\/td>\n  <td>실제 텍스트와 시간 저장<\/td>\n  <td>참가자 홈·일정<\/td>\n<\/tr>\n<tr>\n  <td>캠페인<\/td>\n  <td>커뮤니케이션<\/td>\n  <td>대상 ID 고정·초안/예약 준비<\/td>\n  <td>검토 내용·발송내역<\/td>\n<\/tr>\n<tr>\n  <td>보고서<\/td>\n  <td>결과/보고서<\/td>\n  <td>생성시점 수치·사진 스냅샷<\/td>\n  <td>미리보기·JSON·인쇄<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>행사 생성<\/h2>\n<p>기존 제안의 여섯 단계 wizard를 <strong>기본정보→참여기능→검토의 세 단계<\/strong>로 축소했습니다. 세부 참가 양식·현장·미디어를 마법사에서 중복 작성하지 않고 새 Workspace에서 설정합니다. 빈 행사 생성 시 이전 참가자·사진·인증 기록은 복제하지 않습니다.<\/p>\n<h2>현장 예외<\/h2>\n<p>스캔에는 중복, 취소, 다른 행사, 다른 QR 종류, 미등록, 서버 응답 미확정, 오프라인 대기가 있습니다. ‘대기’는 ‘입장 성공’이 아닙니다. 원본 이력을 삭제하지 않는 정정 흐름과 재입장 정책은 기존 코어를 유지했습니다. 실물 리더·카메라·프린터 인수는 별도입니다.<\/p>\n<h2>부스 상태<\/h2>\n<p>대기/진행/종료와 운영 시간·수량을 사용합니다. 표시와 인증 검증은 동일한 행사 시간 기준을 사용합니다. 시연 시각을 설정한 경우 명확히 표시하고, 실운영 전 실제 시각 정책으로 전환해야 합니다.<\/p>\n<h2>캠페인<\/h2>\n<p>대상→내용/템플릿→채널·예약 조건→검토로 진행합니다. 수신 대상은 검토 단계에서 ID 배열로 저장하고 최종 제출 시 유효성을 검사합니다. 공급사 비용은 0원이 아니라 미산정입니다. 대체 문자 요청은 제안 조건이며 실제 전송 로직이 아닙니다.<\/p>\n<h2>개인정보·권한<\/h2>\n<p>가상 데이터만 사용합니다. 조회전용과 현장 역할의 메뉴/쓰기 제한은 프로토타입으로 구현했습니다. 고객사 간 실제 조직 격리 및 인증은 별도입니다.<\/p>\n"}, {"id": "06-presentation-and-media", "title": "행사 미디어·사진 검토·스크린", "markdown": "# 행사 미디어·사진 검토·스크린\n\n## 역할 분리\n\n사진 검토는 참가자가 올린 사진의 공개 여부를 결정합니다. 포토월은 승인 사진을 어떤 레이아웃과 간격으로 보여줄지 설정합니다. 스크린은 행사 미디어·투표·퀴즈·추첨·포토월 중 관객이 볼 내용을 선택합니다.\n\n일반 운영자는 고급 제어실을 거치지 않아도 기본 출력 창을 열 수 있습니다. 현재 화면은 ‘출력 설정 미리보기’라고 표시하며 실제 LED가 해당 내용을 보여주고 있다는 보증으로 표현하지 않습니다.\n\n## 이미지·영상\n\n브라우저가 PNG/JPEG/WebP를 읽고 실제 미리보기와 출력에 사용합니다. 행사장 안내도와 시간표 이미지도 업로드해 연결할 수 있습니다. 짧은 MP4/WebM 재생은 별도 확장 제안으로 포함했습니다. 파일을 data URL로 리허설 상태에 보관하므로 이미지 약1MB, 영상 약2MB, 행사별 합계 약3MB로 제한합니다. 대용량 저장·전송·변환 서버는 아닙니다.\n\n영상은 기본 음소거이며 사용자가 컨트롤에서 소리를 켭니다. 자동 전체화면이나 자동 소리 재생을 보장하지 않습니다. 행사 스크린이 아닌 곳에서 생성한 임의 URL을 자동 실행하지 않습니다.\n\n## 기본 출력\n\n대기 화면, 등록 미디어, 투표 결과, 퀴즈, 공개된 추첨 결과, 포토월입니다. 출력 세션은 eventId에 연결되고 타 행사로 자동 이동하지 않습니다. 참가자 연락처나 사용자 팀 목록을 출력 데이터에 넣지 않습니다.\n\n## 고급 기능\n\n기존의 Preview→TAKE→Program, BLACK/HOLD, 선택적 WebGL/Canvas 효과, 28개 장면, 디바이스 상태 프로토타입은 보존했습니다. 기본 메뉴의 하위 선택 기능으로 내렸습니다. 실제 GPU·LED 픽셀 매핑·4K60fps·다중 장치별 독립 송출 큐는 이번에 인수하지 않았습니다.\n\n## 사진 자산의 용도\n\n현재 자동 보고서 사진은 승인된 참가자 업로드 사진을 사용합니다. 원 기획의 증빙용 현장 사진 섹션 분류·원본 ZIP·저작권 확인 워크플로는 별도 설계 범위이며 참가자 포토와 같은 것으로 간주하지 않습니다.\n", "html": "<h1>행사 미디어·사진 검토·스크린<\/h1>\n<h2>역할 분리<\/h2>\n<p>사진 검토는 참가자가 올린 사진의 공개 여부를 결정합니다. 포토월은 승인 사진을 어떤 레이아웃과 간격으로 보여줄지 설정합니다. 스크린은 행사 미디어·투표·퀴즈·추첨·포토월 중 관객이 볼 내용을 선택합니다.<\/p>\n<p>일반 운영자는 고급 제어실을 거치지 않아도 기본 출력 창을 열 수 있습니다. 현재 화면은 ‘출력 설정 미리보기’라고 표시하며 실제 LED가 해당 내용을 보여주고 있다는 보증으로 표현하지 않습니다.<\/p>\n<h2>이미지·영상<\/h2>\n<p>브라우저가 PNG/JPEG/WebP를 읽고 실제 미리보기와 출력에 사용합니다. 행사장 안내도와 시간표 이미지도 업로드해 연결할 수 있습니다. 짧은 MP4/WebM 재생은 별도 확장 제안으로 포함했습니다. 파일을 data URL로 리허설 상태에 보관하므로 이미지 약1MB, 영상 약2MB, 행사별 합계 약3MB로 제한합니다. 대용량 저장·전송·변환 서버는 아닙니다.<\/p>\n<p>영상은 기본 음소거이며 사용자가 컨트롤에서 소리를 켭니다. 자동 전체화면이나 자동 소리 재생을 보장하지 않습니다. 행사 스크린이 아닌 곳에서 생성한 임의 URL을 자동 실행하지 않습니다.<\/p>\n<h2>기본 출력<\/h2>\n<p>대기 화면, 등록 미디어, 투표 결과, 퀴즈, 공개된 추첨 결과, 포토월입니다. 출력 세션은 eventId에 연결되고 타 행사로 자동 이동하지 않습니다. 참가자 연락처나 사용자 팀 목록을 출력 데이터에 넣지 않습니다.<\/p>\n<h2>고급 기능<\/h2>\n<p>기존의 Preview→TAKE→Program, BLACK/HOLD, 선택적 WebGL/Canvas 효과, 28개 장면, 디바이스 상태 프로토타입은 보존했습니다. 기본 메뉴의 하위 선택 기능으로 내렸습니다. 실제 GPU·LED 픽셀 매핑·4K60fps·다중 장치별 독립 송출 큐는 이번에 인수하지 않았습니다.<\/p>\n<h2>사진 자산의 용도<\/h2>\n<p>현재 자동 보고서 사진은 승인된 참가자 업로드 사진을 사용합니다. 원 기획의 증빙용 현장 사진 섹션 분류·원본 ZIP·저작권 확인 워크플로는 별도 설계 범위이며 참가자 포토와 같은 것으로 간주하지 않습니다.<\/p>\n"}, {"id": "07-results-and-report", "title": "분석·결과보고서", "markdown": "# 분석·결과보고서\n\n분석은 현재 데이터를 읽는 화면이고 보고서는 생성시점 스냅샷을 만드는 화면입니다.\n\n등록 참가자는 취소 제외, 누적 입장은 한번 이상 입장, 현재 입장은 퇴장 제외, 미입장은 입장 이력 없는 참가자로 구분합니다. 입장률은 누적 입장/등록입니다. 전체 대행사의 등록 합산은 여러 행사에 걸친 고유 인원으로 표시하지 않습니다.\n\n보고서 생성→제목·총평→스냅샷→미리보기→JSON/인쇄로 연결합니다. 스냅샷 생성 후 다른 참가자를 추가해도 이미 생성한 보고서 수치는 바뀌지 않습니다. 수정된 결과가 필요하면 새 스냅샷을 만듭니다.\n\n상세 페이지에서는 실제 업로드된 공개 사진만 출력합니다. 합성 아트 예시는 사진 증빙으로 취급하지 않습니다.\n\n고급 텍스트 캔버스는 기존 기능을 보존했습니다. 완전한 자유 이미지 편집·PPTX·서버 PDF·섹션별 증빙 원본 관리는 미완료 범위입니다. 브라우저 PDF 저장은 운영체제의 인쇄 설정에 영향을 받습니다.\n", "html": "<h1>분석·결과보고서<\/h1>\n<p>분석은 현재 데이터를 읽는 화면이고 보고서는 생성시점 스냅샷을 만드는 화면입니다.<\/p>\n<p>등록 참가자는 취소 제외, 누적 입장은 한번 이상 입장, 현재 입장은 퇴장 제외, 미입장은 입장 이력 없는 참가자로 구분합니다. 입장률은 누적 입장/등록입니다. 전체 대행사의 등록 합산은 여러 행사에 걸친 고유 인원으로 표시하지 않습니다.<\/p>\n<p>보고서 생성→제목·총평→스냅샷→미리보기→JSON/인쇄로 연결합니다. 스냅샷 생성 후 다른 참가자를 추가해도 이미 생성한 보고서 수치는 바뀌지 않습니다. 수정된 결과가 필요하면 새 스냅샷을 만듭니다.<\/p>\n<p>상세 페이지에서는 실제 업로드된 공개 사진만 출력합니다. 합성 아트 예시는 사진 증빙으로 취급하지 않습니다.<\/p>\n<p>고급 텍스트 캔버스는 기존 기능을 보존했습니다. 완전한 자유 이미지 편집·PPTX·서버 PDF·섹션별 증빙 원본 관리는 미완료 범위입니다. 브라우저 PDF 저장은 운영체제의 인쇄 설정에 영향을 받습니다.<\/p>\n"}, {"id": "08-server-and-data", "title": "로컬 리허설 서버와 데이터 계약", "markdown": "# 로컬 리허설 서버와 데이터 계약\n\n## 구성\n\nPython aiohttp가 HTTP/WebSocket과 파일 저장을 맡고 하나의 Node reducer가 브라우저와 동일한 규칙을 실행합니다. `src/experience/model.js`는 기존 도메인·무대 규칙, `src/product/model.js`는 v7 제품 명령·메뉴·역할 규칙입니다. 서버가 init/command/replace를 직렬 처리하고 명령 ID를 중복 방지합니다.\n\n## API\n\n|경로|용도|\n|---|---|\n|GET /api/health|리허설 서버 확인|\n|POST /api/session|리허설 역할 및 eventId 세션 발급 — 실제 로그인 아님|\n|GET /api/state|역할·행사에 맞춘 상태|\n|POST /api/command|기존/제품 도메인 명령|\n|POST /api/snapshot|운영자 상태 교체, revision 충돌 검사|\n|POST /api/reset|가상 데이터 초기화|\n|GET /ws?token=...|역할별 WebSocket 상태|\n|GET /api/qr?text=...|데모 SVG QR|\n\n```json\n{\"id\":\"unique-command-id\",\"eventId\":\"evt-connect\",\"type\":\"product.desk.save\",\"payload\":{\"name\":\"등록데스크 01\",\"mode\":\"desk\",\"action\":\"IN\"}}\n```\n\n제품 명령은 desk.save, booth.save/printed, group.save/assign, field.save/move/delete, photo.moderate, media.add/usage/delete, presentation.set, wall.settings, template.save/delete, report.create, event.update/features, member.save, program.save/delete, notice.save, venue.save입니다.\n\nparticipant/display는 발급한 eventId에 고정됩니다. 출력은 읽기 전용, 참가자는 허용된 응답/등록/SELF 인증만 제출합니다. 운영자 선택 이벤트는 다른 탭의 activeEvent 변경으로 덮어쓰지 않습니다.\n\n## 한계\n\n여전히 가상 역할을 누구나 선택할 수 있으므로 인증 서비스가 아닙니다. 파일 기반 저장이고 PostgreSQL을 사용하지 않습니다. 기존 `contracts/openapi.yaml`과 `schema.sql`은 장기 운영 시스템 설계 초안입니다. 이 서버의 실제 API와 동일하다고 주장하지 않습니다. v7 실행 계약은 이 문서와 서버 구현/테스트를 기준으로 합니다.\n", "html": "<h1>로컬 리허설 서버와 데이터 계약<\/h1>\n<h2>구성<\/h2>\n<p>Python aiohttp가 HTTP/WebSocket과 파일 저장을 맡고 하나의 Node reducer가 브라우저와 동일한 규칙을 실행합니다. <code>src/experience/model.js<\/code>는 기존 도메인·무대 규칙, <code>src/product/model.js<\/code>는 v7 제품 명령·메뉴·역할 규칙입니다. 서버가 init/command/replace를 직렬 처리하고 명령 ID를 중복 방지합니다.<\/p>\n<h2>API<\/h2>\n<table>\n<thead>\n<tr>\n  <th>경로<\/th>\n  <th>용도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>GET /api/health<\/td>\n  <td>리허설 서버 확인<\/td>\n<\/tr>\n<tr>\n  <td>POST /api/session<\/td>\n  <td>리허설 역할 및 eventId 세션 발급 — 실제 로그인 아님<\/td>\n<\/tr>\n<tr>\n  <td>GET /api/state<\/td>\n  <td>역할·행사에 맞춘 상태<\/td>\n<\/tr>\n<tr>\n  <td>POST /api/command<\/td>\n  <td>기존/제품 도메인 명령<\/td>\n<\/tr>\n<tr>\n  <td>POST /api/snapshot<\/td>\n  <td>운영자 상태 교체, revision 충돌 검사<\/td>\n<\/tr>\n<tr>\n  <td>POST /api/reset<\/td>\n  <td>가상 데이터 초기화<\/td>\n<\/tr>\n<tr>\n  <td>GET /ws?token=...<\/td>\n  <td>역할별 WebSocket 상태<\/td>\n<\/tr>\n<tr>\n  <td>GET /api/qr?text=...<\/td>\n  <td>데모 SVG QR<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-json\">{&quot;id&quot;:&quot;unique-command-id&quot;,&quot;eventId&quot;:&quot;evt-connect&quot;,&quot;type&quot;:&quot;product.desk.save&quot;,&quot;payload&quot;:{&quot;name&quot;:&quot;등록데스크 01&quot;,&quot;mode&quot;:&quot;desk&quot;,&quot;action&quot;:&quot;IN&quot;}}\n<\/code><\/pre>\n<p>제품 명령은 desk.save, booth.save/printed, group.save/assign, field.save/move/delete, photo.moderate, media.add/usage/delete, presentation.set, wall.settings, template.save/delete, report.create, event.update/features, member.save, program.save/delete, notice.save, venue.save입니다.<\/p>\n<p>participant/display는 발급한 eventId에 고정됩니다. 출력은 읽기 전용, 참가자는 허용된 응답/등록/SELF 인증만 제출합니다. 운영자 선택 이벤트는 다른 탭의 activeEvent 변경으로 덮어쓰지 않습니다.<\/p>\n<h2>한계<\/h2>\n<p>여전히 가상 역할을 누구나 선택할 수 있으므로 인증 서비스가 아닙니다. 파일 기반 저장이고 PostgreSQL을 사용하지 않습니다. 기존 <code>contracts/openapi.yaml<\/code>과 <code>schema.sql<\/code>은 장기 운영 시스템 설계 초안입니다. 이 서버의 실제 API와 동일하다고 주장하지 않습니다. v7 실행 계약은 이 문서와 서버 구현/테스트를 기준으로 합니다.<\/p>\n"}, {"id": "09-demo-script", "title": "클라이언트 시연 순서", "markdown": "# 클라이언트 시연 순서\n\n## 1. 대행사 관점\n\n대행사 홈에서 두 행사와 두 고객사가 보입니다. 하나의 행사를 선택하면 sidebar가 행사 업무로 바뀝니다. 다시 대행사 홈으로 돌아가면 행사를 비교합니다. 새 행사 만들기로 빈 PRE 행사를 생성해 준비 체크를 확인합니다.\n\n## 2. 현장 준비\n\nCONNECT SUMMIT 행사로 돌아옵니다. 부스·스탬프에서 셀프 인증을 선택한 후 한 부스의 상세를 엽니다. QR 출력에서 A4/A5, SVG/PNG를 확인합니다. 신규 부스를 만들어도 그 부스의 실제 QR이 생성됩니다. 출력 완료는 수동 확인임을 설명합니다.\n\n## 3. 참가자\n\n참가자 화면에서 중앙 QR을 엽니다. 티켓을 보는 것과 부스 QR을 찍는 것의 차이를 보여줍니다. `DEMO-1001` 티켓, 부스코드 `ET:BOOTH:evt-connect:b1`로 시연합니다. 한 행사에서 SELF/STAFF를 동시에 사용하지 않으며 인증 기록 이후 방식 변경을 잠급니다. 두 방식을 비교하려면 데모 초기화 후 다시 시연하세요.\n\n## 4. 입장과 기록\n\n등록데스크에서 DEMO-1001을 한번 입력하고 다시 입력합니다. 두 번째 입력은 중복으로 막힙니다. 참가자 명단의 상세 drawer에서 티켓/입퇴장/부스 기록을 확인합니다.\n\n## 5. 참여와 스크린\n\n사진 검토에서 대기 사진을 공개하고 포토월로 이동합니다. 포토월 출력은 승인 사진만 사용합니다. 미디어에 가상 이미지나 짧은 영상을 올려 출력에 사용합니다. 고급 제어실이 필수 절차가 아님을 설명합니다.\n\n## 6. 커뮤니케이션과 결과\n\n캠페인을 네 단계로 준비하고 실제 발송 없이 저장합니다. 결과 분석과 보고서 스냅샷을 구분해 보여줍니다. 보고서를 만든 후 참가자 정보가 바뀌어도 생성 문서가 바뀌지 않음을 확인합니다.\n\n## 주의\n\n자체 리허설 서버와 여러 브라우저의 실연결은 사용자 환경에서 추가 확인이 필요합니다. 이 데모를 운영 완료 서비스나 실제 고객사 실적 자료로 소개하지 마세요. 이미지/영상은 사용 권한이 있는 가상자료를 사용하세요.\n", "html": "<h1>클라이언트 시연 순서<\/h1>\n<h2>1. 대행사 관점<\/h2>\n<p>대행사 홈에서 두 행사와 두 고객사가 보입니다. 하나의 행사를 선택하면 sidebar가 행사 업무로 바뀝니다. 다시 대행사 홈으로 돌아가면 행사를 비교합니다. 새 행사 만들기로 빈 PRE 행사를 생성해 준비 체크를 확인합니다.<\/p>\n<h2>2. 현장 준비<\/h2>\n<p>CONNECT SUMMIT 행사로 돌아옵니다. 부스·스탬프에서 셀프 인증을 선택한 후 한 부스의 상세를 엽니다. QR 출력에서 A4/A5, SVG/PNG를 확인합니다. 신규 부스를 만들어도 그 부스의 실제 QR이 생성됩니다. 출력 완료는 수동 확인임을 설명합니다.<\/p>\n<h2>3. 참가자<\/h2>\n<p>참가자 화면에서 중앙 QR을 엽니다. 티켓을 보는 것과 부스 QR을 찍는 것의 차이를 보여줍니다. <code>DEMO-1001<\/code> 티켓, 부스코드 <code>ET:BOOTH:evt-connect:b1<\/code>로 시연합니다. 한 행사에서 SELF/STAFF를 동시에 사용하지 않으며 인증 기록 이후 방식 변경을 잠급니다. 두 방식을 비교하려면 데모 초기화 후 다시 시연하세요.<\/p>\n<h2>4. 입장과 기록<\/h2>\n<p>등록데스크에서 DEMO-1001을 한번 입력하고 다시 입력합니다. 두 번째 입력은 중복으로 막힙니다. 참가자 명단의 상세 drawer에서 티켓/입퇴장/부스 기록을 확인합니다.<\/p>\n<h2>5. 참여와 스크린<\/h2>\n<p>사진 검토에서 대기 사진을 공개하고 포토월로 이동합니다. 포토월 출력은 승인 사진만 사용합니다. 미디어에 가상 이미지나 짧은 영상을 올려 출력에 사용합니다. 고급 제어실이 필수 절차가 아님을 설명합니다.<\/p>\n<h2>6. 커뮤니케이션과 결과<\/h2>\n<p>캠페인을 네 단계로 준비하고 실제 발송 없이 저장합니다. 결과 분석과 보고서 스냅샷을 구분해 보여줍니다. 보고서를 만든 후 참가자 정보가 바뀌어도 생성 문서가 바뀌지 않음을 확인합니다.<\/p>\n<h2>주의<\/h2>\n<p>자체 리허설 서버와 여러 브라우저의 실연결은 사용자 환경에서 추가 확인이 필요합니다. 이 데모를 운영 완료 서비스나 실제 고객사 실적 자료로 소개하지 마세요. 이미지/영상은 사용 권한이 있는 가상자료를 사용하세요.<\/p>\n"}, {"id": "10-scope-and-open-items", "title": "논의 항목별 반영과 남은 범위", "markdown": "# 논의 항목별 반영과 남은 범위\n\n|논의 항목|v7 반영|한계·남은 범위|\n|---|---|---|\n|대행사/행사 IA|별도 scope 메뉴·실제 행사 전환|조직별 서버 인증 미구현|\n|내부 탭|9개 행사 모듈·중복 메뉴 정리|고객사 조직 분류는 확정 필요|\n|행사 Lifecycle|PRE/LIVE/END 행동·준비 체크|자동 행사 상태 전환 규칙 미확정|\n|행사 생성|3단계 간소화·빈 데이터 생성|초청/승인/결제 단계 미연동|\n|참가자 명단|검색·상태·그룹·drawer·일괄 작업|대규모 페이지네이션/API 연결 전|\n|그룹/양식|실제 저장·순서·필수·등록 응답|기존 응답 스키마 이행·Excel 원본 매핑 고도화 별도|\n|데스크|설정→mode 실행→기록|물리 프린터·리더 인증 미검수|\n|부스|상세 인 동작과 고급 장면을 보존하기 위함입니다.\n\n```bash\npython tools/build_docs.py\npython tools/build.py\nnpm test\npython tests/v7/server_test.py\npython tests/v7/browser_test.py\n```\n\n브라우저 검사에는 Playwright와 Chromium이 필요합니다. 기본 `/usr/bin/chromium`, 다른 환경은 `CHROMIUM_PATH`를 설정합니다. QR 판독 확인에는 OpenCV가 필요합니다. 런타임 HTML에는 이런 개발 의존성이 없습니다.\n\n패키지의 과거 테스트/스크린샷은 archive이고 최신 성공 수에 합산하지 않습니다. 소스를 수정하면 제공한 manifest와 일치하지 않는 것이 정상이며 검증 결과를 새로 만들고 묶어야 합니다.\n", "html": "<h1>코드 구조와 인계<\/h1>\n<table>\n<thead>\n<tr>\n  <th>경로<\/th>\n  <th>역할<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>index.html<\/td>\n  <td>편집 가능한 진입점과 스크립트 순서<\/td>\n<\/tr>\n<tr>\n  <td>assets/v7/shell.js<\/td>\n  <td>메뉴·scope·공통 모바일·현장 shell<\/td>\n<\/tr>\n<tr>\n  <td>assets/v7/views-agency.js<\/td>\n  <td>고객/행사·간소화 wizard<\/td>\n<\/tr>\n<tr>\n  <td>assets/v7/views-event.js<\/td>\n  <td>Lifecycle·그룹·양식·설정<\/td>\n<\/tr>\n<tr>\n  <td>assets/v7/views-onsite.js<\/td>\n  <td>데스크·부스·QR 출력·이력<\/td>\n<\/tr>\n<tr>\n  <td>assets/v7/views-participant.js<\/td>\n  <td>홈·QR·참여·더보기·상태<\/td>\n<\/tr>\n<tr>\n  <td>assets/v7/views-screen.js<\/td>\n  <td>미디어·기본 출력·사진 검토<\/td>\n<\/tr>\n<tr>\n  <td>assets/v7/views-workflows.js<\/td>\n  <td>캠페인·템플릿·분석·보고서·drawer<\/td>\n<\/tr>\n<tr>\n  <td>assets/v7/views-content.js<\/td>\n  <td>프로그램·공지·행사장·게시판<\/td>\n<\/tr>\n<tr>\n  <td>assets/v7/controller.js<\/td>\n  <td>폼·명령·쓰기 제한·출력·다운로드<\/td>\n<\/tr>\n<tr>\n  <td>assets/v7/product.css<\/td>\n  <td>최신 공통 디자인 규칙<\/td>\n<\/tr>\n<tr>\n  <td>src/product/model.js<\/td>\n  <td>메뉴 registry·권한·제품 명령·projection<\/td>\n<\/tr>\n<tr>\n  <td>assets/core.js, src/ux, src/experience<\/td>\n  <td>재사용한 기존 도메인 규칙<\/td>\n<\/tr>\n<tr>\n  <td>assets/v4, assets/v5<\/td>\n  <td>재사용 view·stage·카메라·전송 계층<\/td>\n<\/tr>\n<tr>\n  <td>server<\/td>\n  <td>실제 로컬 리허설 HTTP/WebSocket<\/td>\n<\/tr>\n<tr>\n  <td>vendor<\/td>\n  <td>오프라인 QR 생성기와 라이선스<\/td>\n<\/tr>\n<tr>\n  <td>tests/v7<\/td>\n  <td>신규 회귀 검사<\/td>\n<\/tr>\n<tr>\n  <td>artifacts/v7<\/td>\n  <td>이번 실행 결과와 검증용 QR<\/td>\n<\/tr>\n<tr>\n  <td>contracts/v7<\/td>\n  <td>최신 경로/역할/탭 원장<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>v6 overlay는 index에서 제거했습니다. v7은 이전 전체 코드에 필요한 공통 shell과 업무 기능을 통합한 구조이며, 모든 과거 함수를 삭제하고 새 프레임워크로 다시 작성한 것은 아닙니다. 기존 코드가 남아 있는 이유는 이전 도메인 동작과 고급 장면을 보존하기 위함입니다.<\/p>\n<pre><code class=\"language-bash\">python tools/build_docs.py\npython tools/build.py\nnpm test\npython tests/v7/server_test.py\npython tests/v7/browser_test.py\n<\/code><\/pre>\n<p>브라우저 검사에는 Playwright와 Chromium이 필요합니다. 기본 <code>/usr/bin/chromium<\/code>, 다른 환경은 <code>CHROMIUM_PATH<\/code>를 설정합니다. QR 판독 확인에는 OpenCV가 필요합니다. 런타임 HTML에는 이런 개발 의존성이 없습니다.<\/p>\n<p>패키지의 과거 테스트/스크린샷은 archive이고 최신 성공 수에 합산하지 않습니다. 소스를 수정하면 제공한 manifest와 일치하지 않는 것이 정상이며 검증 결과를 새로 만들고 묶어야 합니다.<\/p>\n"}, {"id": "12-verification", "title": "v7 검증 기록", "markdown": "# v7 검증 기록\n\n최종 수치는 `artifacts/v7/release-verification.json`과 해당 원본 로그를 기준으로 합니다.\n\n\n## 이번 전달본의 실행 결과\n\n|검사|통과|실패|근거|\n|---|---:|---:|---|\n|Node 도메인·제품·등록 규칙|125|0|artifacts/v7/all-node-results.txt|\n|실제 HTTP/WebSocket 서버|38|0|tests/v5/server-results.json + artifacts/v7/server-results.json|\n|Chromium UI|412|0|artifacts/v7/browser-results.json|\n|문서 허브|29|0|artifacts/v7/documents-results.json|\n|JavaScript 구문|45개 파일|0|artifacts/v7/syntax-results.json|\n|Python 구문|17개 파일|0|artifacts/v7/syntax-results.json|\n\nUI 412건은 384개 경로·크기 조합과 28개 동작 시나리오입니다. 문서 29건은 14문서×2폭과 검색 1건입니다. 서로 다른 검사 단위를 하나의 ‘기능 완성률’로 합산하지 않습니다. 부스 QR PNG 판독은 UI 28개 시나리오 안에 포함됩니다.\n\n## 실행 범위\n\n- Node: 기존 핵심/UX/transport 규칙 + 제품 규칙 + 콘텐츠/등록 규칙.\n- Python: 실제 loopback HTTP/WebSocket 기존 서버 검사와 v7 event scope/projection 검사.\n- Chromium: 96개 경로 정의 × 1440/768/390/320px의 렌더링 384건, 사용자 상호작용 28건.\n- 다운로드한 부스 PNG를 QRCodeDetector로 판독하여 exact eventId와 boothId 확인.\n- JavaScript 구문, Python 구문, 압축 구조와 파일 해시.\n\n## 브라우저 검증의 방식\n\n브라우저의 file:// 이동은 환경 정책으로 차단되어, 생성한 HTML을 페이지에 직접 주입하고 **테스트 전용 메모리 Storage**를 적용했습니다. 이 shim은 최종 실행 HTML에 넣지 않았습니다. 실제 브라우저 HTTP/WS 연결이나 창 간 storage 보존 검사를 했다고 주장하지 않습니다. 서버 HTTP/WS는 별도 클라이언트로 실제 실행했습니다.\n\n렌더링 검사는 실행 오류/페이지 overflow/구현되지 않은 화면 문구를 확인합니다. 모든 기능 클릭 완료를 의미하지 않습니다. 28개 시나리오는 폼·QR·명단·미디어·캠페인·보고서 등의 실제 연결을 검사합니다.\n\n## 인수하지 않은 것\n\n상용 인증/조직 격리, 카카오/SMS/결제, 물리 카메라 인식률·리더·프린터·LED, GPU·4K60fps, 접근성 인증, 천명 이상 부하, 영상 코덱별 호환, 모바일 OS별 화면/키보드/전체화면 동작.\n\n검사 중 찾아 수정한 예: name=id 입력이 form.id를 가리는 DOM 충돌, 과거 모바일 shell 캡처로 인한 하단 메뉴 불일치, 새 부스 인쇄에서 참조 누락, 실제 시간과 시연 시간의 부스 검증 불일치. 이런 문제는 화면 스크린샷만 보고 완료를 선언하지 않고 기능 검사로 확인했습니다.\n", "html": "<h1>v7 검증 기록<\/h1>\n<p>최종 수치는 <code>artifacts/v7/release-verification.json<\/code>과 해당 원본 로그를 기준으로 합니다.<\/p>\n<h2>이번 전달본의 실행 결과<\/h2>\n<table>\n<thead>\n<tr>\n  <th>검사<\/th>\n  <th style=\"text-align:right\">통과<\/th>\n  <th style=\"text-align:right\">실패<\/th>\n  <th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Node 도메인·제품·등록 규칙<\/td>\n  <td style=\"text-align:right\">125<\/td>\n  <td style=\"text-align:right\">0<\/td>\n  <td>artifacts/v7/all-node-results.txt<\/td>\n<\/tr>\n<tr>\n  <td>실제 HTTP/WebSocket 서버<\/td>\n  <td style=\"text-align:right\">38<\/td>\n  <td style=\"text-align:right\">0<\/td>\n  <td>tests/v5/server-results.json + artifacts/v7/server-results.json<\/td>\n<\/tr>\n<tr>\n  <td>Chromium UI<\/td>\n  <td style=\"text-align:right\">412<\/td>\n  <td style=\"text-align:right\">0<\/td>\n  <td>artifacts/v7/browser-results.json<\/td>\n<\/tr>\n<tr>\n  <td>문서 허브<\/td>\n  <td style=\"text-align:right\">29<\/td>\n  <td style=\"text-align:right\">0<\/td>\n  <td>artifacts/v7/documents-results.json<\/td>\n<\/tr>\n<tr>\n  <td>JavaScript 구문<\/td>\n  <td style=\"text-align:right\">45개 파일<\/td>\n  <td style=\"text-align:right\">0<\/td>\n  <td>artifacts/v7/syntax-results.json<\/td>\n<\/tr>\n<tr>\n  <td>Python 구문<\/td>\n  <td style=\"text-align:right\">17개 파일<\/td>\n  <td style=\"text-align:right\">0<\/td>\n  <td>artifacts/v7/syntax-results.json<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>UI 412건은 384개 경로·크기 조합과 28개 동작 시나리오입니다. 문서 29건은 14문서×2폭과 검색 1건입니다. 서로 다른 검사 단위를 하나의 ‘기능 완성률’로 합산하지 않습니다. 부스 QR PNG 판독은 UI 28개 시나리오 안에 포함됩니다.<\/p>\n<h2>실행 범위<\/h2>\n<ul>\n<li>Node: 기존 핵심/UX/transport 규칙 + 제품 규칙 + 콘텐츠/등록 규칙.<\/li>\n<li>Python: 실제 loopback HTTP/WebSocket 기존 서버 검사와 v7 event scope/projection 검사.<\/li>\n<li>Chromium: 96개 경로 정의 × 1440/768/390/320px의 렌더링 384건, 사용자 상호작용 28건.<\/li>\n<li>다운로드한 부스 PNG를 QRCodeDetector로 판독하여 exact eventId와 boothId 확인.<\/li>\n<li>JavaScript 구문, Python 구문, 압축 구조와 파일 해시.<\/li>\n<\/ul>\n<h2>브라우저 검증의 방식<\/h2>\n<p>브라우저의 file:// 이동은 환경 정책으로 차단되어, 생성한 HTML을 페이지에 직접 주입하고 <strong>테스트 전용 메모리 Storage<\/strong>를 적용했습니다. 이 shim은 최종 실행 HTML에 넣지 않았습니다. 실제 브라우저 HTTP/WS 연결이나 창 간 storage 보존 검사를 했다고 주장하지 않습니다. 서버 HTTP/WS는 별도 클라이언트로 실제 실행했습니다.<\/p>\n<p>렌더링 검사는 실행 오류/페이지 overflow/구현되지 않은 화면 문구를 확인합니다. 모든 기능 클릭 완료를 의미하지 않습니다. 28개 시나리오는 폼·QR·명단·미디어·캠페인·보고서 등의 실제 연결을 검사합니다.<\/p>\n<h2>인수하지 않은 것<\/h2>\n<p>상용 인증/조직 격리, 카카오/SMS/결제, 물리 카메라 인식률·리더·프린터·LED, GPU·4K60fps, 접근성 인증, 천명 이상 부하, 영상 코덱별 호환, 모바일 OS별 화면/키보드/전체화면 동작.<\/p>\n<p>검사 중 찾아 수정한 예: name=id 입력이 form.id를 가리는 DOM 충돌, 과거 모바일 shell 캡처로 인한 하단 메뉴 불일치, 새 부스 인쇄에서 참조 누락, 실제 시간과 시연 시간의 부스 검증 불일치. 이런 문제는 화면 스크린샷만 보고 완료를 선언하지 않고 기능 검사로 확인했습니다.<\/p>\n"}, {"id": "13-acceptance-checklist", "title": "사용자 환경 최종 인수 체크리스트", "markdown": "# 사용자 환경 최종 인수 체크리스트\n\n## 제품 흐름\n\n대행사 메뉴와 행사 메뉴가 섞이지 않는지 확인합니다. 다른 행사에 참가자·부스·미디어를 만들고 전환했을 때 혼합되지 않는지 확인합니다. 실제 운영 URL은 역할·행사 범위를 서버에서 보호해야 합니다.\n\n## 참가자 모바일\n\niOS Safari/Android Chrome에서 5개 메뉴가 동일한지, QR이 한 번에 열리는지, 키보드가 입력·CTA를 덮지 않는지, 취소된 참가자의 QR이 보이지 않는지 확인합니다. 카메라 권한 거절·외부 브라우저·재접속도 확인합니다.\n\n## 현장\n\n인쇄한 안내판의 부스명/QR 인식 결과가 일치하는지 1:1 대조합니다. 바뀐 QR 또는 다른 행사 QR은 거절해야 합니다. 인터넷 장애 시 미확정과 성공을 구분합니다. 같은 사람이 두 데스크에서 동시에 스캔해도 중복 입장하지 않는지 확인합니다.\n\n## 출력\n\n올릴 파일의 코덱·길이·권한을 확인하고 행사장 해상도에서 테스트합니다. 브라우저 자동 소리 재생을 가정하지 마세요. 포토 검토에서 숨긴 사진이 출력에서 빠지는지, 다른 행사 출력창이 바뀌지 않는지 확인합니다.\n\n## 결과\n\n등록/누적입장/현재입장/미입장의 정의가 맞는지 확인합니다. 사진과 개인정보 공개 범위를 확인한 뒤 보고서를 생성합니다. PDF의 글자 줄바꿈과 페이지 경계를 실제 인쇄 미리보기에서 검수합니다.\n\n이 체크리스트는 검사 완료 기록이 아니라 사용자 환경에서 수행할 후속 인수 계획입니다.\n", "html": "<h1>사용자 환경 최종 인수 체크리스트<\/h1>\n<h2>제품 흐름<\/h2>\n<p>대행사 메뉴와 행사 메뉴가 섞이지 않는지 확인합니다. 다른 행사에 참     V.messages = () => { const w = W(); return frame(head('메시지 캠페인', '준비 → 대상 확인 → 예약 → 결과 확인을 하나의 작업으로.', B('새 캠페인', 'new-campaign', 'primary', 'plus')) + `<div class="hint warning mb16">외부 메시징 서비스가 연결되어 있지 않습니다. 예약은 브라우저에 저장만 되며, ‘발송 흐름 시연’도 실제 메시지를 보내지 않습니다.</div><div class="grid3 mb16">${stat('전체 캠페인', w.messages.length, '개', '현재 행사 캠페인', 'message')}${stat('작성·예약 중', w.messages.filter(x => x.status !== 'SIMULATED').length, '개', '실행 준비 상태', 'clock', 'orange')}${stat('가상 완료', w.messages.filter(x => x.status === 'SIMULATED').length, '개', '실제 발송 건수 아님', 'check', 'green')}</div><section class="card">${table(['캠페인', '채널', '대상', '인원', '상태', '관리'], w.messages.map(m => `<tr><td><strong>${e(m.title)}</strong><div class="small muted">${e(m.scheduled || '즉시 시연')}</div></td><td>${badge(m.channel, 'brand')}</td><td>${e(m.target)}</td><td>${fmt(m.count)}</td><td>${badge({ DRAFT: '초안', SCHEDULED: '예약 저장', SIMULATED: '가상 완료', CANCELLED: '취소' }[m.status] || m.status, m.status === 'SIMULATED' ? 'success' : m.status === 'SCHEDULED' ? 'warning' : '')}</td><td><div class="row gap8">${B('미리보기', 'campaign-detail', 'sm', 'message', `data-id="${e(m.id)}"`)}${m.status === 'SIMULATED' || m.status === 'CANCELLED' ? '' : B('발송 흐름 시연', 'simulate-campaign', 'sm', 'play', `data-id="${e(m.id)}"`)}</div></td></tr>`))}</section><div class="grid2 mt24"><section class="card card-pad"><h3>발송 전 점검</h3><div class="checklist"><label><input type="checkbox">수신 대상과 예상 건수 확인</label><label><input type="checkbox">치환 변수와 티켓 링크 미리보기 확인</label><label><input type="checkbox">승인 템플릿·발신번호·이용 요금 확인</label></div></section><section class="card card-pad"><h3>채널 연동 경계</h3><p class="small muted mt16">알림톡 템플릿 심사, SMS/LMS 바이트 산정, 대체 발송, 공급사 응답 조회·중복 콜백 처리 등은 실제 연동 단계에서 확인합니다.</p>${L('연동 설계 보기', 'documents', 'ghost mt16', 'arrow')}</section></div>`, 'p.28–31, 56–64', '개별 발송·템플릿·대기목록을 캠페인 흐름으로 통합한 개선 제안입니다.'); };
    V.schedule = () => frame(head('프로그램 및 일정', '이미지 시간표를 보완하는 구조화된 일정 제안입니다.', L('참가자 일정 보기', 'mobile-program', '', 'phone') + B('프로그램 추가', 'new-program', 'primary', 'plus')) + `<div class="grid-main"><section class="card card-pad"><div class="row between mb16"><h3>${e(E().date)} 프로그램</h3>${badge('데이터형 일정 · 제안', 'brand')}</div><div class="timeline">${W().program.map((p, i) => `<div class="timeline-item ${i === 2 ? 'current' : ''}"><div class="time">${e(p.time)}<small>${e(p.end)}</small></div><div><h3>${e(p.title)}</h3><p>${icon('pin')} ${e(p.location)}</p></div>${badge(p.tag, i === 2 ? 'brand' : '')}</div>`).join('')}</div></section><aside class="card card-pad"><h3>원 기획 범위와의 관계</h3><p class="small muted mt16">원 기획은 행사페이지용·리포트용 타임테이블 이미지 업로드와 위치/프로그램 텍스트 입력입니다. 시간별 데이터 편집은 추가 제안이며 이미지 업로드 요구를 대체한 확정 범위가 아닙니다.</p><div class="hint mt24">기기에서 읽기 쉬운 일정<br>실시간 안내 변경<br>결과보고서 데이터 재사용</div></aside></div>`, 'p.81, 112');
    V.content = () => { const tab = A().ui.contentTab || 'notice'; let body = ''; if (tab === 'notice')
        body = `<div class="row between mb16"><h3>참가자에게 전할 소식</h3>${B('공지 등록', 'new-notice', 'primary', 'plus')}</div>${W().notices.map(n => `<article class="question-card"><div class="row between"><h3>${e(n.title)}</h3>${n.pinned ? badge('상단 고정', 'brand') : ''}</div><p class="muted">${e(n.body)}</p><div class="row mt16">${B(n.pinned ? '고정 해제' : '상단 고정', 'pin-notice', 'sm', 'pin', `data-id="${e(n.id)}"`)}${B('삭제', 'delete-notice', 'sm ghost', 'trash', `data-id="${e(n.id)}"`)}</div></article>`).join('') || empty('공지사항이 없습니다', '행사 안내를 등록하면 참가자 모바일에 표시됩니다.')}`; if (tab === 'venue')

    V.engagement = () => frame(head('참여 프로그램', '현장의 분위기를 참여로, 참여를 기록으로 연결합니다.', L('무대 화면', 'live', '', 'monitor')) + `<div class="grid3">${[['polls', 'chart', 'LIVE POLL', '실시간 투표', '참가자의 선택을 무대 화면에 시각화합니다.'], ['quiz', 'help', 'QUIZ', '주관식 퀴즈', '문제를 공개하고 참가자의 답변을 받습니다.'], ['qna', 'message', 'Q&A', '질문과 답변', '질문 수집과 운영진 답변을 연결합니다.'], ['draw', 'gift', 'LUCKY DRAW', '럭키드로우', '추첨 대상과 결과를 분리해서 관리합니다.'], ['survey', 'star', 'FEEDBACK', '만족도 평가', '행사 경험을 다음 운영의 개선점으로.'], ['photos', 'photo', 'PHOTO WALL', '라이브 포토월', '검토된 사진으로 함께 만드는 현장 기록.']].map(([r, ic, en, t, d]) => `<section class="card card-pad"><div class="booth-icon">${icon(ic)}</div><div class="eyebrow mt24">${en}</div><h2>${t}</h2><p class="small muted mt8">${d}</p><div class="mt24">${L('프로그램 열기', r, 'w100', 'arrow')}</div></section>`).join('')}</div>`, 'p.41–55, 71–76');
    V.polls = () => { const p = W().poll, counts = p.base.map((v, i) => v + Object.values(p.votes).filter(x => x === i).length), total = counts.reduce((a, b) => a + b, 0); return frame(head('실시간 투표', '참가자 응답과 무대 결과를 같은 상태로 연결합니다.', L('참가자 투표', 'mobile-poll', '', 'phone') + L('무대 화면', 'live', 'primary', 'monitor')) + `<div class="grid-main"><section class="card card-pad"><div class="row between mb16">${badge(p.status === 'OPEN' ? '응답 수집 중' : '응답 마감', p.status === 'OPEN' ? 'success' : '')}<span class="small muted">응답 ${fmt(total)}명 · 기존 표본 + 데모 응답</span></div><h2>${e(p.title)}</h2>${p.options.map((o, i) => `<div class="poll-option"><div class="row between"><span>${e(o)}</span><strong>${fmt(counts[i])} <span class="muted small">(${total ? Math.round(counts[i] / total * 100) : 0}%)</span></strong></div><div class="progress" style="height:10px"><i style="width:${total ? counts[i] / total * 100 : 0}%"></i></div></div>`).join('')}</section><aside class="card card-pad"><h3>진행 컨트롤</h3><p class="small muted mt16">투표 상태와 무대 페이지를 분리해 운영합니다. 마감 후 참가자가 제출하면 차단됩니다.</p><div class="mt24">${B(p.status === 'OPEN' ? '투표 마감' : '투표 재개', 'toggle-poll', p.status === 'OPEN' ? 'w100' : 'primary w100', p.status === 'OPEN' ? 'pause' : 'play')}</div><div class="hint mt24">이 데모는 한 개의 투표를 제공합니다. 다중 문항 편집과 서버 기반 동시 응답·세션 동기화는 구현 명세에 분리되어 있습니다.</div></aside></div>`, 'p.44–47, 114', '응답 마감·중복 제출 차단은 개선 제안입니다.'); };
    V.quiz = () => frame(head('주관식 퀴즈', '질문과 정답 공개 시점을 나누어 운영합니다.', L('참가자 답변', 'mobile-quiz', '', 'phone')) + `<div class="grid2"><section class="card card-pad"><div class="row between mb16">${badge(W().quiz.status === 'OPEN' ? '진행 중' : '마감', 'brand')}${B('상태 전환', 'toggle-quiz', 'sm', 'refresh')}</div><div class="eyebrow">QUESTION 01</div><h2>${e(W().quiz.title)}</h2><details class="mt24"><summary class="small brand-text" style="cursor:pointer">운영자 정답 확인</summary><div class="hint mt16">${e(W().quiz.answer)}</div></details><p class="small muted mt24">데모에서는 답변 접수까지만 지원합니다. 자동 채점·유사 답변 인정·랭킹은 원문 확정 요구가 아닙니다.</p></section><section class="card card-pad"><h3>접수된 답변</h3>${Object.entries(W().quiz.answers).length ? `<ul class="compact-list">${Object.entries(W().quiz.answers).map(([id, a]) => `<li><div class="grow"><strong>${e(W().participants.find(p => p.id === id)?.name || '참가자')}</strong><small>${e(a)}</small></div>${badge('접수', 'success')}</li>`).join('')}</ul>` : empty('아직 답변이 없습니다', '참가자 화면에서 주관식 답변을 제출해보세요.')}</section></div>`, 'p.48–51, 115');
    V.qna = () => frame(head('Q&A 관리', '질문을 놓치지 않고, 답변을 명확하게.', L('참가자 화면', 'mobile-qna', '', 'phone')) + `<div class="grid-main"><section class="stack">${W().qna.map(q => `<article class="card card-pad"><div class="row between"><div class="person-cell">${avatar(q.author)}<strong>${e(q.author)}</strong></div>${badge(q.answer ? '답변 완료' : '새 질문', q.answer ? 'success' : 'brand')}</div><h3 class="mt16">${e(q.question)}</h3>${q.answer ? `<div class="hint mt16"><strong>운영진 답변</strong><p class="mt8">${e(q.answer)}</p></div>` : ''}<div class="row between mt16"><span class="small muted">${icon('heart')} ${q.likes} 공감 · 가상 초기값</span>${B(q.answer ? '답변 수정' : '답변하기', 'answer-qna', 'sm', 'edit', `data-id="${e(q.id)}"`)}</div></article>`).join('')}</section><aside class="card card-pad"><h3>공개 범위</h3><p class="small muted mt16">이 데모는 행사 참가자 간 Q&A를 공유하는 제안 방식입니다. 원문에서 본인 글만 표시하는지와 전체 질문 열람 범위가 완전히 확정되어 있지 않아, 고객사 확인 사항으로 남겼습니다.</p><div class="hint mt24">공감 수는 시각화 예시입니다. 참가자별 좋아요 처리와 공개 범위 권한은 서버 설계 항목입니다.</div></aside></div>`, 'p.52, 116');
    V.draw = () => { const winners = W().winners, pool = EventouchCore.drawPool(W().participants, winners.map(x => x.participantId)); return frame(head('럭키드로우', '추첨 대상 확인부터 결과 기록까지.', L('무대 추첨 화면', 'live', '', 'monitor')) + `<div class="grid2"><section class="card card-pad center"><div class="eyebrow">LUCKY DRAW</div><h2>다음 행운의 주인공은?</h2><div class="draw-number" style="color:var(--brand);font-size:64px;margin:32px 0">${winners.length ? e(winners[0].number) : '— — — —'}</div>${winners.length ? `<h2>${e(winners[0].name)}</h2><p class="small muted mt8">${e(winners[0].company)}</p>` : '<p class="muted small">현재 입장 중이며 아직 당첨되지 않은 참가자 대상</p>'}<div class="mt24">${B('데모 추첨하기', 'draw-winner', 'primary lg', 'gift', pool.length ? '' : 'disabled')}</div><p class="small muted mt16">대상 ${fmt(pool.length)}명 · 서버 검증 없는 로컬 시뮬레이션</p></section><section class="card card-pad"><div class="row between mb16"><h3>당첨 기록</h3>${badge(winners.length + '명', 'brand')}</div>${winners.length ? `<ul class="compact-list">${winners.map(w => `<li>${avatar(w.name)}<div class="grow"><strong>${e(w.name)}</strong><small>${e(w.company)} · ${e(w.number)}</small></div>${badge('당첨', 'success')}</li>`).join('')}</ul>` : empty('추첨 전입니다', '한 번 추첨된 참가자는 다음 데모 추첨에서 제외됩니다.')}<div class="hint mt24">‘현재 입장자만 추첨’은 제안 정책입니다. 원문은 등록 DB 활용과 중복 당첨 제외를 요구합니다. 수상 취소·재추첨은 이유와 이력을 남기는 방식으로 별도 개발합니다.</div></section></div>`, 'p.41–43, 113'); };

    V.survey = () => { const w = W(), scores = w.responses.flatMap(x => x.scores), avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0; return frame(head('만족도 평가', '참가자의 경험을 다음 행사에 반영합니다.', L('참가자 평가', 'mobile-survey', '', 'phone') + B(w.survey.open ? '응답 마감' : '응답 재개', 'toggle-survey', '', 'pause')) + `<div class="grid3 mb16">${stat('전체 평균', avg ? avg.toFixed(2) : '—', '/ 5', '제출된 전체 평가 항목 평균', 'star')}${stat('응답 참가자', w.responses.length, '명', '1인 1회 데모 응답', 'people', 'green')}${stat('응답 상태', w.survey.open ? '수집 중' : '마감', '', '수동 전환 제안', 'clock', 'blue')}</div><div class="grid2"><section class="card card-pad"><h3 class="mb16">항목별 평균</h3>${w.survey.questions.map((q, i) => { const values = w.responses.map(r => r.scores[i]).filter(x => Number.isFinite(x)), a = values.length ? values.reduce((x, y) => x + y, 0) / values.length : 0; return `<div class="poll-option"><div class="row between"><span>${e(q)}</span><strong>${values.length ? a.toFixed(2) : '—'} <span class="muted">/ 5</span></strong></div><div class="progress" style="height:10px"><i style="width:${a * 20}%"></i></div></div>`; }).join('')}</section><section class="card card-pad"><h3>최근 의견</h3>${w.responses.filter(r => r.comment).length ? `<ul class="compact-list">${w.responses.filter(r => r.comment).slice(-4).reverse().map(r => `<li><div><strong>데모 참가자 의견</strong><p class="small muted mt8">${e(r.comment)}</p></div></li>`).join('')}</ul>` : empty('주관식 의견이 없습니다', '서술형 의견 수집은 원 기획의 5점 평가에 추가한 개선 제안입니다.')}<div class="hint mt24">평균과 응답률의 분모는 계약 시 확정해야 합니다. 기존 120개 응답은 차트 표현을 위한 가상 표본이며 실제 행사 성과가 아닙니다.</div></section></div>`, 'p.53–55, 117'); };
    V.reports = () => { const w = W(), m = EventouchCore.metrics(w.participants), r = w.report, scores = w.responses.flatMap(x => x.scores), avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(2) : '—'; return frame(head('결과보고서 스튜디오', '운영 데이터와 현장 기록을, 전달 가능한 결과로.', B('보고서 JSON', 'export-report', '', 'download') + B('인쇄 / PDF로 저장', 'print-report', 'primary', 'print')) + `<div class="hint warning mb16 no-print">제안용 블록형 보고서입니다. 원문이 요구한 자유 이동·크기 조정·복사 편집기는 구현되지 않았으며 별도 범위입니다. PDF 버튼은 브라우저 인쇄창을 엽니다.</div><div class="grid-side"><aside class="card card-pad report-controls"><div class="eyebrow">REPORT BUILDER</div><h3>보고서 구성</h3><div class="report-nav mt16">${[['overview', '행사 개요'], ['attendance', '참가자 통계'], ['booths', '부스 이용현황'], ['survey', '만족도 평가'], ['photos', '행사 사진']].map(([k, t]) => `<label><input type="checkbox" data-report-section="${k}" ${r.sections[k] ? 'checked' : ''}>${t}</label>`).join('')}</div><div class="field mt24"><label for="report-title">보고서 제목</label><input id="report-title" type="text" value="${e(r.title)}" maxlength="100"></div><div class="field mt16"><label for="report-summary">행사 총평</label><textarea id="report-summary" rows="5" maxlength="1000">${e(r.summary)}</textarea></div>${B('편집 내용 저장', 'save-report', 'primary w100 mt16', 'check')}<p class="small muted mt16">블록 선택과 총평은 브라우저에 저장됩니다. 수치 스냅샷은 JSON 내보내기 시점에 생성됩니다.</p></aside><div class="stack report-content"><section class="report-cover"><div class="report-brand">EVENTOUCH / EVENT REPORT</div><h2>${e(r.title)}</h2><p>${e(E().client)} · ${e(E().date)}</p><div class="cover-bottom"><span>PEOPLE. EVENTS. CONNECTED.</span><span>PROPOSAL DEMO · 가상 데이터</span></div></section>${r.sections.overview ? `<section class="report-block"><div class="eyebrow">01 / OVERVIEW</div><h3>행사 개요</h3><dl class="detail-grid"><div><dt>행사명</dt><dd>${e(E().name)}</dd></div><div><dt>장소</dt><dd>${e(E().venue)}</dd></div><div><dt>일시</dt><dd>${e(E().date)} ${e(E().time)}</dd></div><div><dt>등록자</dt><dd>${fmt(m.total)}명</dd></div></dl><p class="small muted">${e(r.summary)}</p></section>` : ''}${r.sections.attendance ? `<section class="report-block"><div class="eyebrow">02 / ATTENDANCE</div><h3>참가자 통계</h3><div class="grid3"><div><div class="report-stat">${fmt(m.total)}</div><small class="muted">전체 등록자</small></div><div><div class="report-stat brand-text">${fmt(m.checked)}</div><small class="muted">누적 입장자</small></div><div><div class="report-stat success-text">${m.rate}%</div><small class="muted">누적 입장률</small></div></div></section>` : ''}${r.sections.booths ? `<section class="report-block"><div class="eyebrow">03 / ENGAGEMENT</div><h3>부스 이용현황</h3>${table(['부스', '이용 횟수', '배정 수량'], w.booths.map(b => `<tr><td>${e(b.name)}</td><td>${fmt(b.used)}회</td><td>${b.capacity ? fmt(b.capacity) : '제한 없음'}</td></tr>`))}<p class="small muted mt16">이용 횟수와 고유 이용자는 다릅니다. 이 데모는 횟수만 표시합니다.</p></section>` : ''}${r.sections.survey ? `<section class="report-block"><div class="eyebrow">04 / FEEDBACK</div><h3>행사 만족도</h3><div class="row gap24"><strong class="report-stat brand-text">${avg} / 5</strong><span class="small muted">${w.responses.length}명 응답 · 전체 평가 항목 평균</span></div></section>` : ''}${r.sections.photos ? `<section class="report-block"><div class="eyebrow">05 / MOMENTS</div><h3>공개 사진 예시</h3><div class="grid2">${w.photos.filter(p => p.status === 'APPROVED').slice(0, 2).map(p => p.data ? `<img src="${e(p.data)}" alt="${e(p.caption)}" style="width:100%;border-radius:8px">` : photoArt(p.kind)).join('') || '<p class="muted small">공개된 사진이 없습니다.</p>'}</div><p class="small muted mt16">정식 리포트의 증빙 사진과 참가자 포토 사용 범위는 고객사 확인 사항입니다.</p></section>` : ''}</div></div>`, 'p.87–105', '자유 편집형은 원문 요구 / 블록형은 대안 제안입니다.'); };

 <script>

 return `<div class="participant-shell"><div class="mobile-device"><div class="mobile-screen"><header class="mobile-top"><a href="#mobile-home" aria-label="참가자 홈">${logo()}</a><a href="#mobile-more" class="icon-btn" aria-label="전체 메뉴">${icon('menu')}</a></header><main id="main-content" tabindex="-1" class="mobile-page">${body}</main><nav class="mobile-tabs" aria-label="참가자 주요 메뉴">${[['home','grid','홈'],['ticket','scan','티켓'],['program','calendar','일정'],['engage','spark','참여'],['more','menu','더보기']].map(([k,i,l])=>`<a href="#${paths[k]}" class="${key===k?'active':''}" ${key===k?'aria-current="page"':''}>${icon(i)}<span>${l}</span></a>`).join('')}</nav></div></div></div>`;
 }
 ETViews.overview=()=>{const w=W(),m=EventouchCore.metrics(w.participants),d=S(),ex=XP();return `<div class="v4-page">${head('행사 운영 현황','준비부터 현장까지, 지금 필요한 운영 정보를 한눈에.',L('참가자 화면','mobile-home','','phone')+L('현장 운영 열기','checkin','primary','scan'),'OPERATOR / WORKSPACE')}<section class="v4-hero"><div><div class="v4-kicker">EVENT WORKSPACE / 2026</div><h2>${e(E().name)}</h2><p>${e(E().description)}</p><div class="v4-hero-meta"><span>${icon('calendar')}${e(E().date)} ${e(E().time)}</span><span>${icon('pin')}${e(E().venue)}</span><span>${icon('shield')}모든 참가자는 가상 데이터</span></div></div><div class="v4-hero-end">${badge(E().status==='LIVE'?'진행 중':'준비 중','success')}${L('라이브 제어실','live-control','','monitor')}</div></section><div class="v4-metrics">${[['등록 참가자',m.total,'취소 등록 제외'],['누적 입장',m.checked,'한 번 이상 입장한 참가자'],['현재 입장 중',m.inside,'퇴장자를 제외한 현재 인원'],['아직 미입장',m.notArrived,'등록했으나 입장 이력 없음']].map(([l,v,n])=>`<div class="v4-metric"><div class="label">${l}</div><div class="kpi-number">${fmt(v)}<small>명</small></div><small>${n}</small></div>`).join('')}</div><div class="v4-grid">${panel('참여가 연결되는 순간','운영 데이터가 참가자 경험과 무대 출력으로 이어집니다.',`<div class="v4-row between"><div><div class="kpi-number">${fmt(d.poll.total)}<small>응답</small></div><div class="v4-sub">${e(w.poll.title)}</div></div>${badge(w.poll.status==='OPEN'?'투표 진행 중':'투표 마감',w.poll.status==='OPEN'?'success':'')}</div><div class="v4-spark-bars" aria-label="보기별 투표수">${d.poll.counts.map((n,i)=>`<div class="v4-spark-bar" style="height:${Math.max(3,n/Math.max(...d.poll.counts)*125)}px" title="${e(d.poll.options[i])}: ${n}표"></div>`).join('')}</div><div class="v4-axis">${d.poll.options.map(o=>`<span>${e(o)}</span>`).join('')}</div><div class="v4-note">초기 표수는 합성 데이터이며, 새로운 응답은 실제 데모 상태에 반영됩니다.</div>`,L('투표 관리','polls','sm','arrow'))}${panel('오늘의 프로그램','데모 일정 · 실제 시간 자동 전환은 별도 정책',`<div class="v4-agenda">${w.program.slice(0,4).map((p,i)=>`<a href="#mobile-program-detail?program=${i}"><time>${e(p.time)}</time><div><h3>${e(p.title)}</h3><p>${e(p.location)}</p></div></a>`).join('')}</div>`,L('전체 일정','schedule','sm','arrow'))}</div><div class="v4-mini-grid">${[['라이브 제어실','live-control','monitor','Preview → TAKE → Program'],['현장 사전 점검','preflight','shield','연결·출력·브라우저 권한 확인'],['연결된 제품 데모','demo','play','참가자부터 결과보고서까지']].map(([t,r,i,sub])=>`<a class="v4-quick" href="#${r}">${icon(i)}<div><strong>${t}</strong><small>${sub}</small></div></a>`).join('')}</div>${panel('최근 현장 기록','새로운 입퇴장 작업부터 기록됩니다.',table(['참가자','작업','데스크','시간'],w.logs.slice(0,5).map(l=>`<tr><td><strong>${e(l.name)}</strong></td><td>${badge(l.action==='IN'?'입장':'퇴장',l.action==='IN'?'success':'')}</td><td>${e(l.unit)}</td><td>${e(new Date(l.at).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'}))}</td></tr>`)),L('전체 기록','check-history','sm','arrow'))}${footer()}</div>`;};
 ETViews.draw=()=>{const d=XP().draw,pool=W().participants.filter(p=>p.status==='IN'&&!p.cancelled&&!W().winners.includes(p.id));return `<div class="v4-page">${head('행운의 순간을, 정확하게.','대상 확인 → 결과 저장 → 무대 공개 → 확정의 순서로 진행합니다.',L('라이브 제어실','live-control','primary','monitor'),'LUCKY DRAW / CONTROL')}<div class="v4-grid equal">${panel('추첨 진행','현재 입장자 대상 · 이전 당첨자 제외',`<div class="v4-row between"><div class="kpi-number">${fmt(pool.length)}<small>명 대상</small></div>${badge(d.phase)}</div><div class="mt24">${d.result?`<h1>${e(d.result.name)}</h1><p class="v4-sub">${e(d.result.company)} · ${e(d.result.ticket)}</p>`:'<h2>다음의 주인공을 기다립니다.</h2>'}</div><div class="v4-row wrap mt24">${d.phase==='ROLLING'?B('결과 결정 · 저장','v4-draw-resolve','ink','gift'):d.phase==='REVEALED'?B('당첨 결과 확정','v4-draw-confirm','ink','check'):B('추첨 시작','v4-draw-start','ink','play')}${L('무대 공개 제어','live-control','','monitor')}</div><div class="v4-callout mt24">저장된 결과는 TAKE 전까지 출력 장치에 전달하지 않습니다. 애니메이션은 추첨 결과를 결정하지 않습니다. 추첨 취소·재추첨 승인 절차는 별도 운영 정책이 필요합니다.</div>`)}${panel('확정된 당첨 기록','확정 후 다음 회차에서 자동 제외',d.history.length?table(['회차','이름','소속','티켓'],d.history.map(w=>`<tr><td>${w.round}</td><td>${e(w.name)}</td><td>${e(w.company)}</td><td>${e(w.ticket)}</td></tr>`)):empty('아직 확정된 결과가 없습니다','결과를 확인한 뒤 확정해주세요.'))}</div>${footer()}</div>`;};
 ETViews['mobile-home']=()=>{const w=W(),p=P(),a=w.program[1]||w.program[0],next=w.program[2];return mobileShell('',`<section class="v4-mobile-cover" style="--event-accent:${e(XP().theme.accent)};color:${X.contrast(XP().theme.accent,'#17191D')>=4.5?'#17191D':'#FFFFFF'}"><small>${e(E().date)} / TOGETHER, WE BEGIN.</small><h2>${e(E().name).replaceAll(' ','<br>')}</h2><p>${e(E().venue)}</p></section><div class="v4-welcome"><div><h1>${e(p?.name||'참가자')}님, 반갑습니다.</h1><p>오늘의 새로운 만남을 시작하세요.</p></div>${badge(p?.status==='IN'?'입장 완료':'참여 준비',p?.status==='IN'?'success':'')}</div><a href="#mobile-ticket" class="v4-pass-cta"><div class="v4-row"><span class="pass-symbol">${icon('scan')}</span><div><strong>나의 모바일 티켓</strong><small>입장할 때 이 티켓을 보여주세요.</small></div></div>${icon('arrow')}</a><section class="v4-mobile-section"><div class="v4-row between"><h2>지금, 그리고 다음</h2><a href="#mobile-program" class="small muted">전체 일정</a></div><div class="v4-now-card"><div class="v4-status"><i></i>DEMO / NOW</div><h3>${e(a?.title||'행사를 준비하고 있습니다.')}</h3><p>${e(a?.time||'')} — ${e(a?.end||'')} · ${e(a?.location||'')}</p>${next?`<div class="next-row"><strong>NEXT</strong><span>${e(next.time)} &nbsp; ${e(next.title)}</span></div>`:''}</div></section><section class="v4-mobile-section"><h2>함께 참여해요</h2><div class="v4-feature-grid">${[['poll','mobile-poll','chart','실시간 투표'],['stamp','mobile-stamp','gift','스탬프'],['qna','mobile-qna','message','Q&A'],['photo','mobile-photo','photo','포토월'],['survey','mobile-survey','star','만족도'],['venue','mobile-venue','pin','행사장 안내']].filter(([k])=>w.features[k]).map(([k,r,i,t])=>`<a href="#${r}" class="v4-feature-tile">${icon(i)}${t}</a>`).join('')}</div></section><section class="v4-mobile-section"><div class="v4-row between"><h2>꼭 확인해 주세요</h2><a href="#mobile-notice" class="small muted">전체 공지</a></div>${w.notices.slice(0,1).map(n=>`<div class="v4-now-card"><h3 style="margin-top:0;font-size:15px">${e(n.title)}</h3><p style="margin-top:8px">${e(n.body)}</p></div>`).join('')}</section><p class="v4-mobile-note">EVENTOUCH · 가상 행사 체험 / 실제 참가 신청이 아닙니다.</p>`,'home');};
 ETViews['mobile-ticket']=()=>{const p=P();return mobileShell('모바일 티켓',p?`<div class="v4-kicker">YOUR EVENT PASS</div><h1 style="margin:10px 0 24px">만남의 시작,<br>이 티켓 하나로.</h1><section class="v4-ticket"><div class="v4-ticket-top"><small>CONNECT / TOGETHER</small><h2>${e(E().name)}</h2></div><div class="v4-ticket-body">${badge(p.status==='IN'?'현재 입장 중':p.status==='OUT'?'퇴장 완료':'입장 준비',p.status==='IN'?'success':'')}<div class="v4-ticket-name" style="margin-top:16px">${e(p.name)}</div><p class="small muted" style="margin-top:4px">${e(p.company)} · ${e(p.group)}</p><a href="#mobile-fullticket" class="v4-qr" style="display:block" aria-label="QR 크게 보기">${U.qr(p.ticket)}</a><div class="v4-ticket-code">${e(p.ticket)}</div><p class="v4-mobile-note" style="margin-top:14px">데스크에 QR을 보여주세요. 누르면 확대됩니다.</p></div><dl class="v4-ticket-meta"><div><dt>DATE & TIME</dt><dd>${e(E().date)} · ${e(E().time)}</dd></div><div><dt>VENUE</dt><dd>${e(E().venue)}</dd></div></dl></section><div class="hint mt24">데모 티켓입니다. 실제 참가자 본인 인증은 연동되지 않았습니다.</div>`:empty('등록된 티켓이 없습니다','데모 참가 신청 후 티켓을 확인하세요.',L('참가 신청','mobile-registration','primary')),'ticket');};
 ETViews['mobile-fullticket']=()=>mobileShell('티켓 확대',`<div class="center"><div class="v4-kicker">SCAN TO CONNECT</div><h1 class="mt16">${e(P()?.name||'참가자')}</h1><div style="margin:36px auto;max-width:320px;background:white;padding:16px">${P()?U.qr(P().ticket):''}</div><div class="v4-ticket-code">${e(P()?.ticket||'')}</div><p class="small muted mt24">화면 밝기를 높이고 데스크에 보여주세요.</p>${L('티켓으로 돌아가기','mobile-ticket','w100 mt24','back')}</div>`,'ticket');
 const featureLinks=()=>[['mobile-poll','chart','실시간 투표','지금 여러분의 의견을 들려주세요'],['mobile-quiz','help','퀴즈','함께 생각하고 정답을 맞혀보세요'],['mobile-stamp','gift','스탬프 투어','현장의 새로운 경험을 모아보세요'],['mobile-qna','message','Q&A','궁금한 점을 운영진에게 물어보세요'],['mobile-photo','photo','포토월','오늘의 장면을 함께 나눠주세요'],['mobile-survey','star','만족도 평가','다음 행사를 위한 의견을 남겨주세요']];
 ETViews['mobile-engage']=()=>mobileShell('지금 참여',`<div class="v4-kicker">PARTICIPATE / CONNECT</div><h1 class="mt8 mb24">함께 만드는<br>오늘의 행사.</h1><div class="v4-status-stack">${featureLinks().filter(([r])=>W().features[r.replace('mobile-','')]).map(([r,i,t,s])=>`<a href="#${r}"><div class="v4-row">${icon(i)}<div><strong>${t}</strong><small>${s}</small></div></div>${icon('chevron')}</a>`).join('')}</div>`,'engage');
 ETViews['mobile-more']=()=>mobileShell('전체 메뉴',`<div class="v4-kicker">EVENT GUIDE</div><h1 class="mt8 mb24">필요한 정보를<br>한곳에서.</h1><div class="v4-status-stack">${[['mobile-ticket','scan','나의 참가 정보'],['mobile-program','calendar','프로그램'],['mobile-notice','bell','공지사항'],['mobile-venue','pin','행사장 안내'],['mobile-engage','spark','참여 프로그램'],['mobile-board','board','행사 게시판']].map(([r,i,t])=>`<a href="#${r}"><div class="v4-row">${icon(i)}<strong>${t}</strong></div>${icon('chevron')}</a>`).join('')}</div><p class="v4-mobile-note">도움이 필요하면 현장의 등록 데스크에 문의하세요.</p>`,'more');
 ETViews['mobile-program-detail']=()=>{const i=A().ui.programIndex||0,p=W().program[i]||W().program[0];return mobileShell('프로그램',p?`<div class="v4-mobile-cover"><small>PROGRAM / ${e(p.tag)}</small><h2 style="font-size:30px;line-height:1.2">${e(p.title)}</h2><p>${e(p.location)}</p></div><h1 class="mt24">${e(p.title)}</h1><div class="v4-status-stack mt24"><a href="#mobile-program"><div><strong>${e(p.time)} — ${e(p.end)}</strong><small>${e(E().date)}</small></div>${icon('clock')}</a><a href="#mobile-venue"><div><strong>${e(p.location)}</strong><small>행사장 안내에서 위치를 확인하세요.</small></div>${icon('pin')}</a></div><p class="small muted mt24">본 화면은 등록된 프로그램의 시간·장소를 표시합니다. 세션 설명과 연사 정보는 운영자 콘텐츠 확정 후 추가합니다.</p>${L('전체 일정','mobile-program','w100 mt24','back')}`:empty('등록된 프로그램이 없습니다','행사 운영진의 안내를 기다려주세요.'),'program');};
 const entryStates={ 'mobile-entry':['phone','행사에 오신 것을<br>환영합니다.','초대받은 행사에서 티켓과 프로그램을 확인하세요.','나의 티켓 확인','mobile-ticket'],'mobile-invalid':['info','링크를 확인해 주세요.','행사 정보를 찾을 수 없습니다. 안내받은 QR을 다시 스캔하거나 등록 데스크에 문의하세요.','행사 홈 보기','mobile-home'],'mobile-expired':['clock','이 링크는<br>사용 기간이 지났습니다.','입장 정보 보호를 위해 링크를 종료했습니다. 등록 데스크에서 새 링크를 안내받으세요.','등록 안내 확인','mobile-notice'],'mobile-pre':['clock','곧, 새로운 만남이<br>시작됩니다.','아직 참여 프로그램이 열리지 않았습니다. 행사 일정과 안내를 먼저 확인해 주세요.','행사 일정 확인','mobile-program'],'mobile-ended':['check','함께해 주셔서<br>감사합니다.','오늘의 경험을 들려주세요. 여러분의 의견이 다음 만남을 더 좋게 만듭니다.','만족도 남기기','mobile-survey'],'mobile-offline':['wifi','연결이 잠시<br>끊어졌습니다.','전송 성공 안내가 없으면 접수가 완료된 것이 아닙니다. 네트워크를 확인하고 다시 시도해 주세요.','참가자 홈 다시 열기','mobile-home']};
 for(const [r,[i,t,s,b,go]]of Object.entries(entryStates)){ETViews[r]=()=>mobileShell('행사 안내',`<section class="v4-empty-state"><div class="state-icon">${icon(i)}</div><h1>${t}</h1><p>${s}</p>${L(b,go,'primary w100','arrow')}<div class="v4-mobile-note">디자인 상태 시연 · 실제 링크 인증 서비스는 별도 연동</div></section>`,'more');}
 const groupIcon={CORE:'spark',POLL:'chart',QUIZ:'help',QNA:'message',DRAW:'gift',PHOTO:'photo'};
 function sceneCards(){const filter=A().ui.sceneGroup||'ALL',x=XP();return `<div class="v4-scene-tabs" role="tablist" aria-label="장면 분류">${[['ALL','전체'],['CORE','기본'],['POLL','투표'],['QUIZ','퀴즈'],['QNA','Q&A'],['DRAW','추첨'],['PHOTO','포토']].map(([v,t])=>`<button role="tab" aria-selected="${filter===v}" class="${filter===v?'active':''}" data-action="v4-scene-filter" data-group="${v}">${t}</button>`).join('')}</div><div class="v4-scene-grid">${X.SCENES.filter(s=>filter==='ALL'||s.group===filter).map(s=>`<button class="v4-scene ${x.stage.preview.scene===s.id?'selected':''} ${x.stage.program.scene===s.id?'onair':''}" data-action="v4-preview" data-scene="${s.id}" aria-label="${s.name} 미리보기 선택" aria-pressed="${x.stage.preview.scene===s.id}"><div class="v4-scene-art">${ETScenes.markup(S(),{preview:true,scene:s.id})}</div><div><strong>${s.name}</strong><small>${s.code} / ${s.effect.toUpperCase()}</small></div></button>`).join('')}</div>`;}
 function controlsSide(){const x=XP(),d=S();return `<aside class="v4-control-side">${panel('다음 출력 설정','TAKE를 누르기 전에는 무대가 바뀌지 않습니다.',`${select('연출 프리셋','stagePreset',X.PRESETS.map(p=>[p.id,p.name]),x.stage.preview.preset)}${select('출력 화면비','stageAspect',['16:9','21:9','32:9','4:3'],x.aspect)}${select('효과 품질','stageQuality',[['auto','자동 조절'],['high','높음'],['low','2D 우선'],['static','정적 출력']],x.quality)}<div class="mt16">${B(x.reducedMotion?'모션 다시 켜기':'모션 줄이기','v4-motion','w100','spark')}</div><div class="v4-note">효과와 화면 전환은 시각적 연출입니다. 추첨 결과를 정하지 않습니다.</div>`)}${panel('투표 · 퀴즈','현재 세션 상태',`<div class="v4-row between small"><strong>투표</strong>${badge(W().poll.status==='OPEN'?'응답 수집':'마감',W().poll.status==='OPEN'?'success':'')}</div><div class="v4-row mt16">${B(W().poll.status==='OPEN'?'투표 마감':'투표 열기','v4-poll-toggle','w100','chart')}</div><div class="v4-row mt16">${B('정답 공개 준비','v4-quiz-reveal','w100','help')}</div><div class="field"><label for="v4-timer">타이머 (초)</label><div class="v4-row"><input id="v4-timer" type="number" min="5" max="600" value="30" style="width:90px">${B('시작','v4-countdown','sm','clock')}</div></div>`)}${panel('럭키드로우','입장 중 · 기존 당첨자 제외',`<div class="v4-row between"><span class="small">${fmt(EventouchCore.drawPool(W().participants,W().winners).length)}명 대상</span>${badge(x.draw.phase)}</div><div class="mt16">${x.draw.phase==='ROLLING'?B('추첨 결과 결정','v4-draw-resolve','ink w100','pause'):x.draw.phase==='REVEALED'?B('당첨 결과 확정','v4-draw-confirm','ink w100','check'):B('추첨 시작','v4-draw-start','ink w100','play')}</div>${x.draw.result?`<div class="v4-note"><strong>${e(x.draw.result.name)}</strong> · ${e(x.draw.result.ticket)}<br>결과는 저장됩니다. 무대 공개는 장면 선택 후 TAKE.</div>`:''}`)}</aside>`;}
 ETViews['live-control']=()=>{const x=XP(),d=S();return `<div class="v4-page">${head('라이브 제어실','다음 장면을 준비하고, 정확한 순간에 무대로 보냅니다.',L('사전 점검','preflight','','shield')+B('출력창 열기','v4-open-display','primary','external'),'LIVE EXPERIENCE / CONTROL')}${connection()}<div class="v4-studio"><div class="v4-control-main"><div class="v4-monitors"><section class="v4-monitor"><div class="v4-monitor-title">PREVIEW <span>다음 장면 · 무대 미반영</span></div>${ETScenes.markup(d,{preview:true})}<div class="v4-monitor-footer"><strong>${e(X.SCENES.find(s=>s.id===x.stage.preview.scene)?.name)}</strong>${badge(X.PRESETS.find(p=>p.id===x.stage.preview.preset)?.name)}</div></section><section class="v4-monitor is-program"><div class="v4-monitor-title">PROGRAM <span>${x.stage.emergency||'현재 송출 중'}</span></div>${ETScenes.markup(d,{preview:false})}<div class="v4-monitor-footer"><strong>${e(X.SCENES.find(s=>s.id===x.stage.program.scene)?.name)}</strong><span class="v4-status"><i></i> SEQ ${x.stage.sequence}</span></div></section></div><div class="v4-control-strip">${B('BLACK','v4-emergency','','monitor','data-mode="BLACK"')}${B('HOLD','v4-emergency','','pause','data-mode="HOLD"')}${B('LOGO','v4-emergency','','spark','data-mode="LOGO"')}${x.stage.emergency?B('원래 화면 복귀','v4-restore','','refresh'):''}${B('무대로 보내기 · TAKE','v4-take','primary v4-take','arrow')}</div><div class="v4-note" style="margin-top:-8px">BLACK은 검정 출력, HOLD는 현재 콘텐츠를 고정, LOGO는 안전 대기 화면입니다. 키보드: Ctrl/⌘ + Enter = TAKE · B = BLACK(입력란 외부).</div>${panel('장면 큐','카드를 선택하면 Preview에만 반영됩니다.',sceneCards())}${panel('선택할 질문','운영자가 승인한 질문만 무대에 보냅니다.',`<div class="v4-list">${W().qna.map(q=>`<div class="v4-list-item"><div><strong>${e(q.question)}</strong><p>${e(q.author)} · ${q.approved?'공개 승인':'검토 대기'}</p></div><div class="v4-row">${B(q.approved?'숨김':'승인','v4-qna-approve','sm','check',`data-id="${e(q.id)}" data-approved="${!q.approved}"`)}${q.approved?B('질문 선택','v4-qna-select','sm','arrow',`data-id="${e(q.id)}"`):''}</div></div>`).join('')}</div>`)}</div>${controlsSide()}</div>${footer()}</div>`;};
 ETViews.live=()=>ETScenes.markup(S())+`<div class="stage-output-tools"><span class="output-warning">리허설 출력 · F 전체화면</span>${B('전체화면','v4-fullscreen','','monitor')}${B('제어실 열기','v4-open-control','','back')}</div>`;
 ETViews.scenes=()=>`<div class="v4-page">${head('장면과 연출, 하나의 언어로.','28개 출력 장면과 6개 프리셋. 정보와 연출을 분리해 일관된 무대를 만듭니다.',L('라이브 제어실','live-control','primary','monitor'),'LIVE EXPERIENCE / LIBRARY')}<div class="v4-preset-grid">${X.PRESETS.map(p=>`<article class="v4-preset-card"><div class="sample" style="color:${p.accent}"></div><div class="copy"><h3>${p.name}</h3><p>${p.caption}</p>${B('미리보기 프리셋 선택','v4-preset','','spark',`data-preset="${p.id}"`)}</div></article>`).join('')}</div>${panel('Scene inventory','장면 상태를 포함한 28개 렌더링 변형',sceneCards())}<div class="v4-callout">기본 정보는 HTML, 부드러운 전환은 CSS, 입체 궤도·큐브는 Native WebGL, 입자·축하 효과는 Canvas2D로 동작합니다. GPU가 없거나 모션 축소 설정이면 정적/2D 화면으로 대체합니다.</div>${footer()}</div>`;
 ETViews.devices=()=>{const devices=window.ETTransport?.devices||[],isServer=window.ETTransport?.mode==='server';return `<div class="v4-page">${head('디스플레이 연결','같은 리허설 서버에 연결한 출력창을 확인합니다.',B('출력창 추가','v4-open-display','primary','plus'),'LIVE EXPERIENCE / DEVICES')}${connection()}${isServer&&devices.length?`<div class="v4-device-grid">${devices.map((d,i)=>`<article class="v4-device"><div class="v4-device-icon">${icon('monitor')}</div><div class="v4-row between"><h3>DISPLAY ${String(i+1).padStart(2,'0')}</h3>${badge('연결 중','success')}</div><p>${e(d.width||'—')} × ${e(d.height||'—')} · ${e(d.renderer||'초기화 중')}</p><div class="v4-progress"><i style="width:100%"></i></div><p class="v4-note">${e(d.id.slice(0,16))} · 마지막 확인 ${e(new Date(d.lastSeen).toLocaleTimeString('ko-KR'))}</p></article>`).join('')}</div>`:panel('아직 등록된 출력창이 없습니다','연결되지 않은 장치를 온라인으로 표시하지 않습니다.',`<div class="v4-inline-empty">${icon('monitor')}<p class="mt16">${isServer?'출력창을 열면 접속 상태가 표시됩니다.':'로컬 서버를 실행하면 디스플레이 접속 현황을 확인할 수 있습니다.'}</p></div>`)}${panel('출력 사양','이번 버전은 같은 행사 장면을 모든 연결 출력창에 공유합니다.',`<div class="v4-rule"><strong>지원 레이아웃</strong><span>16:9 · 21:9 · 32:9 · 4:3 / 사용자 지정 LED는 실제 장비 검수 필요</span></div><div class="v4-rule"><strong>영상 출력</strong><span>브라우저 전체화면. HDMI/LED 컨트롤러 연결은 운영자가 수행합니다.</span></div><div class="v4-rule"><strong>장치별 다른 화면</strong><span>그룹별 개별 라우팅은 다음 개발 범위입니다. 이번 버전은 동일 Program 미러링입니다.</span></div>`)}${footer()}</div>`;};
 ETViews.preflight=()=>{const secure=window.isSecureContext,server=window.ETTransport?.mode==='server'&&window.ETTransport?.online,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,checks=[['행사 정보',!!E().name&&!!E().date,'제목·일시·장소를 다시 확인하세요.'],['브라우저 저장',window.ETTransport?.storage!==false,'서버 모드에서는 서버 파일 저장, 단일 HTML은 로컬 저장을 사용합니다.'],['리허설 서버',server,server?'HTTP/WebSocket 연결을 확인했습니다.':'단일 파일은 브라우저 간 데모만 지원합니다. 서버 시작 방법은 실행 문서를 확인하세요.'],['카메라 보안 환경',secure,secure?'카메라 권한 요청이 가능한 환경입니다. 실제 승인·초점·스캔은 현장에서 테스트하세요.':'HTTPS 또는 localhost가 필요합니다. 수동 코드 입력은 사용할 수 있습니다.'],['출력창 연결',(window.ETTransport?.devices||[]).length>0,'출력창을 열고 화면비·전체화면·브라우저 확대율을 점검하세요.'],['사진 공개 상태',W().photos.some(p=>p.status==='APPROVED'),'승인된 사진만 무대와 참가자 포토월에 표시됩니다.'],['모션 정책',true,reduced?'운영체제의 모션 축소 설정을 존중합니다.':'연출 프리셋과 정적 출력 대안을 준비했습니다.'],['실제 장비 검수',false,'실제 LED·음향·프린터·iOS/Android 카메라·현장망 검수는 수행되지 않았습니다.']];return `<div class="v4-page">${head('행사 전, 한 번 더 확인하세요.','자동 점검 결과와 운영자가 확인할 사항을 구분합니다.',B('다시 점검','v4-refresh','primary','refresh'),'OPERATIONS / PREFLIGHT')}${panel('운영 준비 상태','환경을 관측한 결과입니다. 모든 항목을 임의로 통과 처리하지 않습니다.',checks.map(([t,ok,d])=>`<div class="v4-check-row"><div class="v4-check-dot ${ok?'':'warn'}">${icon(ok?'check':'info')}</div><div><strong>${t}</strong><p>${d}</p></div>${badge(ok?'확인됨':'확인 필요',ok?'success':'warning')}</div>`).join(''))}${panel('리허설 체크리스트','실행 후 운영자가 직접 체크합니다.',`<div class="v4-form-stack">${['출력창의 텍스트가 행사장 뒤쪽에서도 읽힌다.','BLACK → 복귀 동작을 실제 스크린에서 확인했다.','프리뷰 변경이 송출을 바꾸지 않는 것을 확인했다.','QR 수동 입력과 중복 체크인 안내를 확인했다.','사진 승인 및 무대 노출 흐름을 확인했다.','네트워크 단절 후 상태 재동기화를 확인했다.'].map((t,i)=>`<label class="v4-row"><input type="checkbox" data-preflight="${i}" ${A().ui.preflightChecks?.[i]?'checked':''}>${t}</label>`).join('')}</div>`)}${footer()}</div>`;};
 const cues=[['등록과 티켓','참가자 QR / 티켓 확인','mobile-ticket','brand-idle'],['현장 체크인','DEMO-1001 입장 처리','mobile-ticket','now-playing'],['모바일 투표','직접 선택해 실시간 연결','mobile-poll','poll-question'],['무대 결과','응답을 무대 그래프로','mobile-poll','poll-result'],['행운의 순간','추첨 시작 · 결과는 별도 결정','mobile-home','draw-rolling'],['당첨자 공개','결과 결정 → 공개 → 확정','mobile-home','draw-winner'],['우리의 포토월','사진 업로드 · 운영진 승인','mobile-photo','photo-grid'],['행사 이후','만족도와 결과보고서','mobile-survey','intermission']];
 ETViews.demo=()=>{const n=A().ui.demoCue||0,c=cues[n];return `<div class="v4-page">${head('하나의 행사, 연결된 경험.','운영자·참가자·무대를 한 화면에서 함께 시연합니다.',B('가상 데이터 초기화','v4-demo-reset','','refresh')+B('출력창 열기','v4-open-display','primary','external'),'PRODUCT THEATER / DEMO')}<div class="v4-callout">모든 데이터는 가상입니다. 선택한 단계는 화면을 안내하고, 실제 변경은 아래 실행 버튼 또는 참가자 화면에서 직접 수행합니다. 자동으로 투표·발송·당첨을 조작하지 않습니다.</div><div class="v4-demo-layout"><div class="v4-sequence">${cues.map(([t,s],i)=>`<button class="v4-cue ${i===n?'active':''}" data-action="v4-demo-cue" data-index="${i}"><span class="v4-cue-number">0${i+1}</span><div><strong>${t}</strong><small>${s}</small></div></button>`).join('')}</div><div><div class="v4-demo-frame output"><div class="v4-frame-title">PROGRAM / 실제 출력</div><iframe title="무대 출력 데모" src="${e(location.pathname)}?surface=display&embed=1#live"></iframe></div><div class="v4-demo-facts"><div class="v4-row between"><h3>${e(c[0])}</h3>${badge('STEP '+(n+1))}</div><p class="v4-sub">${e(c[1])}</p><div class="v4-demo-actions">${n===1?B('DEMO-1001 체크인','v4-demo-checkin','primary','scan'):n===4?B('추첨 시작','v4-draw-start','primary','play'):n===5?B(XP().draw.phase==='ROLLING'?'결과 결정':'당첨자 무대 공개',XP().draw.phase==='ROLLING'?'v4-draw-resolve':'v4-demo-take','primary','gift'):B('선택 장면 무대로 보내기','v4-demo-take','primary','monitor')}${n===4?B('추첨 연출 송출 · TAKE','v4-demo-take','','monitor',XP().draw.phase==='ROLLING'?'':'disabled'):''}${n===5&&XP().draw.phase==='REVEALED'?B('당첨 확정','v4-draw-confirm','','check'):''}${L('라이브 제어실','live-control','','arrow')}${n===6?L('사진 승인','photos','','photo'):n===7?L('결과보고서','report-canvas','','file'):''}</div></div><div class="v4-demo-facts"><h3>최근 데이터 흐름</h3><div class="v4-log">${A().state.audit.slice(0,8).map(a=>`<div>${e(new Date(a.at).toLocaleTimeString('ko-KR'))} &nbsp; ${e(a.action)}</div>`).join('')||'아직 실행한 작업이 없습니다.'}</div></div></div><div class="v4-demo-frame phone"><iframe title="참가자 모바일 데모" src="${e(location.pathname)}?surface=participant&embed=1#${c[2  function taskCentre(){const ts=R.operatorTasks(W(),{...T(),eventId:A().state.activeEventId});return panel('확인이 필요한 업무',`${ts.length}개 항목 · 실제 데모 상태 기준`,ts.length?`<div class="ux-task-list">${ts.map(t=>`<a href="#${t.route}" class="ux-task"><span class="ux-status-icon ${t.tone}">${icon(t.id==='photos'?'photo':t.id==='qna'?'message':'info')}</span><div class="grow"><h3>${e(t.title)}</h3><p>${e(t.body)}</p></div><span class="ux-task-cta">${e(t.label)} ${icon('chevron')}</span></a>`).join('')}</div>`:`<div class="ux-inline-empty">${icon('check')}<div><strong>지금 확인할 대기 업무가 없습니다.</strong><p>외부 발송·실제 데스크 장치 상태까지 정상이라는 뜻은 아닙니다.</p></div></div>`);}
 ETViews.overview=()=>{

  ${panel('최근 입퇴장 처리','초기 수치는 합성 상태입니다. 새로운 처리부터 이력이 쌓입니다.',logList(w.logs.slice(0,5)),L('전체 기록','check-history','sm','arrow'))}
  <div class="v4-mini-grid">${[['참가자 확인','participants','people','이름·연락처·티켓으로 검색'],['부스 운영','booths','gift',w.boothMode==='SELF'?'참가자 셀프 스탬프':'스탭 확인 인증'],['운영 사전 점검','preflight','shield','실제 장비 검수와 리허설 구분']].map(([title,route,i,body])=>`<a class="v4-quick" href="#${route}">${icon(i)}<div><strong>${title}</strong><small>${body}</small></div></a>`).join('')}</div>${footer()}</div>`;
 };
 function logList(logs,correct=false){return logs.length?`<div class="ux-log-list">${logs.map(l=>`<div class="ux-log-row"><span class="ux-status-icon ${l.action==='IN'?'success':l.action==='CORRECTION'?'warning':'neutral'}">${icon(l.action==='CORRECTION'?'refresh':l.action==='IN'?'check':'logout')}</span><div class="grow"><strong>${e(l.name)}</strong><p>${e(l.unit)}${l.reason?' · '+e(l.reason):''}</p></div><div class="ux-log-end"><strong>${l.action==='IN'?'입장':l.action==='OUT'?'퇴장':'처리 정정'}</strong><time>${time(l.at)}</time></div>${correct&&l.beforeState&&l.action!=='CORRECTION'&&W().logs.find(q=>q.participantId===l.participantId)?.id===l.id?B('정정','v5-correct','sm','','data-id="'+e(l.id)+'"'):''}</div>`).join('')}</div>`:empty('처리 기록이 없습니다','새로운 입퇴장 처리부터 이곳에 기록됩니다.');}
 ETViews['check-history']=()=>`<div class="v4-page">${head('입퇴장 처리 기록','정정은 원본을 지우지 않고 별도 기록으로 남깁니다.',B('CSV 내보내기','v4-export-checks','','download'),'ON-SITE / HISTORY')}${panel('최근 처리','원본·정정 이력 유지 · 최근 상태를 바꾼 작업만 사유와 함께 정정 가능',logList(W().logs.slice(0,50),true))}${footer()}</div>`;
 function filtered(){return R.findPeople(W().participants,{query:ui().query,group:ui().group,status:ui().status,cancelled:ui().includeCancelled});}
 function selectedIds(){return (ui().selectedPeople||[]).filter(id=>W().participants.some(p=>p.id===id&&!p.cancelled));}
 ETViews.participants=()=>{
  const rows=filtered(),size=12,totalPages=Math.max(1,Math.ceil(rows.length/size)),page=Math.min(Math.max(1,ui().page||1),totalPages),visible=rows.slice((page-1)*size,page*size),selected=selectedIds(),all=visible.length&&visible.every(p=>selected.includes(p.id));ui().page=page;

  return `<div class="v4-page ux-participant-management">${head('참가자','입장 상태를 확인하고 필요한 작업만 이어갑니다.',L('명단 가져오기','import','','upload')+B('참가자 추가','new-participant','primary','plus'),'PARTICIPANTS / DIRECTORY')}
  <section class="ux-directory"><div class="ux-directory-tools"><div class="ux-search">${icon('search')}<label class="sr-only" for="participant-search">이름·소속·연락처·티켓 검색</label><input id="participant-search" name="participant-search" value="${e(ui().query||'')}" placeholder="이름, 연락처 또는 티켓 코드" type="search" autocomplete="off"></div>${select('그룹','v5-group',['ALL','일반','VIP','STAFF'].map(x=>[x,x==='ALL'?'모든 그룹':x]),ui().group||'ALL')}${select('상태','v5-status',[['ALL','모든 상태'],['IN','입장 중'],['OUT','퇴장'],['NEVER','아직 미입장']],ui().status||'ALL')}</div>
