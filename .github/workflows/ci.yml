name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventouch_test
          POSTGRES_USER: eventouch
          POSTGRES_PASSWORD: eventouch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventouch -d eventouch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migrations apply to a clean database
        # Proves the migration chain is valid on its own, independently of
        # whether the integration suites happen to touch every table.
        env:
          DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_test
        run: npm run db:migrate

      - name: Re-verify migrations are idempotent
        env:
          DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_test
        run: npm run db:migrate

      - name: Run the suite against PostgreSQL
        # scripts/run-tests.cjs fails the job when anything is skipped, so a
        # green build here means the backend integration tests really ran.
        env:
          EVENTOUCH_TEST_DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_test
        run: npm test

      - name: Typecheck the TypeScript server modules
        # Converted modules run without a build step (Node 24 type stripping);
        # this is the check that keeps runtime and types the same file.
        run: npm run server:typecheck

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventouch_mobile
          POSTGRES_USER: eventouch
          POSTGRES_PASSWORD: eventouch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventouch -d eventouch_mobile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser for the audit
        run: npx playwright install --with-deps chromium

      - name: Audit real device profiles in both orientations
        # Catches overflow and sub-44px controls on profiles a mouse-driven
        # 390px check misses. It does not replace holding the device; see
        # scripts/device-checklist.md for what still needs a human.
        env:
          EVENTOUCH_MOBILE_DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_mobile
        run: |
          npm run db:migrate
          npm run mobile

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventouch_a11y
          POSTGRES_USER: eventouch
          POSTGRES_PASSWORD: eventouch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventouch -d eventouch_a11y"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser for the audit
        run: npx playwright install --with-deps chromium

      - name: Audit accessibility across the main screens
        # Serious and critical WCAG A/AA violations fail the job. Manual
        # review previously covered only screenshots someone happened to
        # capture, which is not a gate.
        env:
          EVENTOUCH_A11Y_DATABASE_URL: postgresql://eventouch:eventouch@localhost:5432/eventouch_a11y
        run: |
          npm run db:migrate
          npm run a11y
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # The new app has its own lockfile and build; this job is the only
      # place CI proves it typechecks and builds at all.
      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Typecheck the new app
        run: npx --prefix apps/web tsc --noEmit -p apps/web/tsconfig.json

      - name: Build the new app
        run: npm --prefix apps/web run build
